const SEVMAP = { HIGH:'High', MEDIUM:'Medium', LOW:'Low' }, SEVKO = { HIGH:'정지', MEDIUM:'알람', LOW:'경고' };
/* KPI와 같은 모양 — 색 + 모양 이중 표시 */
const SHAPE = { crit:'<svg width="14" height="14" viewBox="0 0 24 24" fill="var(--crit)"><path d="M12 3 2 21h20z"/></svg>',
                warn:'<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="var(--warn)"/></svg>',
                caut:'<svg width="14" height="14" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="var(--caut)"/></svg>' };
/* 우선순위 = 설비 등급 × 심각도 3×3 표 (데이터 설명서 3-4, 근거 대장 D-28) */
const LV = { 3:{k:'crit',ko:'높음',act:'즉시 대응'}, 2:{k:'warn',ko:'중간',act:'교대 내 확인'}, 1:{k:'caut',ko:'낮음',act:'추이 관찰'} };
/* 심각도는 데이터 용어(정지 · 알람 · 경고)로 — KPI 우선순위(높음 · 중간 · 낮음)와 말이 겹치지 않게 */
const SEVTXT = { High:'정지', Medium:'알람', Low:'경고' };
const SEVN = { High:3, Medium:2, Low:1 };
const sevCell = sev => `<span class="sevw" title="한계값 3단계: 경고 → 알람 → 정지 순으로 심해짐">${SEVTXT[sev]}</span>`;

const DEVICES = DATA.RANK.map(id => {
  const E=eqOf(id), rows=DATA.S1[id], by={};
  rows.forEach(r=>(by[r.tag]=by[r.tag]||[]).push(r));
  const tags = Object.entries(by).map(([tag,rs])=>{
    const T=TAG[tag], top=rs.slice().sort((a,b)=>SEV[SEVMAP[b.sev]]-SEV[SEVMAP[a.sev]]||b.at-a.at)[0];
    const same=rs.filter(r=>r.sev===top.sev).sort((a,b)=>b.at-a.at), last=same[0];
    return { name:shortName(T.desc), tag, v:DATA.CUR[tag], far:top.far, th:top.th, line:top.line, unit:T.unit, sev:SEVMAP[top.sev],
      at:hmK(last.at), atMs:last.at, firstMs:Math.min(...rs.map(r=>r.at)), n:same.length, occ:same.map(r=>({atMs:r.at, at:hmK(r.at), open:!r.clr, clr:r.clr?hmK(r.clr):null})), open:same.some(r=>!r.clr), clr:last.clr?hmK(last.clr):null,
      atype:`${SEVKO[top.sev]} ${top.bound==='ABOVE'?'↑':'↓'}`, bound:top.bound, pct:top.ex, prio:top.prio, base:T.base };
  }).sort((a,b)=>a.prio-b.prio||b.pct-a.pct);
  const stat = DATA.ALM.filter(a=>a[1]==='BASELINE' && TAG[a[0]].eq===id && a[5]<=DEMO_BASE && (a[5]>DEMO_BASE-12*3600e3 || !a[6]));
  return { id, name:E.name, loc:E.unitName, type:E.type, typeEn:E.typeEn, grade:E.grade, E, prio:rows[0].prio, tags, stat,
    rep7: DATA.ALM.filter(a=>a[1]==='LIMIT' && TAG[a[0]].eq===id && a[5]>DEMO_BASE-7*86400e3).length };
});
DEVICES.forEach(d => {
  d.score = 4 - d.prio; d.lv = LV[d.score];
  d.maxPct = DATA.S1[d.id][0].ex;
  d.firstTs = Math.min(...d.tags.map(t=>t.firstMs)); d.first = hmK(d.firstTs);
});
/* 대시보드와 AI 답변이 함께 쓰는 정렬 규칙 (D-28): 우선순위 → 이상 크기 → 설비 ID */
const cmp = (a,b) => a.prio-b.prio || b.maxPct-a.maxPct || a.id.localeCompare(b.id);
[...DEVICES].sort(cmp).forEach((d,i) => d.rank = i+1);
const byId = id => DEVICES.find(d => d.id === id);
const stOf = d => d.tags.some(t=>t.open) ? `${dur(d.firstTs)} 지속` : `해제 ${d.tags[0].clr}${d.tags[0].n>1?` · ${d.tags[0].n}회 반복`:''}`;
const pct = p => `${p.toFixed(0)}%`;
function dur(t0){ const m=Math.max(0,Math.floor((now().getTime()-t0)/60000)); return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`; }

let filter=null, selected=null;
const sortMode = () => document.getElementById('sortSel').value;

/* ---------- 상황 요약: KPI + 구역 ---------- */
function renderTop(){
  const ic = { crit:'<svg width="20" height="20" viewBox="0 0 24 24" fill="var(--crit)"><path d="M12 3 2 21h20z"/></svg>',
               warn:'<svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="var(--warn)"/></svg>',
               caut:'<svg width="20" height="20" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="var(--caut)"/></svg>',
               ok:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>' };
  let h = [3,2,1].map(s => {
    const ds = ACTIVE().filter(d=>d.score===s), L=LV[s];
    return `<button class="kpi ${L.k} ${filter===s?'on':''}" onclick="setFilter(${s})" title="${L.ko} 설비만 보기">
      <div><div class="lb">${ic[L.k]}우선순위 ${L.ko}</div><div class="sub">${L.act}</div></div>
      <div class="n"><b>${ds.length}</b><span>대</span></div></button>`;
  }).join('');
  h += `<button class="kpi ok ${filter===0?'on':''}" onclick="setFilter(0)" title="정상 설비 보기"><div><div class="lb">${ic.ok}정상</div><div class="sub">기준 범위 내</div></div>
        <div class="n"><b>${TOTAL-ACTIVE().length}</b><span>대</span></div></button>`;
  const kp=document.getElementById('kpis'); if(kp) kp.innerHTML = h;

  /* 구역별 상태 한 줄 — 이상 있는 구역부터 */
  const zs = ZONES.map(z => {
    const ds = z.eq.map(byId).filter(d=>d && !handledG(d));
    const top = ds.length ? Math.max(...ds.map(d=>d.score)) : 0;
    const parts = [3,2,1].map(s => { const n=ds.filter(d=>d.score===s).length; return n?`<span class="ic">${SHAPE[LV[s].k]}${LV[s].ko} <b>${n}</b></span>`:''; }).filter(Boolean);
    return { top, html:`<span><b>${z.z}</b> ${parts.length?parts.join(' '):'<span style="color:var(--text-3)">정상</span>'}</span>` };
  }).sort((a,b)=>b.top-a.top);
  if(document.getElementById('area')) document.getElementById('area').innerHTML = `<span class="al">구역</span>` + zs.map(z=>z.html).join('<span class="sep">|</span>');
}

/* 가이드 작업이 끝나고 알람이 모두 해제된 설비 → 정상(정비 후 감시 중)으로 내림. 작업 뒤 새 알람이 오면 다시 올라옴 */
/* 해제 규칙 (2026-11-16): 정비 담당자가 작업 완료 후 보고서까지 제출해야 발생 알람 · 우선순위 집계에서 빠지고 「정비 후 감시」로 내려간다.
   단, 알람이 아직 진행 중이면(값이 한계를 넘은 채) 보고서를 내도 해제하지 않는다 — 살아 있는 이상을 서류로 가리지 않기 위해.
   작업 완료 뒤 새 알람이 오면 다시 올라온다. */
const handledG = d => { const g=GUIDES.find(x=>x.dev===d.id && x.status==='작업 완료' && x.rep && x.rep.status==='제출됨'); return g && !d.tags.some(t=>t.open) && d.tags.every(t=>t.atMs < (g.doneAt||0)) ? g : null; };
function repReleased(g){ const d=byId(g.dev); if(!d) return;
  if(handledG(d)){ notify('eng', `${g.dev} 보고서 제출 — 정비 후 감시로 전환`, g.id); toast(`${g.dev} 보고서 제출 · 정비 후 감시로 전환했습니다`); }
  else if(d.tags.some(t=>t.open)){ notify('eng', `${g.dev} 보고서 제출 — 알람이 아직 진행 중이라 목록에 남김 (재점검 필요)`, g.id, true); toast(`${g.dev} 알람이 아직 진행 중이라 정비 후 감시로 전환하지 않았습니다`); }
  if(typeof render==='function') render(); }
const ACTIVE = () => DEVICES.filter(d=>!handledG(d));
/* ---------- 알람 목록 ---------- */
function render(){
  renderTop(); renderOverview(); almFoldApply();
  const box = document.getElementById('list');

  document.getElementById('sortSel').hidden = filter===0;
  const fl = filter===null ? '' : filter===0 ? '정상' : LV[filter].ko;
  document.getElementById('secTitle').textContent = filter===0 ? '정상 설비' : '발생 알람';
  document.getElementById('fTag').innerHTML = fl ? `<span class="ftag"><span class="fl">필터</span>${fl}<button title="필터 해제" aria-label="${fl} 필터 해제" onclick="setFilter(filter)">✕</button></span>` : '';
  if (filter===0){ box.innerHTML = normalTable(); return; }
  const ds = ACTIVE().filter(d => !filter || d.score===filter).sort(sortMode()==='rank' ? cmp : (a,b)=>b.firstTs-a.firstTs);
  if (!ds.length){ box.innerHTML='<div class="empty">진행 중 알람이 없습니다.</div>'; return; }
  if (!render.more) LIM = PAGE; render.more=false;
  box.innerHTML = table(ds);  /* 카드 보기는 뺌 (목록 한 가지로) */
  box.querySelectorAll('tr.urg').forEach(tr=>{ const p=tr.previousElementSibling, n=tr.nextElementSibling, id=tr.dataset.dev;
    if(!p || !p.classList.contains('urg') || p.dataset.dev!==id) tr.classList.add('uf');
    if(!n || !n.classList.contains('urg') || n.dataset.dev!==id) tr.classList.add('ul'); });
  watchMore();
}
/* 데이터가 많을 때: 처음 PAGE개만 그리고, 목록 끝이 보이면 PAGE개씩 더 그림 (무한 스크롤) */
let PAGE=30; let LIM=PAGE, dview='list', moreObs=null;
function watchMore(){ if(moreObs) moreObs.disconnect(); const m=document.getElementById('moreRow'); if(!m || !('IntersectionObserver' in window)) return;
  moreObs=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ moreObs.disconnect(); LIM+=PAGE; render.more=true; render(); } }, {root:document.getElementById('dash'), rootMargin:'200px'}); moreObs.observe(m); }
const moreHTML = (n, colspan) => colspan ? `<tr id="moreRow"><td colspan="${colspan}" class="more">아래로 내리면 ${n}건 더 불러옵니다</td></tr>` : `<div id="moreRow" class="more">아래로 내리면 ${n}대 더 불러옵니다</div>`;
function setDView(v){ dview=v; document.querySelectorAll('#dvSeg button').forEach(b=>b.setAttribute('aria-checked', b.dataset.v===v)); render(); }
/* 카드 보기 — 설비 하나에 카드 하나 (색 머리띠 없이, 우선순위는 도형으로만) */
function cards(ds){
  const clr=true;  /* 「해제 포함」 선택을 없앰: 값이 정상으로 돌아온 회차도 보고서 제출 전까지 늘 표시 */
  const list = (sortMode()==='recent' ? ds : [...ds].sort(cmp)).filter(d=>d.tags.some(t=>clr||t.open));
  const html = list.slice(0,LIM).map(d => {
    const ts = d.tags.filter(t => clr || t.open);
    const last = Math.max(...ts.map(t=>t.atMs));
    const rows = ts.map(t => `<div class="tr" title="${t.tag} · ${SEVTXT[t.sev]} · 발생값 ${fmtV(t.tag,t.far)} ${t.unit} (한계값 ${t.bound==='BELOW'?'↓':'↑'}${fmtV(t.tag,t.th)})">
        <span class="tn">${t.name}</span><span class="tp">${pct(t.pct)}</span>
        <span class="tv"><b class="sv">${SEVTXT[t.sev]}</b> · ${fmtV(t.tag,t.far)} ${t.unit} (한계 ${t.bound==='BELOW'?'↓':'↑'}${fmtV(t.tag,t.th)})</span>
</div>`).join('');
    return `<div class="card ${d.lv.k} ${selected===d.id?'picked':''}" role="button" tabindex="0" onclick="selectEq('${d.id}')" ondblclick="openEq('${d.id}')" onkeydown="if(event.key==='Enter')openEq('${d.id}')" title="누르면 AI 질문 대상으로 선택 · 두 번 누르거나 Enter면 설비현황">
      <div class="ch"><span>${d.rank}순위 · 우선순위 ${d.lv.ko}</span><span class="cht">${hmK(last)} 발생</span></div>
      <div class="cb"><div class="nm"><small>${d.id}</small><b>${d.name}</b></div>${rows}</div>
    </div>`;
  }).join('');
  return html ? `<div class="grid acards">${html}</div>${list.length>LIM?moreHTML(Math.min(PAGE,list.length-LIM)):''}` : '<div class="empty">진행 중 알람이 없습니다.</div>';
}
function table(ds){
  const rows=[];
  const clr=true;  /* 「해제 포함」 선택을 없앰: 값이 정상으로 돌아온 회차도 보고서 제출 전까지 늘 표시 */
  ds.forEach(d => d.tags.forEach(t => t.occ.forEach((o,k) => { if(clr || o.open) rows.push({d,t,o,sub:k>0 && (clr || t.occ.slice(0,k).some(x=>x.open))}); })));
  if (sortMode()==='recent') rows.sort((a,b)=> b.o.atMs-a.o.atMs);
  const total=rows.length; rows.length=Math.min(rows.length,LIM);
  let r='', prev=null;
  rows.forEach(({d,t,o,sub}) => { if(sortMode()==='recent') sub=false;
    const head = sortMode()==='recent' || prev!==d.id; prev=d.id;
    r += `<tr data-dev="${d.id}" class="${head?'g':''} ${sub?'occ':''} ${selected===d.id?'picked':''} ${d.lv.k==='crit'?'urg':''}" onclick="selectEq('${d.id}')" ondblclick="openEq('${d.id}')" title="누르면 AI 질문 대상으로 선택 · 두 번 누르면 설비현황">
      <td>${head?`<span class="ic" title="우선순위 ${d.lv.ko}">${SHAPE[d.lv.k]}<b class="rkn">${d.rank}</b></span>`:''}</td>
      <td>${head?`<button class="eqlink" onclick="event.stopPropagation();openEq('${d.id}')" title="${d.id} 설비현황 보기">${d.name}<span>›</span></button><div class="mu">${d.id}${watchOf(d.id)?' · <b class="watch">정비 후 감시 중</b>':''}</div>`:''}</td>
      <td class="num">${head?d.grade:''}</td>
      <td class="tagid">${t.tag}</td>
      <td>${t.name}</td>
      <td>${sevCell(t.sev)}</td>
      <td class="num ctr" title="${sub?'회차별 최고값은 1초 데이터로 계산 예정 · 위 행이 12시간 최고':`12시간 중 가장 멀리 간 값 · 현재 ${fmtV(t.tag,t.v)} ${t.unit}`}">${sub?'<span class="mu">—</span>':`<b>${fmtV(t.tag,t.far)}</b><span class="u">${t.unit}</span>`}</td>
      <td class="num thv ctr"><span class="dir">${t.bound==='BELOW'?'↓':'↑'}</span>${fmtV(t.tag,t.th)}<span class="u">${t.unit}</span></td>
      <td class="num" title="(발생값 − 평소 ${fmtV(t.tag,t.base)}) ÷ (정지값 − 평소)">${sub?'<span class="mu">—</span>':`<b>${pct(t.pct)}</b>`}</td>
      <td class="num" title="${mdK(o.atMs)} 발생">${o.at}</td>
      <td class="num ${o.open?'':'mu'}">${o.open?dur(o.atMs):`해제 ${o.clr}`}</td>
    </tr>`;
  });
  return `<table><thead><tr><th>순위</th><th>설비</th><th class="num" title="설비 중요도 등급 (1이 가장 중요) — 우선순위를 정하는 재료">설비 등급</th><th>태그</th><th>태그 설명</th><th title="넘은 한계선 — 경고 < 알람 < 정지. 위 우선순위 카드는 이 단계와 설비 등급을 합쳐 정함">심각도</th><th class="num ctr" title="12시간 중 가장 멀리 간 값">발생값</th><th class="num ctr">한계값</th><th class="num">이상 크기</th>
    <th class="num">발생 시각</th><th class="num" title="진행 중이면 경과 시간, 값이 한계선 안으로 돌아왔으면 해제 시각. 해제돼도 목록에 남고, 정비 담당자가 작업 완료 후 보고서를 제출하면 정비 후 감시로 넘어갑니다">경과</th></tr></thead><tbody>${r||`<tr><td colspan="11" class="none">진행 중인 알람이 없습니다</td></tr>`}${total>LIM?moreHTML(Math.min(PAGE,total-LIM),11):''}</tbody></table>`;
}
function setFilter(f){ filter = (filter===f)?null:f; if(filter!==null && almFolded){ almFolded=false; try{ localStorage.setItem('tmi-almfold','0'); }catch(e){} } render();
  /* 필터를 눌렀을 때 알람 목록이 화면 밖에 있으면 목록 위치로 내려 줌 (아래 현황 패널을 보다가 위 KPI를 누른 경우 대비) */
  const m=document.getElementById('dash'), h=document.getElementById('secTitle'); if(filter!==null && h.getBoundingClientRect().top > m.getBoundingClientRect().bottom-160) h.closest('.sec').scrollIntoView({behavior:'smooth',block:'start'}); }
/* 정상 설비 목록 — 유닛 · 유형 · 등급 (설비 마스터) */
function normalTable(){
  /* 발생 알람 표와 앞 칸(순위 자리 · 설비 · 설비 등급)을 맞추고, 「정상인가 · 무엇을 지켜보나」에 답하는 칸만 둔다 (리뷰 R3) */
  const rows = EQUIP.filter(e=>!byId(e.id) || handledG(byId(e.id)));
  return `<table><thead><tr><th>순위</th><th>설비</th><th class="num" title="설비 중요도 등급 (1이 가장 중요)">설비 등급</th><th>상태</th><th>감시 조건</th></tr></thead><tbody>${
    rows.map(e=>{ const hg=byId(e.id)&&handledG(byId(e.id)), w=hg&&hg.risks.find(r=>r.k==='감시 조건');
      return `<tr tabindex="0" onclick="openMaster('${e.id}')" onkeydown="if(event.key==='Enter')openMaster('${e.id}')" title="${e.id} 설비 마스터 보기">
        <td><span class="ic" title="정상">${OKIC}</span></td>
        <td><b>${e.name}</b><div class="mu">${e.id} · ${e.aliases[0]||''}</div></td>
        <td class="num">${e.grade}</td>
        <td>${hg?'<b class="watch">정비 후 감시 중</b>':'정상'}</td>
        <td>${w?w.cond:'<span class="mu">—</span>'}</td></tr>`; }).join('')
  }</tbody></table>`;
}

let eqFrom=null;
function openEq(id){ selected=id; eqFrom = ['gd','ms','mg','dash'].includes(view) ? view : null; showView('eq'); }

/* ===== 설비현황 ===== */
let view='dash', period='24h';
const PER = { '1h':3600e3, '24h':86400e3, '7d':7*86400e3 };
/* 역할별 화면 — 같은 데이터(GUIDES·DEVICES)를 역할의 과업 순서에 맞춰 보여 줌 */
const ROLES = {
  eng:{ name:'이엔지', team:'울산공장 현장 2팀', label:'현장 엔지니어', brand:'설비 모니터링',
        nav:[['dash','대시보드'],['eq','설비현황'],['gd','가이드'],['rh','보고서 관리']], home:'dash' },
  mnt:{ name:'김정비', team:'정비 2팀', label:'정비 담당자', brand:'정비 어시스턴트', eq:'C-2100',   /* 정비 담당자 1명 = 설비 1대 담당 */

  if(/매뉴얼|메뉴얼|절차|작업표준/.test(t)) return 'manual';
  if(/가이드/.test(t)) return 'guide';

      if(lv===1){ title=t; i++; continue; }
      let id;
      if(lv<=3){ id=(t.match(/^([\d.]+)/)||[,''])[1].replace(/\.$/,''); if(lv===3) h3=id; else h3=id; }
      else { const c=t.match(/^([①-⑳])/); id = h3 + (c?c[1]:t.slice(0,4)); }
      cur={id, lv, t, html:''}; secs.push(cur); i++; continue;
    }
    if(L.startsWith('|')){ const rows=[]; while(i<lines.length && lines[i].startsWith('|')){ rows.push(lines[i]); i++; }
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      push(`<table class="tbl2 mvt"><thead><tr>${cells(rows[0]).map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`); continue; }
    if(L.startsWith('> ')){ const cls=/경고/.test(L)?'w':/주의/.test(L)?'c':'n'; push(`<div class="mvq ${cls}">${inl(L.slice(2))}</div>`); i++; continue; }
    if(/^\s*- /.test(L)){ const ind=L.match(/^\s*/)[0].length>0; push(`<p class="mvl ${ind?'ind':''}">${inl(L.replace(/^\s*- /,''))}</p>`); i++; continue; }
    if(L.trim()&&L.trim()!=='---') push(`<p>${inl(L)}</p>`);
    i++;
  }
  return {title, secs};
}
function openMan(id,code){
  const d=byId(id), docId=code.split(' ')[0], anc=code.split(' ')[1]||'';
  const {title,secs}=mdSections(manMd(docId,d));
  const toc=secs.filter(x=>x.lv<=4).map(x=>`<button class="lv${x.lv} ${x.id===anc?'on':''}" onclick="mvGo('${x.id}')">${x.t.replace(/\(.*\)/,'')}</button>`).join('');
  const body=secs.map(x=>`<section class="mvs ${x.id===anc?'hl':''}" id="mv-${x.id}"><h${Math.min(x.lv+2,6)} class="mvh">${x.t}</h${Math.min(x.lv+2,6)}>${linkRefs(x.html)}</section>`).join('');
  showMdl(`${docId} · ${title}`, `<div class="mv"><nav class="mv-toc">${toc}</nav><div class="mv-body" id="mvBody">${body}</div></div>`,
    anc ? `해당 조항 ${anc} 강조${MANDOC[docId]?' · 매뉴얼 원문 (팀 검토 전 초안)':''}` : '매뉴얼 원문', '', true);
  setTimeout(()=>mvGo(anc,true),30);
}

/* 문서 본문의 「MAN-C-2100 6.2절」 · 「CASE-…」를 알아보고, 누르면 그 자리에서 원문을 펼침 (팝업 위에 팝업을 띄우지 않음) */
function linkRefs(html){
  let last=null;
  return html.replace(/(MAN-[A-Z0-9]+(?:-[A-Z0-9]+)*)(?:\s+(\d+(?:\.\d+)*)절?)?|(?<![\w-])(\d+\.\d+)절|(CASE-[A-Z]-\d{4}-\d{8})/g,(m,man,sec,bare,cs)=>{
    if(cs) return KDOC.CASE[cs]?`<button class="refk" onclick="refToggle(this,'${cs}','')">${cs}</button>`:m;
    if(man){ if(!MANDOC[man]) return m; last=man; return `<button class="refk" onclick="refToggle(this,'${man}','${sec||''}')">${m}</button>`; }
    if(bare && last) return `<button class="refk" onclick="refToggle(this,'${last}','${bare}')">${m}</button>`;
    return m;
  });
}
function refToggle(btn,doc,sec){
  const host=btn.closest('p,li,td,.mvq,section')||btn.parentElement, key=`${doc} ${sec}`.trim();
  const old=host.nextElementSibling; if(old && old.classList.contains('refx') && old.dataset.k===key){ old.remove(); btn.classList.remove('on'); return; }
  if(old && old.classList.contains('refx')) old.remove();
  let body='', open='';
  if(/^CASE-/.test(doc)){ const f=KDOC.CASE[doc].fm; body=`<p><b>${f.title}</b></p><p>고장 모드 ${fmName(f.failure_mode)} · 원인 ${f.root_cause} · 정지 ${f.downtime_h} h</p>`; open=`openCase('${doc}')`; }
  else { const {secs}=mdSections(MANDOC[doc]); const x=sec?secs.find(z=>z.id===sec):secs[0]; body=x?`<p><b>${x.t}</b></p>${x.html}`:'<p>해당 조항 없음</p>'; open=`openMan('',\`${key}\`)`; }
  const box=document.createElement('div'); box.className='refx'; box.dataset.k=key;
  box.innerHTML=`<div class="refx-hd"><span>${key}</span><button class="btn line" onclick="${open}">원문 전체 보기</button></div>${body}`;
  host.after(box); btn.classList.add('on');
}
function mvGo(id,first){
  const el=document.getElementById('mv-'+id), box=document.getElementById('mvBody'); if(!el||!box) return;
  box.scrollTo({top:el.offsetTop-box.offsetTop-8, behavior:first?'auto':'smooth'});
  document.querySelectorAll('.mv-toc button').forEach(b=>b.classList.toggle('on', b.getAttribute('onclick')===`mvGo('${id}')`));
}

/* ===== 트렌드 화면 · 딥링크 =====
   흐름: 질문 → 설비 ID · 센서 종류 · 기간을 규칙으로 뽑음 → 딥링크 말풍선(자동 이동 안 함) → 누르면 조건이 맞춰진 트렌드 화면
   링크는 규칙만 만든다. LLM이 만든 URL은 쓰지 않고, 열 때 다시 검증한다 (보안 점검 C2) */
const SENSOR_KIND = [
  [/진동/, ['PROX_RADIAL','ACCEL_CASING','ACCEL_IMPACT'], '진동'],
  [/축\s*위치|변위|축방향/, ['PROX_AXIAL'], '축 위치'],
  [/로드\s*드롭/, ['PROX_ROD'], '로드 드롭'],
  [/온도/, ['RTD_TEMP'], '온도'],
  [/압력/, ['PRESS_TX'], '압력'],
  [/유량/, ['FLOW_TX','FLOW_TX_LIQ'], '유량'],
  [/회전수|속도|rpm/i, ['SPEED_PICKUP'], '회전수'],
  [/전류/, ['CURRENT_TX'], '전류'],
];
const TYPE_WORD = [[/압축기/, ['CC','RC'], '압축기'], [/터빈/, ['TU'], '터빈'], [/모터|전동기/, ['MO'], '모터'], [/펌프/, ['PU'], '펌프'], [/팬|송풍기/, ['FA'], '송풍기']];
let TR = { eq:null, tags:[], period:'7d' }, trFrom='dash';
const trHash = q => `#/trend?eq=${q.eq}&tags=${q.tags.join(',')}&period=${q.period}`;
/* 질문 → 조회 조건. 설비 후보가 둘 이상이면 되묻기 (멘토 시나리오 2) */
function parseTrend(t){
  let eq = mentioned(t), cands=[];
  if(!eq){ const tw=TYPE_WORD.find(([re])=>re.test(t)); if(tw){ cands=EQUIP.filter(e=>tw[1].includes(e.tcode)).map(e=>e.id); if(cands.length===1) eq=cands[0]; } }
  if(!eq && !cands.length && selected) eq=selected;
  if(!eq) return { ask:true, cands: cands.length?cands:EQUIP.map(e=>e.id) };
  const E=eqOf(eq), up=t.toUpperCase();
  let tags = E.tags.filter(x=>up.includes(x)), kind=null;
  if(!tags.length){
    const sk=SENSOR_KIND.find(([re])=>re.test(t));
    if(sk){ kind=sk[2]; tags=E.tags.filter(x=>sk[1].includes(TAG[x].sensor));
      if(/반구동/.test(t)) tags=tags.filter(x=>/^NDE/.test(TAG[x].part)); else if(/구동측/.test(t)) tags=tags.filter(x=>/^DE/.test(TAG[x].part));
      const ax=t.match(/(?:^|[^A-Za-z])([XY])(?![A-Za-z])/); if(ax) tags=tags.filter(x=>x.endsWith(ax[1]));
    }
  }
  if(!tags.length){ const d=byId(eq); tags = d ? trendTags(d).map(x=>x.tag) : E.tags.slice(0,4); }
  const period = /1\s*시간|한\s*시간/.test(t) ? '1h' : /24\s*시간|하루|오늘/.test(t) ? '24h' : '7d';
  return { eq, tags, period, kind };
}
/* 링크 검증 — 설비가 있고, 태그가 그 설비 것이고, 기간이 정해진 값인가 */
function checkTrend(q){
  const E=eqOf(q.eq); if(!E) return null;
  const tags=(q.tags||[]).filter(x=>E.tags.includes(x));
  return { eq:E.id, tags: tags.length?tags:E.tags.slice(0,4), period: PER[q.period]?q.period:'7d' };
}
function openTrend(eq, tags, per, from){
  const q=checkTrend({eq, tags, period:per}); if(!q){ toast('링크 조건이 맞지 않습니다'); return; }
  TR=q; trFrom = from || (view==='tr'?trFrom:view);
  try{ history.replaceState(null,'',trHash(TR)); }catch(e){}
  showView('tr'); document.getElementById('trd').scrollTop=0;
}
function readHash(){
  const m=(location.hash||'').match(/^#\/trend\?(.*)$/); if(!m) return false;
  const p=new URLSearchParams(m[1]); openTrend(p.get('eq'), (p.get('tags')||'').split(',').filter(Boolean), p.get('period'), 'dash'); return true;
}
window.addEventListener('hashchange', readHash);

/* 최근 7일 추이 — 정답 세트와 같은 규칙: (직전 6시간 평균 − 7일 전 첫 24시간 평균) ÷ 평소 표준편차
   +2 넘으면 상승 · −2 밑이면 하강 · 사이면 안정 · 1.5~2.5는 「경계」 */
function trendOf(tag){
  const T=TAG[tag], h=DATA.H[tag]; if(!h) return null;
  const avg=a=>{ const v=a.filter(x=>x!=null); return v.length? v.reduce((s,x)=>s+x,0)/v.length : null; };
  const a=avg(h[0].slice(0,24)), b=avg(h[0].slice(-6)), z=(b-a)/(T.std||1e-9), az=Math.abs(z);
  const dir = z>2?'상승':z<-2?'하강':'안정', edge = az>=1.5 && az<=2.5;
  const mx=Math.max(...h[1].filter(x=>x!=null)), mn=Math.min(...h[2].filter(x=>x!=null));
  const hi=T.hi.find(x=>x!=null), lo=T.lo.find(x=>x!=null);
  const over = h[1].filter((x,i)=>(hi!=null&&x!=null&&x>=hi) || (lo!=null&&h[2][i]!=null&&h[2][i]<=lo)).length;
  return { dir, edge, z, a, b, mx, mn, over, hi, lo };
}
const DIR_IC = { '상승':'↗', '하강':'↘', '안정':'→' };
function trendLine(tag){
  const r=trendOf(tag), T=TAG[tag]; if(!r) return '';
  return `최근 7일 <b>${r.dir}${r.edge?' (경계)':''}</b> — 첫날 평균 ${fmtV(tag,r.a)} → 최근 6시간 평균 ${fmtV(tag,r.b)} ${T.unit} (${r.z>=0?'+':''}${r.z.toFixed(1)}σ) · 7일 ${T.hi.some(x=>x!=null)?`최고 ${fmtV(tag,r.mx)}`:`최저 ${fmtV(tag,r.mn)}`} · 경고선 넘은 시간 ${r.over}시간`;
}

/* 채팅: 딥링크 말풍선 — 자동으로 이동하지 않고 사용자가 눌러야 이동 */
function trendAnswer(t){
  const q=parseTrend(t);
  if(q.ask) return { eq:null, html:`<h5>어느 설비인가요?</h5>${q.cands.length<EQUIP.length?'같은 이름의 설비가 여러 대 있습니다.':'설비 이름을 찾지 못했습니다.'} 아래에서 골라 주세요.
    <div class="lk">${q.cands.map(id=>lkS(`${id} ${eqOf(id).name}`,`ask('${id} ${t.replace(/'/g,'')}')`)).join('')}</div>` };
  const E=eqOf(q.eq), url=trHash(q);
  return { eq:q.eq, html:`<h5>${E.id} ${E.name} · ${q.kind||'주요 센서'} ${q.tags.length}개 · ${PERIOD_LB[q.period]}</h5>

    <button class="dlink" onclick="openTrend('${q.eq}',${JSON.stringify(q.tags).replace(/"/g,"'")},'${q.period}')">

}

/* ---------- 공통 ---------- */
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1700); }
const DAYS=['일','월','화','수','목','금','토'];
function tick(){
  const n=now();
  clkD.textContent=`${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 ${DAYS[n.getDay()]}`;
  clkT.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');

/* ---------- AI 패널 너비 조절 (320~640px, 더블클릭 = 기본 400px) ---------- */
(function(){
  const MIN=320, MAX=640, DEF=400, rz=document.getElementById('resizer'), root=document.documentElement;
  const set = w => { w=Math.min(MAX,Math.max(MIN,Math.round(w))); root.style.setProperty('--agw', w+'px'); try{ localStorage.setItem('tmi-agw', w); }catch(e){} };
  try{ const saved=+localStorage.getItem('tmi-agw'); if(saved) set(saved); }catch(e){}
  rz.addEventListener('pointerdown', e => {
    rz.setPointerCapture(e.pointerId); rz.classList.add('drag'); document.body.classList.add('resizing');
    const move = ev => set(window.innerWidth - ev.clientX);
    const up = () => { rz.classList.remove('drag'); document.body.classList.remove('resizing'); rz.removeEventListener('pointermove',move); rz.removeEventListener('pointerup',up); };
    rz.addEventListener('pointermove', move); rz.addEventListener('pointerup', up);
  });
  rz.addEventListener('dblclick', () => set(DEF));
})();


/* ===== 대시보드 현황 4패널 (v2 정리판) =====
   교수님 피드백 「대시보드가 아니다」 대응 — 알람이 0건인 아침에도 볼 것이 있게.
   패널마다 「핵심 숫자 1줄 → 그림 1개 → 한 줄 결론」. 세부 수치는 툴팁, 세부 화면은 클릭.
   모든 숫자는 화면에 이미 들어 있는 데이터(DATA.ALM · GUIDES · KDOC.CASE)에서 계산한다. 새로 지어낸 값 없음.
   하루 = 06:00 ~ 다음 날 06:00 (교대 시작 기준). 기준 시각 = DATA.now */
const OV = { C1:'#1677FF', C2:'#13C2C2' };
const DAY = 86400e3;
const ovMD = ms => { const z=new Date(ms); return `${z.getMonth()+1}/${z.getDate()}`; };
const OKIC = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>';
const icOf = k => k==='ok' ? OKIC : SHAPE[k];
const eqShort = e => e.name.replace(new RegExp('^'+e.unitName+' '),'');
/* 한계 알람(LIMIT)은 1건씩, 통계 이상(BASELINE)은 같은 태그 · 같은 시작 시각을 1건으로 (평균 · 최대 · 표준편차가 따로 기록되므로) */
function almCount(lo, hi, eq){
  let L=0; const B=new Set();
  DATA.ALM.forEach(a=>{ if(a[5]<lo || a[5]>=hi) return; if(eq && TAG[a[0]].eq!==eq) return;
    if(a[1]==='LIMIT') L++; else B.add(a[0]+'@'+a[5]); });
  return { L, B:B.size, T:L+B.size };
}
/* 알람 이후 단계 — 가이드 · 보고서 상태에서 바로 읽음 */
const STAGES = [
  { k:'diag',  t:'방향 결정',        who:'엔지니어' },
  { k:'ready', t:'점검 대기',        who:'정비' },
  { k:'work',  t:'정비 중',          who:'정비' },
  { k:'rep',   t:'보고서 대기',      who:'정비' },
  { k:'watch', t:'정비 후 감시',     who:'엔지니어' } ];
function stageOf(id){
  const d=byId(id), g=GUIDES.find(x=>x.dev===id);
  if(g && g.status==='작업 완료'){ if(g.rep.status!=='제출됨') return 'rep'; return (d && !handledG(d) && d.tags.some(t=>t.open)) ? 'diag' : 'watch'; }  /* 보고서를 냈는데도 알람이 살아 있으면 다시 방향 결정으로 */
  if(!d || handledG(d)) return null;
  if(!g || g.status==='작성 중') return 'diag';
  if(g.status==='전달됨') return 'ready';
  return g.steps.some((_,i)=>g.checks['p'+i]) ? 'work' : 'ready';
}
function workItems(){
  const ids = [...new Set([...ACTIVE().map(d=>d.id), ...GUIDES.map(g=>g.dev)])];
  return ids.map(id=>{ const d=byId(id), g=GUIDES.find(x=>x.dev===id), st=stageOf(id); if(!st) return null;
    const sd=g?g.steps.filter((_,i)=>g.checks['p'+i]).length:0;
    const next = { diag:'AI 진단 확인 후 점검 방향 고르기', ready:`${g?g.id:''} 정비 담당 확인 대기`, work:`조치 ${sd} / ${g?g.steps.length:0} 단계 진행`,
      rep:'작업 완료 — 정비 보고서 작성', watch:(watchOf(id)||{}).t||'정비 후 감시' }[st];
    return { id, d, g, st, next, since: d ? d.firstTs : (g?g.made:DEMO_BASE) };
  }).filter(Boolean).sort((a,b)=>cmp(a.d,b.d));
}
function openWork(id, st){
  const g=GUIDES.find(x=>x.dev===id);
  if(st==='diag' || st==='watch' || !g){ openEq(id); return; }
  openGuide(g.id);
}

/* --- 그리기 도구 --- */
function donut(parts, size, stroke, center, label){
  const r=(size-stroke)/2, C=2*Math.PI*r, tot=parts.reduce((s,p)=>s+p.v,0)||1, gap=parts.filter(p=>p.v>0).length>1?2:0;
  let off=0;
  const segs = parts.filter(p=>p.v>0).map(p=>{ const len=C*p.v/tot; const s=`<circle class="seg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${stroke}"
      stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" data-tip="${p.tip||`${p.k} ${p.v}`}"/>`; off+=len; return s; }).join('');
  return `<div class="dn" style="width:${size}px;height:${size}px" role="img" aria-label="${label}">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--fill-2)" stroke-width="${stroke}"/>${segs}</svg>
    <div class="c">${center}</div></div>`;
}
const niceMax = m => { if(m<=4) return 4; const p=Math.pow(10,Math.floor(Math.log10(m))), n=m/p; return (n<=2?2:n<=5?5:10)*p; };
/* 세로 막대 — rows: [{x, sub, vals:[...], tip, cur, lab}] · 숫자는 lab 표시한 막대에만 (나머지는 툴팁) */
function colChart(rows, series, H){
  const mx=niceMax(Math.max(1,...rows.map(r=>r.vals.reduce((s,v)=>s+v,0))));
  const grid=[0,.5,1].map(f=>`<div class="gl ${f===0?'b':''}" style="bottom:${f*(H-20)}px"><span>${Math.round(mx*f)}</span></div>`).join('');
  const cols=rows.map(r=>{ const tot=r.vals.reduce((s,v)=>s+v,0);
    const segs=r.vals.map((v,i)=>v?`<i style="height:${(v/mx)*(H-20)}px;background:${series[i].c}"></i>`:'').join('');
    return `<div class="col ${r.cur?'cur':''}" data-tip="${r.tip}">${r.lab?`<span class="tv">${tot}</span>`:''}<div class="stk">${segs}</div></div>`; }).join('');
  return `<div class="cc" style="height:${H}px">${grid}${cols}</div>
    <div class="cx">${rows.map(r=>`<span class="${r.cur?'b':''}">${r.x}${r.sub?`<small>${r.sub}</small>`:''}</span>`).join('')}</div>`;
}
const delta = (cur, prev, unit='') => { const d=cur-prev; return d>0?`<span class="dl up">▲${d}${unit}</span>`:d<0?`<span class="dl dn2">▼${-d}${unit}</span>`:`<span class="dl eq">변화 없음</span>`; };
const hdr = (no, t, link) => `<div class="ovc-hd"><h4>${t}</h4>${link||''}</div>`;

/* ① 설비 전체 상태 — 도넛(비율) + 설비 타일(어느 설비인지) */
function ovFleet(){
  const rows = EQUIP.map(e=>{ const d=byId(e.id), act=!!(d && !handledG(d));
    return { e, d, act, k: act?d.lv.k:'ok', score: act?d.score:0, w:watchOf(e.id), st: stageOf(e.id) }; });
  const parts=[3,2,1].map(s=>({ k:`우선순위 ${LV[s].ko}`, v:rows.filter(r=>r.score===s).length, c:`var(--${LV[s].k})` }))
    .concat([{ k:'정상', v:rows.filter(r=>!r.score).length, c:'var(--ok)' }]);
  parts.forEach(p=>p.tip=`${p.k}: ${p.v}대`);
  const abn=TOTAL-parts[3].v;
  /* 범례 = 우선순위 필터 (예전 KPI 칸 역할). 누르면 발생 알람 목록이 그 우선순위만 */
  const lg=[[3,'높음',LV[3].k],[2,'중간',LV[2].k],[1,'낮음',LV[1].k],[0,'정상','ok']].map(([sc,l,k])=>{ const n=rows.filter(r=>r.score===sc).length;
    return `<button class="li ${filter===sc?'on':''}" onclick="setFilter(${sc})" title="${l} 설비만 알람 목록에 보기"><span class="ic">${icOf(k)}</span><span class="l">${l}</span><b>${n}</b><span class="u">대</span></button>`; }).join('');
  document.getElementById('fleetDn').innerHTML = donut(parts,150,24,`<b>${abn}<span style="font-size:16px;color:var(--text-3)"> / ${TOTAL}</span></b><span>이상 설비</span>`, `전체 ${TOTAL}대 중 이상 ${abn}대`);
  document.getElementById('fleetLg').innerHTML = lg;
}

/* 꺾은선 차트 (SVG) — 흐름만 보이게: 2px 선, 첫 계열은 옅은 면, 끝점 표시 · 값은 끝점(또는 지정 점)에만. 세부는 툴팁 */
function lineChart(o){
  const W=320, H=o.h||170, L=26, R=12, T=18, B=22, n=o.xs.length;
  const mx=niceMax(Math.max(1,...o.series.flatMap(s=>s.vals)));
  const X=i=> L + (n===1?0:i*(W-L-R)/(n-1)), Y=v=> T + (1-v/mx)*(H-T-B);
  const grid=[0,.5,1].map(f=>{ const y=Y(mx*f); return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${f===0?'#D9D9D9':'#F0F0F0'}" stroke-width="1"/><text x="${L-6}" y="${y+3.5}" text-anchor="end" class="ax">${Math.round(mx*f)}</text>`; }).join('');
  const lines=o.series.map((s,si)=>{ const pts=s.vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    const area= si===0 ? `<polygon points="${X(0)},${Y(0)} ${pts} ${X(n-1)},${Y(0)}" fill="${s.c}" opacity=".10"/>` : '';
    const labs=s.vals.map((v,i)=> (o.labelAll || i===n-1) && (si===0 || o.labelAll) ? `<text x="${X(i)}" y="${Y(v)-9}" text-anchor="middle" class="vl">${v}</text>` : '').join('');
    const dots=s.vals.map((v,i)=> (o.dotsAll || i===n-1) ? `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.c}" stroke="#fff" stroke-width="2"/>` : '').join('');
    return `${area}<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labs}`; }).join('');
  const xl=o.xs.map((x,i)=> x ? `<text x="${X(i)}" y="${H-6}" text-anchor="middle" class="ax ${i===n-1?'cur':''}">${x}</text>` : '').join('');
  const hit=o.xs.map((_,i)=>{ const w=(W-L-R)/Math.max(1,n-1); return `<rect class="hit" x="${X(i)-w/2}" y="${T}" width="${w}" height="${H-T-B}" data-tip="${o.tips[i]}"/>`; }).join('');
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label}">${grid}${lines}${xl}${hit}</svg>`;
}

const STEP_IC = (()=>{ const sv=d=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  return { diag:sv('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'), ready:sv('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>'),
    work:sv('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'), rep:sv('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>'),
    watch:sv('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>') }; })();
/* 작업 진행 사항 — Ant Design Steps(세로 라벨형) + KRDS 단계 표시기 문법: 번호 원 · 연결선 · 단계명 · 담당. 건이 있는 단계만 파랑 */
function ovFlow(){
  /* 단계마다 「누가 · 몇 건」을 위에, 그 아래 해당 설비를 한 줄씩(설비 · 해야 할 일 · 경과).
     지금 역할의 할 일이 있는 단계는 원에 Ant Badge(status="processing") 물결을 두고 「내 할 일」 표시 */
  const W=workItems(), me=role==='eng'?'엔지니어':'정비 담당';
  const own={ diag:'엔지니어', ready:'정비 담당', work:'정비 담당', rep:'정비 담당', watch:'엔지니어' };
  const todo={ diag:'점검 방향 고르기', ready:'정비 담당 확인 대기', work:'조치 진행 중', rep:'보고서 작성', watch:'감시 조건 확인' };
  const items=STAGES.map((s,i)=>{ const ws=W.filter(w=>w.st===s.k), nx=i<STAGES.length-1 && W.some(w=>w.st===STAGES[i+1].k), mine=ws.length && own[s.k]===me;
    const rows=ws.map(w=>{ const k=handledG(w.d)?'ok':w.d.lv.k, g=w.g, sd=g?g.steps.filter((_,j)=>g.checks['p'+j]).length:0;
      const act = s.k==='work' ? `조치 ${sd} / ${g.steps.length}단계` : (s.k==='diag' && g && g.rep.status==='제출됨') ? '정비 후에도 알람 · 재진단' : (s.k==='diag' && g && g.status==='작성 중') ? '가이드 전달하기' : s.k==='ready' ? (g.status==='전달됨' ? '정비 담당 접수 대기' : '접수됨 · 작업 시작 전') : todo[s.k];
      return `<button class="wi" onclick="event.stopPropagation();openWork('${w.id}','${s.k}')" title="${w.id} ${w.d.name} — 누르면 ${(s.k==='diag'||s.k==='watch'||!w.g)?'설비현황':'가이드'}">
        <span class="wi-h">${icOf(k)}<b>${w.id}</b><span class="wi-n">${eqShort(w.d.E||eqOf(w.id))}</span></span>
        <span class="wi-s"><span>${act}</span><span>${dur(w.since)}</span></span></button>`; }).join('');
    return `<li class="si ${ws.length?'has':''} ${ws.length&&nx?'lk':''} ${mine?'mine':''}">
      <span class="si-ic">${STEP_IC[s.k]}</span>
      <div class="si-t">${s.t}</div>
      <div class="si-n2"><b>${ws.length}</b>건</div>
      <div class="si-d">${own[s.k]}</div>
      <div class="si-c">${rows}</div></li>`; }).join('');
  return `<div class="ovc">${hdr(0,'작업 진행 사항')}<ol class="stp">${items}</ol></div>`;
}

/* 알람 추이 — 14일 꺾은선 (한계 알람 · 통계 이상) */
function ovTrend(){
  const N=14, bins=[...Array(N)].map((_,i)=>{ const lo=DEMO_BASE-(N-i)*DAY; return { lo, ...almCount(lo, lo+DAY) }; });
  const y=bins[N-1], y2=bins[N-2];
  const S=[{name:'한계 알람', c:OV.C1, vals:bins.map(b=>b.L)},{name:'통계 이상', c:OV.C2, vals:bins.map(b=>b.B)}];
  const xs=bins.map((b,i)=> i===N-1?'어제': (i===0||i===7)?ovMD(b.lo):'');
  const tips=bins.map(b=>`${ovMD(b.lo)} 06시 ~ ${ovMD(b.lo+DAY)} 06시\n한계 알람 ${b.L}건 · 통계 이상 ${b.B}건`);
  return `<div class="ovc">${hdr(0,'<span data-tip="최근 14일 · 하루 = 06시 교대 기준">알람 추이</span>',`<span class="kp" data-tip="어제 한계 알람 ${y.L}건 · 그제 ${y2.L}건">어제 ${delta(y.L,y2.L)}</span>`)}
    <div class="lgd-h">${S.map(s=>`<span class="li"><span class="sw" style="background:${s.c}"></span>${s.name}</span>`).join('')}</div>
    ${lineChart({ xs, series:S, tips, label:'최근 14일 알람 추이' })}</div>`;
}

/* 관리 지표 — 연도별 정지 시간 꺾은선 (과거 정비 사례 기준) */
function ovMgmt(){
  /* 분기별 정지 시간 — 과거 정비 사례(CASE) 기준. 막대 = 정지 시간(h), 막대 위 숫자는 정지가 있던 분기만, 이번 분기는 기준 시각까지 */
  const C=Object.entries(KDOC.CASE).map(([no,c])=>{ const f=c.fm, y=+f.occurred_at.slice(0,4), m=+f.occurred_at.slice(5,7); return { y, q:Math.ceil(m/3), h:+f.downtime_h||0, fail:/[ABC]급/.test(f.grade) }; });
  const now=new Date(DEMO_BASE), Y=now.getFullYear(), Q=Math.ceil((now.getMonth()+1)/3), y0=Math.min(...C.map(c=>c.y));
  const qs=[]; for(let y=y0;y<=Y;y++) for(let q=1;q<=4;q++){ if(y===Y && q>Q) break; qs.push({y,q}); }
  const agg=({y,q})=>{ const r=C.filter(c=>c.y===y&&c.q===q); return { h:r.reduce((s,c)=>s+c.h,0), f:r.filter(c=>c.fail).length, n:r.length }; };
  const rows=qs.map((k,i)=>{ const r=agg(k), cur=k.y===Y&&k.q===Q;
    return { x:`${k.q}Q`, sub:k.q===1?String(k.y):'', cur, lab:r.h>0, vals:[r.h], tip:`${k.y}년 ${k.q}분기${cur?` (${ovMD(DEMO_BASE)}까지)`:''}\n정지 ${r.h} h · 고장 ${r.f}건 · 사례 ${r.n}건` }; });
  const sum=a=>a.reduce((s,k)=>s+agg(k).h,0), last4=sum(qs.slice(-4)), prev4=sum(qs.slice(-8,-4));
  return `<div class="ovc">${hdr(0,`<span data-tip="과거 정비 사례 ${C.length}건 기준 · 고장 = 정지가 난 B · C급">관리 지표</span>`,`<span class="kp" data-tip="최근 4분기 정지 ${last4} h · 그 전 4분기 ${prev4} h">직전 4분기 대비 ${delta(last4,prev4,'h')}</span>`)}
    <div class="lgd-h"><span class="li">분기별 정지 시간 (h)</span></div>
    <div class="qbar">${colChart(rows,[{name:'정지 시간',c:OV.C1}],170)}</div></div>`;
}

function renderOverview(){
  const el=document.getElementById('ovg'); if(!el) return;
  ovFleet(); document.getElementById('trendBox').innerHTML = ovTrend() + ovMgmt(); el.innerHTML = ovFlow();
}
/* 툴팁 — data-tip 이 있는 막대 · 도넛 조각 · 단계 */
(function(){
  const tip=document.createElement('div'); tip.id='vtip'; document.body.appendChild(tip);

function pearson(a,b){ const p=a.map((v,i)=>[v,b[i]]).filter(([x,y])=>x!=null&&y!=null); const n=p.length; if(n<10) return 0;

    return `<div class="tr2" onclick="${byId(r.T.eq)?`openEq('${r.T.eq}')`:`openMaster('${r.T.eq}')`}" data-tip="${r.t} ${shortName(r.T.desc)}\n최근 24시간 기울기 ${r.k>0?'+':''}${r.k.toFixed(3)} ${r.T.unit}/h · 평소 범위 = 평균 ±3σ">
      <div class="mh"><span class="tg">${r.t}</span><span class="eqi">${r.T.eq}</span><span class="nx ${r.over?'ov':''}">${r.over?`${r.lv} ${fmtV(r.t,r.th)} 넘은 상태`:`${r.lv} ${fmtV(r.t,r.th)}까지 약 <b>${Math.round(r.eta)}시간</b>`}</span></div>
      <svg viewBox="0 0 ${W} ${H}" class="fxsv"><rect x="${L}" y="${Y(band[1])}" width="${X(n-1)-L}" height="${Y(band[0])-Y(band[1])}" fill="#1677FF" opacity=".07"/>
        <line x1="${L}" x2="${W-R}" y1="${Y(r.th)}" y2="${Y(r.th)}" stroke="${r.lv==='경고'?'#FAAD14':'#FA8C16'}" stroke-dasharray="5 4"/>
        <rect x="${X(n-1)}" y="${T}" width="${W-R-X(n-1)}" height="${H-T-B}" fill="#FAFAFA"/>
        <polyline points="${pts}" fill="none" stroke="#1677FF" stroke-width="1.6" stroke-linejoin="round"/>
        ${r.over?'':`<line x1="${X(n-1)}" y1="${Y(r.cur)}" x2="${fx}" y2="${Y(end)}" stroke="#1677FF" stroke-width="1.6" stroke-dasharray="4 3"/>${r.eta<=F?`<circle cx="${fx}" cy="${Y(end)}" r="4" fill="#fff" stroke="#FA8C16" stroke-width="2"/>`:''}`}
        <circle cx="${X(n-1)}" cy="${Y(r.cur)}" r="3.5" fill="#1677FF" stroke="#fff" stroke-width="1.5"/>
        <text x="${L}" y="${H-2}" class="ax">7일 전</text><text x="${X(n-1)}" y="${H-2}" class="ax" text-anchor="middle">지금</text><text x="${W-R}" y="${H-2}" class="ax" text-anchor="end">+48h</text></svg></div>`; }).join('') || '<p class="ev-0">7일 안에 한계에 닿을 추세가 없습니다</p>';
}

/* ⑤ 교대 타임라인 — 설비별 24시간 알람 구간 (한계 알람 = 굵은 막대, 통계 이상 = 얇은 청록) */
function fxTimeline(){
  const span=FX.R1-FX.R0, P=t=>fxPct(t,FX.R0,FX.R1);
  const seen=new Set();
  const rows=EQUIP.map(E=>{ const d=byId(E.id), k=d&&!handledG(d)?d.lv.k:'ok';
    const segs=DATA.ALM.filter(a=>TAG[a[0]].eq===E.id && a[5]<FX.R1 && (!a[6] || a[6]>FX.R0)).filter(a=>{ const key=a[0]+a[5]+a[1]+(a[1]==='LIMIT'?a[4]:''); if(seen.has(key)) return false; seen.add(key); return true; }).map(a=>{
      const s=Math.max(a[5],FX.R0), e=Math.min(a[6]||FX.R1,FX.R1), lim=a[1]==='LIMIT', stale=!a[6] && FX.R1-a[5]>DAY;
      return `<i class="${lim?'lm':'bs'} ${stale?'st':''}" style="left:${P(s)}%;width:max(3px,${P(e)-P(s)}%);${lim?`background:${fxSevC[a[4]]}`:''}" data-tip="${a[0]} ${lim?`${SEVKO[a[4]]} ${a[3]==='BELOW'?'↓':'↑'}`:'통계 이상'}\n${mdK(a[5])} ~ ${a[6]?mdK(a[6]):'진행 중'}${stale?'\n24시간 넘게 켜져 있음':''}"></i>`; }).join('');
    return `<div class="tl"><span class="nm" onclick="${byId(E.id)?`openEq('${E.id}')`:`openMaster('${E.id}')`}">${icOf(k)}${E.id}</span><div class="ln">${segs}</div></div>`; }).join('');
  const shifts=[0,8,16,24].map(h=>`<span class="sh" style="left:${h/24*100}%"><b>${hmK(FX.R0+h*3600e3)}</b></span>`).join('');
  const lim=DATA.ALM.filter(a=>a[1]==='LIMIT' && a[5]>=FX.R0 && a[5]<FX.R1).length;
  document.getElementById('fxTlK').innerHTML=`24시간 한계 알람 <b>${lim}</b>건 · 교대 06·14·22시`;
  document.getElementById('fxTl').innerHTML=`<div class="tlw"><div class="tlx">${shifts}</div>${rows}</div>`;
  fxTlCur();
}
function fxTlCur(){ const c=document.getElementById('fxCur'); if(c) c.style.left=`calc(64px + (100% - 64px) * ${RT.i/1440})`; }

function fxTick(){ if(!document.getElementById('fxLoad')) return; fxLoad(); fxMargin(); fxTlCur(); }
fxBad(); fxTimeline();

window.fxReady=true;

</script>
</body>
