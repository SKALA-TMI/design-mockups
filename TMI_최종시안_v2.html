2를 정상 상태로 운전하고, 관리 항목이 기준을 벗어났을 때 운전원과 정비원이 같은 순서로 대응하도록 정한다.\n- 적용 범위는 C-2102 본체다. 프레임·메인 베어링, 1번 스로(크로스헤드·피스톤 로드·1단 실린더), 2번 스로(크로스헤드·피스톤 로드·2단 실린더), 단간(1단 토출 → 2단 흡입)을 다룬다.\n- 함께 보는 문서\n  - 구동 모터: MAN-M-2103\n  - 진동 판정 기준, 통계 알람의 뜻, 센서 고장 판별, 알람 해제 규칙: MAN-VIB-01\n\n## 2. 설비 개요\n\n| 항목 | 내용 |\n|---|---|\n| 설비 ID | C-2102 |\n| 설비명 | 수첨분해 보충 수소 압축기 |\n| 유형 | 왕복동 압축기 |\n| 설비 등급 | 2 (1 = 가장 중요) |\n| 유닛 | UNIT-21 수첨분해 |\n| 구동기 | M-2103 (보충 수소 압축기 구동 모터) |\n| 파트 | 보충 수소 압축기 프레임·메인 베어링, 보충 수소 압축기 1번 스로(크로스헤드·피스톤 로드·1단 실린더), 보충 수소 압축기 2번 스로(크로스헤드·피스톤 로드·2단 실린더) |\n\n- C-2102는 보충 수소(make-up hydrogen)를 두 단으로 압축해 수첨분해 반응기 루프로 보내는 왕복동 압축기다. 모터 M-2103이 크랭크축을 직접 돌린다. 정유의 수첨분해·수첨처리 공정은 이런 왕복동 압축기로 수소를 여러 단에 걸쳐 압축한다 [왕복 15].\n- 예비기가 없다. 멈추면 반응기 루프로 가는 수소 보충이 끊겨 처리량을 줄여야 한다. 멈출 때 직접 생기는 안전 위험은 확인된 근거가 없어 설비 등급이 2다.\n- 구조\n  - 크랭크축은 프레임(크랭크케이스) 안의 메인 베어링이 받친다. 커넥팅로드와 크로스헤드가 회전 운동을 직선 운동으로 바꾸고, 피스톤 로드가 실린더 안의 피스톤을 움직인다 [왕복 2].\n  - 피스톤 무게는 라이더 밴드가 받고, 피스톤 링이 헤드 쪽(HE)과 크랭크 쪽(CE) 압축실 사이를 막는다 [왕복 3][왕복 4].\n  - 실린더마다 흡입·토출 밸브가 여러 개 있다. 가장 손이 많이 가는 부품이다 [왕복 2].\n  - 1단에서 압축한 가스는 단간 냉각기와 분리기를 거쳐 2단으로 들어간다 [왕복 8].\n- 감시 센서\n  - 프레임: 프레임 진동 VI-2121H(크랭크케이스, 메인 베어링과 일직선, 수평 방향)와 메인 베어링 온도 TI-2121이 있다 [왕복 1][왕복 6].\n  - 스로마다: 크로스헤드 가속도(크로스헤드 가이드, 수직), 피스톤 로드 드롭(패킹 케이스 쪽 로드 아래 근접 프로브), 그 단의 토출 가스 온도, 그 단의 토출 압력이 있다 [왕복 3][왕복 4][왕복 6].\n  - 1번 스로: VI-2122V, ZI-2122V, TI-2122, PI-2122(1단 토출 = 단간 압력).\n  - 2번 스로: VI-2123V, ZI-2123V, TI-2123, PI-2123(2단 토출 = 최종 토출 압력).\n- 감시 태그가 없는 것: 밸브 커버 온도, 실린더 내부 압력, 패킹 온도, 흡입 압력·온도, 단간 냉각기 출구 온도, 프레임 윤활유 압력·레벨·필터 차압, 실린더 주유기. 현장 계기와 휴대용 측정기로 본다(4절).\n- C-2102의 프레임 윤활유와 실린더 주유기는 C-2100·T-2101 공용 콘솔(MAN-LUBE-01)과 따로다.\n\n## 3. 관리 항목표\n\n| 태그 | 측정 | 단위 | 평소 값 | 경고 | 알람 | 정지 | 울림 지연 | 해제 폭 · 해제 지연 | 통계 알람 |\n|---|---|---|---|---|---|---|---|---|---|\n| VI-2121H | 보충 수소 압축기 프레임 진동 수평 | mm/s | 3.5 | ↑5.5 | ↑8 | ↑12 | 10초 | 0.07 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| TI-2121 | 보충 수소 압축기 메인 베어링 온도 | °C | 80 | ↑90 | ↑95 | ↑115 | 0초 | 0.8 · 60초 | 평균↑ |\n| VI-2122V | 보충 수소 압축기 1번 크로스헤드 가속도 | g | 1 |  |  |  |  |  | 평균↑, 최대↑ |\n| ZI-2122V | 보충 수소 압축기 1번 피스톤 로드 드롭 | µm | 450 | ↑700 | ↑1,000 | ↑1,500 | 0초 | 9 · 15초 | 평균↑ |\n| TI-2122 | 보충 수소 압축기 1단 토출 가스 온도 | °C | 110 | ↑121 | ↑135 | ↑145 | 0초 | 1.1 · 60초 | 평균↑ |\n| PI-2122 | 보충 수소 압축기 1단 토출(단간) 압력 | kg/cm² | 60 |  | ↑66 / ↓54 |  | 0초 | 1.2 · 15초 |  |\n| VI-2123V | 보충 수소 압축기 2번 크로스헤드 가속도 | g | 1 |  |  |  |  |  | 평균↑, 최대↑ |\n| ZI-2123V | 보충 수소 압축기 2번 피스톤 로드 드롭 | µm | 450 | ↑700 | ↑1,000 | ↑1,500 | 0초 | 9 · 15초 | 평균↑ |\n| TI-2123 | 보충 수소 압축기 2단 토출 가스 온도 | °C | 110 | ↑121 | ↑135 | ↑145 | 0초 | 1.1 · 60초 | 평균↑ |\n| PI-2123 | 보충 수소 압축기 2단 토출 압력 | kg/cm² | 175 |  | ↑192.5 / ↓157.5 |  | 0초 | 3.5 · 15초 |  |\n\n↑ 넘으면 이상, ↓ 내려가면 이상. 통계 알람은 정상 구간의 1시간 요약과 비교해 그 통계가 벗어날 때 울리는 경고(LOW)다(MAN-VIB-01 3절).\n\n- 경고·알람·정지는 설비 태그의 「경고 상·하한(초기 경고)」, 「알람 상·하한(운전 알람)」, 「정지 상·하한(설비 보호 정지)」이다.\n- 크로스헤드 가속도 VI-2122V, VI-2123V는 한계값 알람이 없다. 절댓값 기준이 없어서다. 통계 알람이 평소의 2배를 넘을 때 울린다.\n- 압력 한계값(평소 ±10%), 로드 드롭 경고·정지 값은 팀이 정한 값이다. 근거는 끝의 「근거」와 `docs/설비_태그_마스터_근거.md` 7.3절에 있다.\n- 울림 지연, 해제 폭·해제 지연의 뜻은 MAN-VIB-01 3절과 5절을 따른다.\n\n## 4. 정상 운전 점검\n\n### 4.1 매 교대\n\n| 항목 | 보는 것 | 정상 |\n|---|---|---|\n| 메인 베어링 온도 TI-2121 | 값과 12시간 추이 | 평소 값 부근이고 한 방향으로 계속 오르지 않는다 |\n| 프레임 진동 VI-2121H | 값과 추이 | 평소 값 부근이고 계단처럼 뛰지 않는다 |\n| 크로스헤드 가속도 VI-2122V, VI-2123V | 두 스로 값 비교 | 두 스로가 비슷하다. 한쪽이 다른 쪽의 2배를 넘지 않는다 [왕복 6] |\n| 로드 드롭 ZI-2122V, ZI-2123V | 값과 주간 추이 | 평소 값 부근이고 출렁이지 않는다 |\n| 단 토출 온도 TI-2122, TI-2123 | 두 단 값 비교 | 두 단이 평소 값 부근이고, 한 단만 오르지 않는다 |\n| 단 토출 압력 PI-2122, PI-2123 | 값 | 평소 값 부근이다. 바뀌었으면 보충 수소 공급 압력과 반응기 루프 압력이 바뀌었는지 공정 운전원과 확인한다 |\n| 현장 | 프레임 윤활유 압력·레벨·필터 차압, 실린더 주유기 동작, 단간 분리기 레벨과 배출, 노킹 같은 이상음, 패킹 벤트 | 이상이 없다. API 618은 낮은 윤활유 압력·레벨, 실린더 주유기 고장, 필터 차압, 분리기 높은 레벨을 보호 항목으로 둔다 [왕복 1] |\n\n### 4.2 정기 점검\n\n| 주기 | 항목 | 이유 |\n|---|---|---|\n| 월 1회 | 밸브 커버 온도를 휴대용으로 재서 같은 그룹 밸브 평균과 비교 | 새는 밸브는 그 밸브 커버 온도가 먼저 오른다 [왕복 2]. 밸브 온도는 같은 그룹 평균과의 차이로 본다 [왕복 6] |\n| 월 1회 | 프레임 윤활유 시료 분석(점도, 수분, 마모 금속 입자) | 메인 베어링 손상은 윤활 부족에서 시작하는 경우가 많다 [왕복 2] |\n| 월 1회 | 로드 드롭 추이 검토 | 라이더 밴드 마모는 몇 달에 걸쳐 진행한다 [왕복 4]. 하루 상승량으로 알람에 닿는 날을 미리 계산해 정지를 계획한다 |\n| 분기 1회 | 단별 토출 온도·압력을 예측값과 비교 | 단 압력을 예측과 비교하면 어느 단이 문제인지 좁힐 수 있다 [왕복 16] |\n| 정기 보수 | 흡입·토출 밸브 정비, 라이더 밴드 두께, 크로스헤드 핀·부싱 간극, 피스톤 너트 조임 | 밸브와 피스톤 링, 패킹, 라이더 밴드가 예정 외 정지의 주요 원인이다 [왕복 18][왕복 19] |\n\n## 5. 이상 시 조치\n\n모든 알람에서 먼저 할 일은 같다.\n1. 같은 설비의 다른 태그와 짝 태그를 함께 본다. 짝은 두 스로의 같은 측정이다(VI-2122V와 VI-2123V, ZI-2122V와 ZI-2123V, TI-2122와 TI-2123). 한 태그만 튀고 관련 태그가 모두 그대로면 센서 고장부터 의심한다(MAN-VIB-01 4절).\n2. 값이 언제부터 어떤 모양(서서히, 계단, 튐, 출렁임)으로 바뀌었는지 1시간 요약으로 본다.\n3. 아래 항목별 조치를 하고, 원인은 6절 표에서 좁힌다.\n\n### 5.1 메인 베어링 온도 TI-2121\n\n**관리 기준** — 평소 80 °C · 경고 ↑90 · 알람 ↑95 · 정지 ↑115 °C · 울림 지연 0초 · 해제 폭 0.8 °C · 해제 지연 60초\n\n- 왕복동 전용 수치를 찾지 못해 유막 베어링 메탈 온도의 일반 기준을 쓴다(설비조사 1.5절).\n- **경고**\n  1. 프레임 진동 VI-2121H가 함께 움직였는지 본다.\n  2. 현장에서 프레임 윤활유 공급 압력, 필터 차압, 크랭크케이스 레벨을 확인한다.\n  3. 단 토출 압력 PI-2122, PI-2123과 모터 전류 II-2133이 평소보다 높아 부하가 늘었는지 본다. 메인 베어링 손상의 원인은 윤활 부족과 과부하다 [왕복 2].\n  4. 윤활 계통이 정상이고 부하도 그대로인데 온도가 계속 오르면 6.4절로 간다.\n- **알람:** 정비 담당에게 알리고 6.4절 점검을 시작한다. 부하를 줄일 수 있으면 줄인다. 통계 알람이나 경고만 보고 지켜보기만 하지 않는다. 온도·진동이 먼저 변했는데 조치하지 않아 충격 트립까지 간 사례가 있다 [왕복 1].\n- **정지:** 설비 보호 정지 값이다. 정지되면 재기동 전에 메인 베어링을 분해 점검한다.\n\n### 5.2 프레임 진동 VI-2121H\n\n**관리 기준** — 평소 3.5 mm/s · 경고 ↑5.5 · 알람 ↑8 · 정지 ↑12 mm/s · 울림 지연 10초 · 해제 폭 0.07 mm/s · 해제 지연 15초\n\n- 알람과 정지 값은 EFRC 지침의 프레임 상부 구역 경계(B/C, C/D)다 [왕복 8][왕복 9]. 측정 대역은 2~1,000 Hz 전체 RMS다 [왕복 8].\n- **경고**\n  1. 메인 베어링 온도 TI-2121이 먼저 올랐는지 본다. 먼저 올랐으면 메인 베어링 손상이다(6.4절).\n  2. 크로스헤드 가속도가 한 스로에서만 크게 올랐는지 본다. 그렇다면 러닝기어 헐거움이나 액체 유입이다(6.3절).\n  3. 한 단의 토출 온도가 같은 날 계단처럼 올랐는지 본다. 그렇다면 토출 밸브 판 파손이다(6.1절) [P20].\n  4. 셋 다 아니면 프레임·기초 헐거움(그라우트 열화, 앵커 볼트 풀림)을 의심한다. 1X·2X 성분이 오르고 프레임 양 끝의 진폭·위상이 바뀐다 [왕복 1][왕복 2].\n- **알람:** 진동 분석(1X·2X 성분, 양 끝 비교)을 요청한다. 부하를 줄인다.\n- **정지:** 설비 보호 정지 값이다. 로드 파단, 카운터웨이트 이탈 같은 대형 파손은 프레임 진동이 갑자기 뛰는 것으로 드러난다 [왕복 1]. 원인을 찾기 전까지 재기동하지 않는다.\n\n### 5.3 크로스헤드 가속도 VI-2122V(1번), VI-2123V(2번)\n\n| 태그 | 측정 | 단위 | 평소 값 | 경고 | 알람 | 정지 | 울림 지연 | 해제 폭 · 해제 지연 | 통계 알람 |\n|---|---|---|---|---|---|---|---|---|---|\n| VI-2122V | 보충 수소 압축기 1번 크로스헤드 가속도 | g | 1 |  |  |  |  |  | 평균↑, 최대↑ |\n| VI-2123V | 보충 수소 압축기 2번 크로스헤드 가속도 | g | 1 |  |  |  |  |  | 평균↑, 최대↑ |\n\n↑ 넘으면 이상, ↓ 내려가면 이상. 통계 알람은 정상 구간의 1시간 요약과 비교해 그 통계가 벗어날 때 울리는 경고(LOW)다(MAN-VIB-01 3절).\n\n- API 670 5판은 크로스헤드 가이드에 수직 센서를 달아 감시하라고 하지만 트립 수치는 정하지 않는다 [왕복 3]. 그래서 한계값 알람이 없다.\n- 벤더 경험칙은 「한 크로스헤드가 다른 크로스헤드의 2배를 넘으면 안 된다」이다 [왕복 6]. 경보를 기준선의 2~4배로 거는 예가 있다 [P23]. 한 정유 사례의 셧다운 값은 2.0~2.3 g였다 [P22].\n- **통계 알람(평균·최대)**\n  1. 두 스로를 비교한다. 한 스로만 다른 스로의 2배를 넘으면 그 스로의 러닝기어 헐거움이나 액체 유입이다(6.3절).\n  2. 단간 분리기 레벨과 배출 기록을 본다. 레벨이 올랐거나 배출이 막혔으면 액체 유입이다 [왕복 1][왕복 5].\n  3. 몇 초짜리 튐이 몰려 나타나고 프레임 진동이 같이 움직이지 않으면 센서 접촉 불량을 의심한다(MAN-VIB-01 4절).\n- **하루 안에 정지 여부를 정한다.** 헐거움은 빨리 진행된다 [P24]. 크로스헤드가 파손된 사례는 7일 전에는 정상이었고, 첫 진단에서 파손까지 29시간이었다 [P22].\n\n### 5.4 로드 드롭 ZI-2122V(1번), ZI-2123V(2번)\n\n**관리 기준** — 평소 450 µm · 경고 ↑700 · 알람 ↑1,000 · 정지 ↑1,500 µm · 울림 지연 0초 · 해제 폭 9 µm · 해제 지연 15초\n\nZI-2123V도 기준이 같다.\n- 로드 드롭은 표준 수치가 없고 피스톤과 라이너 사이 간극으로 정한다 [왕복 6]. 알람 1,000 µm는 보충 수소 압축기 사례의 경보값이다 [왕복 4]. 경고와 정지 값은 팀이 정한 값이다.\n- **경고**\n  1. 다른 스로의 로드 드롭과 비교한다. 한 스로만 서서히 오르면 라이더 밴드 마모다(6.2절).\n  2. 값이 오르지 않고 출렁이면 피스톤 로드가 휜 것이다 [왕복 4]. 기계 마모로 보지 말고 로드와 센서를 확인한다(6.5절).\n  3. 하루 상승량으로 알람에 닿는 날을 계산해 정지를 계획한다.\n- **알람:** 피스톤이 라이너에 닿기 전에 라이더 밴드를 바꾸도록 정지를 잡는다. 끝까지 가면 피스톤과 라이너가 금속끼리 닿는다 [왕복 4].\n- **정지:** 설비 보호 정지 값이다. 재기동 전에 피스톤·라이더 밴드·라이너를 점검한다.\n\n### 5.5 단 토출 가스 온도 TI-2122(1단), TI-2123(2단)\n\n**관리 기준** — 평소 110 °C · 경고 ↑121 · 알람 ↑135 · 정지 ↑145 °C · 울림 지연 0초 · 해제 폭 1.1 °C · 해제 지연 60초\n\nTI-2123도 기준이 같다.\n- 경고는 평소보다 11 °C 높은 값이다. 토출 밸브가 고장 난 사례에서 온도가 기대보다 20 °F(약 11 °C) 높았던 것에서 잡았다 [왕복 17]. 알람 135 °C는 API 618이 수소가 많은 가스에 둔 토출 온도 한계다(2차 자료) [왕복 12]. 정지 145 °C는 국내 수소 압축기의 토출 온도 설정값이다 [왕복 5].\n- **경고**\n  1. 두 단의 토출 온도를 비교한다. 한 단만 오르면 그 단의 밸브나 피스톤 링 문제다(6.1절). 두 단이 함께 오르면 흡입 가스 온도와 운전 조건 변화를 먼저 본다.\n  2. 2단만 올랐으면 단간 냉각기 출구 온도(현장 계기)를 본다. 냉각이 나빠 2단 흡입 온도가 오르면 2단 토출 온도도 오른다(추론).\n  3. 오른 모양을 본다. 하루 안에 계단처럼 올랐으면 밸브 판 파손, 몇 주에 걸쳐 서서히 올랐으면 밸브 누설 쪽이다 [P20][P21].\n  4. 그 단의 밸브 커버 온도를 휴대용으로 재서 어느 밸브가 뜨거운지 찾는다 [왕복 2][왕복 6][왕복 16].\n- **알람:** 정비 담당에게 알리고 밸브 교체를 계획한다. 부하를 줄일 수 있으면 줄인다.\n- **정지:** 설비 보호 정지 값이다. 재기동 전에 그 단의 밸브와 피스톤 링을 점검한다.\n\n### 5.6 단 토출 압력 PI-2122(단간), PI-2123(2단)\n\n**관리 기준** — 평소 60 kg/cm² · 알람 ↑66 / ↓54 kg/cm² · 울림 지연 0초 · 해제 폭 1.2 kg/cm² · 해제 지연 15초\n\n**관리 기준** — 평소 175 kg/cm² · 알람 ↑192.5 / ↓157.5 kg/cm² · 울림 지연 0초 · 해제 폭 3.5 kg/cm² · 해제 지연 15초\n\n- 공정 압력이라 표준 수치가 없다. 평소 값의 ±10%를 알람으로 둔 팀 가정이다.\n- **단간 압력 PI-2122가 오를 때:** 보충 수소 공급(흡입) 압력이 올랐는지 먼저 공정 운전원과 확인한다. 실린더 크기가 고정이면 단간 압력은 흡입 압력을 거의 따라간다(추론).\n- **단간 압력 PI-2122가 내려갈 때:** 흡입 압력이 내려갔는지 먼저 확인한다. 흡입 압력이 그대로인데 1단 토출 온도 TI-2122가 함께 오르면 1단 밸브 누설을 의심한다(6.1절) [P21].\n- **단간 압력 방향의 근거는 약하다.** 「아래 단 토출 밸브가 새면 단간 압력↓, 위 단 흡입 밸브가 새면 단간 압력↑」라는 규칙은 특허 한 건과 원리 추론뿐이다(설비조사 1.4절 주의). 단간 압력 방향만으로 단을 정하지 않는다. 어느 단의 토출 온도가 올랐는지를 먼저 본다.\n- **2단 토출 압력 PI-2123이 바뀔 때:** 반응기 루프 압력을 따른다. 공정 운전원과 루프 압력 변화를 확인한다.\n\n## 6. 고장별 증상·점검·조치\n\n원인은 대부분 데이터만으로 하나로 확정할 수 없다. 아래 「추정 원인」은 현장 확인으로 확정한다. 매뉴얼이 정한 조치는 그대로 따른다.\n\n| 절 | 고장 | 먼저 움직이는 태그와 모양 | 가르는 단서 |\n|---|---|---|---|\n| 6.1 | 토출 밸브 누설·파손 | 그 단 토출 온도 TI-2122(또는 TI-2123)↑. 누설은 몇 주에 걸쳐 서서히, 판 파손은 하루 안에 계단 | 그 단 토출 온도만 오른다 |\n| 6.2 | 라이더 밴드 마모 | 로드 드롭 ZI-2122V(또는 ZI-2123V) 서서히↑ | 로드 드롭만 오른다 |\n| 6.3 | 러닝기어 헐거움·액체 유입 | 크로스헤드 가속도 VI-2122V(또는 VI-2123V) 튐·↑ | 한 크로스헤드만 다른 것의 2배 넘게 오른다 |\n| 6.4 | 메인 베어링 손상 | 메인 베어링 온도 TI-2121 서서히↑ → 프레임 진동 VI-2121H 급변 | 프레임 쪽이 먼저다 |\n| 6.5 | 센서 고장 | 한 태그만 튐·고정, 또는 로드 드롭 출렁임 | 짝 태그와 관련 태그가 그대로다 |\n| 6.6 | 구동 모터 이상 | 모터 진동·온도·전류 | MAN-M-2103 |\n\n### 6.1 토출 밸브 누설·파손\n\n- **증상:** 토출 밸브가 새면 토출된 뜨거운 가스가 실린더로 되돌아와 다시 압축된다. 그래서 그 밸브의 커버 온도가 먼저 오르고 그 단의 토출 온도가 오른다 [왕복 1][왕복 2][왕복 16]. 크로스헤드 가속도의 고주파 성분이 오를 수 있다 [왕복 3].\n  - 토출 밸브가 고장 난 사례에서 기대 265 °F에 실측 285 °F였다 [왕복 17].\n  - **누설(서서히):** 수리할 때까지 토출 온도가 계속 오른다 [왕복 16]. 예측값과 어긋나기 시작해 밸브를 바꿀 때까지 2.5~3.5주 걸린 사례가 있고, 그때 1단 토출 압력이 예측보다 10% 낮았다 [P21].\n  - **판 파손(계단):** 수소가 많은 가스 압축기에서 2단 토출 밸브 온도가 하루 안에 약 99 °C에서 110~118 °C로 계단처럼 오르고 그 뒤 출렁였다. 같은 날 프레임 진동이 7.5에서 9.5 mm/s pk로 올랐다 [P20].\n  - 밸브를 바꾸면 토출 온도와 압력이 예측값으로 돌아온다 [P20][P21].\n- **어느 단인가:** 토출 온도가 오른 단이 1차 단서다. 단간 압력 방향은 보조 단서로만 쓴다(5.6절, 근거가 약하다). 단간 압력을 예측값과 비교하면 어느 단인지 좁히는 데 도움이 된다 [왕복 16].\n- **비슷한 원인**\n  - 흡입 밸브 누설: 압축하는 동안 가스가 흡입 쪽으로 샌다. 그 흡입 밸브 커버 온도가 오르고, 같은 실린더의 HE·CE를 비교해 찾는다. 누설이 아주 크면 토출 온도가 오르지 않을 수도 있다 [왕복 3][왕복 16].\n  - 피스톤 링 누설: 토출 온도가 서서히 오르고 [왕복 1], 크로스헤드 고주파가 회전 내내 커진다 [왕복 3]. 밸브 커버 온도 사이에 큰 차이가 없다(추론).\n  - 단간 냉각기 성능 저하: 2단 토출 온도만 오르지만 단간 냉각기 출구 온도가 같이 오른다(추론).\n- **추정 원인 → 확인 방법**\n  1. 두 단의 토출 온도를 비교해 단을 정한다.\n  2. 오른 모양(계단 / 서서히)을 본다.\n  3. 그 단의 밸브 커버 온도를 재서 같은 그룹 평균보다 뜨거운 밸브를 찾는다 [왕복 6].\n  4. 단간 압력을 예측값과 비교한다 [왕복 16].\n  5. 필요하면 휴대용 분석기로 실린더 압력 곡선을 잰다 [왕복 2][왕복 5].\n- **조치**\n  - 문제 밸브를 바꾼다. 판 파손이면 깨진 조각이 실린더 안에 남지 않았는지 확인하고 같은 실린더의 다른 밸브도 점검한다.\n  - 재기동 뒤 토출 온도와 단간 압력이 평소 값으로 돌아왔는지 확인한다.\n  - 밸브는 예정 외 정지의 주요 원인이다 [왕복 18]. 한 설문에서는 고장의 36%가 밸브였다(리뷰 논문 재인용, 2차 자료) [왕복 19].\n\n### 6.2 라이더 밴드 마모\n\n- **증상:** 라이더 밴드가 닳으면 피스톤이 내려앉아 로드 드롭이 서서히 오른다 [왕복 4][왕복 6]. 보충 수소 압축기 사례에서 3개월에 432 µm에서 1,252 µm로 올랐다 [왕복 4]. 다른 태그는 대체로 그대로다.\n- **추정 원인:** 정상 마모(교체 주기 도래), 실린더 주유 부족, 가스 속 이물(추론). 끝까지 가면 피스톤과 라이너가 금속끼리 닿는다 [왕복 4].\n- **추정 원인 → 확인 방법**\n  1. 다른 스로의 로드 드롭과 비교한다. 한 스로만 오르면 그 스로다.\n  2. 값이 고르게 오르는지 본다. 출렁이면 로드 휨이다 [왕복 4].\n  3. 실린더 주유기의 주유량과 라이더 밴드 교체 이력을 본다.\n  4. 정지 기회에 라이더 밴드 두께와 피스톤 바닥 간극을 잰다. 사례에서는 새 밴드 바닥 간극이 2,100 µm였는데, 1,000 µm 경보 때 열어 보니 630 µm가 남아 있었다 [왕복 4].\n- **조치:** 알람에 닿기 전에 정지를 잡아 라이더 밴드를 바꾼다. 바꾼 뒤 로드 드롭 값을 새로 기록한다.\n\n### 6.3 러닝기어 헐거움·액체 유입\n\n- **러닝기어 헐거움:** 크로스헤드 핀·부싱 마모, 크로스헤드 슬리퍼 균열, 피스톤 너트 풀림이다. 크로스헤드 충격이 오른다 [왕복 1][왕복 6]. 크로스헤드 슈 온도와 로드 런아웃도 오르지만 [왕복 1][왕복 2] 우리 설비에는 그 태그가 없다. 5월과 6월 사이에 충격 파형이 크게 바뀐 사례가 있고 [왕복 1], 헐거움은 빨리 진행된다 [P24].\n- **액체 유입:** 분리기를 넘어온 액체가 실린더로 들어가면 크로스헤드 충격이 튄다 [왕복 1][왕복 6]. 되풀이되면 최고 압력 상승, 밸브 고착, 피스톤 균열로 손상이 쌓인다 [왕복 5].\n- **가르는 단서:** 한 크로스헤드만 다른 크로스헤드의 2배 넘게 오른다 [왕복 6]. 헐거움은 튐이 끊기지 않고 계속 커진다. 액체 유입은 튐이 분리기 레벨 상승·배출 이상과 같은 때 나타난다(추론).\n- **점검 순서:** ① 두 스로 비교 ② 단간 분리기 레벨·배출 기록 ③ 프레임 진동이 함께 올랐는지 ④ 정지해 크로스헤드 핀·부싱 간극, 슬리퍼, 피스톤 너트 조임을 확인한다.\n- **조치:** 헐거움이면 정지해 닳은 부품을 바꾼다. 액체 유입이면 분리기 배출을 정상으로 돌리고, 밸브와 피스톤 손상을 점검한다 [왕복 5].\n\n### 6.4 메인 베어링 손상\n\n- **증상:** 윤활 부족이나 과부하로 [왕복 2] 메인 베어링 온도 TI-2121이 먼저 서서히 오르고, 손상이 커지면 프레임 진동 VI-2121H가 갑자기 뛴다. 진동·온도가 먼저 변했는데 조치하지 않았고, 그 뒤 충격으로 트립한 사례가 있다 [왕복 1].\n- **가르는 단서:** 프레임 쪽(메인 베어링 온도)이 먼저 움직인다. 크로스헤드 가속도는 두 스로가 비슷하고, 토출 온도와 로드 드롭은 그대로다.\n- **추정 원인 → 확인 방법**\n  1. 프레임 윤활유 공급 압력, 필터 차압, 크랭크케이스 레벨을 현장에서 본다 [왕복 1].\n  2. 윤활유 시료에서 마모 금속 입자와 수분을 본다.\n  3. 단 토출 압력과 모터 전류 II-2133이 평소보다 높았는지 본다(과부하).\n  4. 정지 기회에 메인 베어링을 분해해 배빗 손상과 크랭크축 저널을 확인한다.\n- **조치:** 경고 단계에서 윤활 계통을 바로 정상으로 돌린다. 온도가 계속 오르면 정지를 계획한다. 프레임 진동이 갑자기 뛰면 정지한다. 베어링이 손상됐으면 바꾼다.\n- **비슷한 원인:** 프레임·기초 헐거움은 메인 베어링 온도가 그대로이고 1X·2X 성분과 양 끝 진폭·위상이 바뀐다 [왕복 1][왕복 2]. 대형 파손은 앞선 온도 상승 없이 프레임 진동이 갑자기 뛴다 [왕복 1].\n\n### 6.5 센서 고장\n\n- 한 태그만 튀거나 값이 고정되고 짝 태그·관련 태그는 그대로면 센서 고장이다. MAN-VIB-01 4절을 따른다.\n- 로드 드롭은 로드가 휘면 값이 출렁인다 [왕복 4]. 피스톤 로드 길이가 지름의 25배를 넘으면 로드 드롭 측정이 맞지 않는다 [왕복 6].\n\n### 6.6 구동 모터\n\n- 모터 베어링 진동, 권선 온도, 전류 이상은 MAN-M-2103을 따른다.\n- 압축기 부하가 늘면 모터 전류 II-2133이 오른다. 압축기 쪽 원인(단 토출 압력 상승 등)이 있는지 이 매뉴얼 5.6절과 함께 본다.\n\n## 7. 관련 문서\n\n- 매뉴얼: MAN-M-2103(구동 모터), MAN-VIB-01(진동·센서 감시 공통 지침)\n- 과거 고장 사례: 사례 색인에서 설비 C-2102로 찾는다.\n\n## 근거\n\n| 번호 | 출처 |\n|---|---|\n| 왕복 1 | Schultheis 외, Reciprocating Compressor Condition Monitoring(METS 2011): API 618 보호 항목, 프레임 센서 위치, 로드 런아웃, 사례 |\n| 왕복 2 | Bently Nevada 왕복동 감시 브로슈어: 센서별 용도, 밸브 재압축 원리 |\n| 왕복 3 | Qureshi, Crosshead Vibration(Orbit 2022): API 670 크로스헤드 조항(2차), 링·밸브 사례 |\n| 왕복 4 | Qureshi, Rider Band Wear(Orbit 2022): 보충 수소 압축기 로드 드롭 사례(432 → 1,252 µm, 경보 1,000 µm, 남은 간극 630 µm) |\n| 왕복 5 | Orbit 2022 국내 CCR 개질 왕복동 사례: 액체 유입·밸브·피스톤 고장, 토출 온도 설정 145 °C |\n| 왕복 6 | Metrix 5580 앱노트(2024): 충격 측정, 로드 드롭 조건, 밸브 온도 경보, 크로스헤드 2배 경험칙 |\n| 왕복 8, 9 | Howes·Stephens, EFRC 2012 / EFRC 진동 지침 정리: 프레임 상부 B/C 8.0, C/D 12.0 mm/s(2차) |\n| 왕복 12 | Eng-Tips: API 618 수소 토출 온도 135 °C(2차) |\n| 왕복 15 | Stachel·Wenisch, PTQ 2014: 정유 수소 압축 용도 |\n| 왕복 16 | Long(Wood), Five simple methods: 밸브 누설 온도 비교, 단 압력 비교 |\n| 왕복 17 | GE Digital 토출 밸브 사례: 285 °F vs 265 °F |\n| 왕복 18, 19 | EFRC 신뢰성 설문(CompressorTECH² 2021), Lv 외 Processes 2021: 예정 외 정지 원인 순위, 밸브 36% |\n| P20, P21 | Baker Hughes Orbit 2022 왕복동 사례(밸브 판 파손), GE Digital 밸브 누설 사례(2.5~3.5주, 1단 토출 압력 −10%) |\n| P22, P23, P24 | Digital Refining(크로스헤드 셧다운 2.0~2.3 g, 파손 경과), PCB(경보 배수), Metrix(헐거움 진행) |\n\n왕복 번호는 `docs/설비조사_6유형.md` 1절 출처, P 번호는 같은 문서 8절이다. 「설비조사 n절」은 같은 문서의 그 절이다. 한계값을 정한 이유는 `docs/설비_태그_마스터_근거.md` 7.3·7.4절에 있다.\n","MAN-F-1100":"# F-1100 상압증류 가열로 유인 송풍기 운전·정비 매뉴얼\n\n> 문서 ID MAN-F-1100 · 개정 2 · 2026-09-15 · 가상 정유 1공장 회전기계팀\n> 교육·시연용 가상 문서다. 숫자의 근거는 끝의 「근거」에 있다. 실제 설비의 설정값은 제조사 기준을 따른다.\n\n## 1. 목적·적용 범위\n\n- 이 매뉴얼은 F-1100을 정상 상태로 운전하고, 관리 항목이 기준을 벗어났을 때 운전원과 정비원이 같은 순서로 대응하도록 정한다.\n- 적용 범위는 F-1100 송풍기 본체다. 임펠러, 커플링 쪽(DE) 구름 베어링, 입구 쪽(NDE) 구름 베어링, 입구 댐퍼를 다룬다.\n- 구동 모터와 가열로 연소 제어는 이 매뉴얼의 범위 밖이다.\n- F-1100 베어링은 압축기·터빈 공용 윤활유 계통(MAN-LUBE-01)을 쓰지 않는다. 베어링 하우징마다 따로 윤활한다.\n- 함께 보는 문서\n  - 진동 판정 기준, 통계 알람의 뜻, 센서 고장 판별, 알람 해제 규칙: MAN-VIB-01\n\n## 2. 설비 개요\n\n| 항목 | 내용 |\n|---|---|\n| 설비 ID | F-1100 |\n| 설비명 | 상압증류 가열로 유인 송풍기 |\n| 유형 | 팬 |\n| 설비 등급 | 2 (1 = 가장 중요) |\n| 유닛 | UNIT-11 상압증류 |\n| 구동기 | — |\n| 파트 | 가열로 유인 송풍기 커플링 쪽 베어링, 가열로 유인 송풍기 입구 쪽 베어링 |\n\n- F-1100은 상압증류 원유 가열로 위에서 노 안의 연도가스를 빨아내 굴뚝으로 보내는 원심 유인 송풍기(ID 팬)다. 굴뚝만으로 통풍이 모자랄 때 단다 [T13].\n- 노 안을 늘 음압으로 유지하는 것이 안전의 핵심이다. 노 안이 양압이 되면 연도가스가 샌다 [T13].\n  - 복사부 상단(arch)에서 약 0.1 inWC(약 25 Pa)의 음압을 유지한다. 이 값은 운전 목표이고 경보값이 아니다 [T13].\n  - 통풍은 입구 박스 댐퍼나 VFD로 조절한다 [T13].\n- 예비기가 없다. 멈추면 통풍이 모자라 가열로를 세우거나 자연 통풍으로 감발 운전해야 한다 [S14]. 그래서 설비 등급이 2다.\n- 모터가 커플링으로 축을 돌린다. 축은 커플링 쪽과 입구 쪽의 구름 베어링 두 개가 받친다 [T12].\n  - 팬 베어링은 대부분 구름 베어링이다. 구면 롤러 베어링을 한쪽은 고정측, 다른 쪽은 자유측으로 두어 축의 열팽창을 흡수한다 [T9][T10].\n- 진동 등급은 AMCA 204의 BV-4(석유화학 공정 팬, 37 kW 초과)이고, 강체 지지로 본다 [T7].\n- 감시 센서\n  - 베어링마다 하우징 진동 가속도계 하나(수평, 진동 속도 mm/s RMS)와 베어링 온도 RTD 하나가 있다 [T7][T8][T9].\n  - 커플링 쪽은 VI-1101H와 TI-1101, 입구 쪽은 VI-1102H와 TI-1102다.\n  - 진동을 수평 방향으로 재는 이유: 임펠러 불균형의 1X 진동은 수평 방향이 크다 [T9][T12].\n- 감시 태그에 없는 값\n  - 수직·축 방향 진동, 진동 주파수 성분, 포락(엔벨로프) 가속도는 정기 점검 때 휴대용 측정기로 잰다(4.2절).\n  - 노 통풍압, 댐퍼 개도, 입구 연도가스 온도는 가열로 DCS 화면에서 본다.\n\n## 3. 관리 항목표\n\n| 태그 | 측정 | 단위 | 평소 값 | 경고 | 알람 | 정지 | 울림 지연 | 해제 폭 · 해제 지연 | 통계 알람 |\n|---|---|---|---|---|---|---|---|---|---|\n| VI-1101H | 가열로 유인 송풍기 커플링 쪽 베어링 진동 수평 | mm/s | 2 | ↑3.1 | ↑4.5 | ↑7.1 | 10초 | 0.04 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| TI-1101 | 가열로 유인 송풍기 커플링 쪽 베어링 온도 | °C | 65 | ↑82 | ↑90 | ↑100 | 0초 | 0.65 · 60초 | 평균↑ |\n| VI-1102H | 가열로 유인 송풍기 입구 쪽 베어링 진동 수평 | mm/s | 2 | ↑3.1 | ↑4.5 | ↑7.1 | 10초 | 0.04 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| TI-1102 | 가열로 유인 송풍기 입구 쪽 베어링 온도 | °C | 65 | ↑82 | ↑90 | ↑100 | 0초 | 0.65 · 60초 | 평균↑ |\n\n↑ 넘으면 이상, ↓ 내려가면 이상. 통계 알람은 정상 구간의 1시간 요약과 비교해 그 통계가 벗어날 때 울리는 경고(LOW)다(MAN-VIB-01 3절).\n\n- 경고·알람·정지는 설비 태그의 「경고 상한(초기 경고)」, 「알람 상한(운전 알람)」, 「정지 상한(설비 보호 정지)」이다.\n- 진동 기준의 근거\n  - 알람 4.5 mm/s와 정지 7.1 mm/s는 AMCA 204 BV-4 강체 지지의 현장 경보·정지값이다 [T7].\n  - 경고 3.1 mm/s는 평소 값에 알람값의 25%를 더한 값이다(ISO 20816 관행 [T6]).\n- 베어링 온도 기준의 근거\n  - 경고 82 °C는 SKF 경험칙 [M20], 알람 90 °C는 TECO 설정 권장 [M28]이다.\n  - 정지 100 °C는 「뚜렷한 이유 없이 100 °C면 이미 문제가 있다」는 SKF 경험칙이다 [T9].\n  - 구름 베어링 하우징은 60~70 °C에서도 손으로 만지면 뜨겁지만, 윤활이 맞으면 정상이다 [T9].\n- **베어링 온도의 하루 주기:** TI-1101과 TI-1102는 주위 온도를 따라 하루에 약 ±2.4 °C 오르내린다. 오후에 가장 높고 새벽에 가장 낮다.\n  - 이 폭은 주위 일교차(울산 10~11월 평년값 약 10 °C)의 절반쯤을 따른다고 본 팀 가정이다.\n  - 하루 주기는 정상이다. 두 베어링이 같은 모양으로 함께 오르내린다.\n- 울림 지연: 그 시간보다 짧게 넘었다가 돌아오면 알람이 울리지 않는다. 진동은 10초다.\n- 해제 폭·해제 지연: 울린 알람은 값이 한계값에서 해제 폭만큼 안쪽으로 돌아와 해제 지연만큼 이어져야 해제된다. 근거는 MAN-VIB-01 5절이다.\n\n## 4. 정상 운전 점검\n\n### 4.1 매 교대\n\n| 항목 | 보는 것 | 정상 |\n|---|---|---|\n| 베어링 온도 TI-1101, TI-1102 | 두 값과 24시간 추이 | 평소 값 부근에서 하루 주기(약 ±2.4 °C)만 보인다. 두 베어링이 같은 모양으로 함께 오르내린다. 한쪽만 하루 주기 위로 계속 오르지 않는다 |\n| 베어링 진동 VI-1101H, VI-1102H | 두 값과 추이 | 평소 값 부근이고 두 베어링이 비슷하다. 순간 튐이 없다 |\n| 노 통풍압, 댐퍼 개도 | 가열로 DCS 화면 | arch 음압이 유지되고, 댐퍼가 명령한 만큼 움직인다 [T13] |\n| 현장 | 이상음, 베어링 하우징 누유·윤활제 누출, 축 관통부의 고온 가스 누설, 기초 볼트 | 이상이 없다 |\n\n### 4.2 정기 점검\n\n| 주기 | 항목 | 이유 |\n|---|---|---|\n| 월 1회 | 휴대용 측정기로 두 베어링의 수평·수직·축 방향 진동 속도, 주파수 성분(1X, 2X, 베어링 결함 주파수), 포락 가속도를 재고 추이를 남긴다 | 감시 태그는 수평 한 방향의 전체 크기뿐이다. 원인을 가르는 성분은 따로 봐야 한다 [T8][T9] |\n| 재윤활 주기마다 | 정해진 양만큼 베어링을 재윤활한다 | 윤활제를 너무 많이 넣으면 휘저음 때문에 오히려 온도가 오른다 [T9]. 재윤활 직후의 일시 변화는 상태 판단에 쓰지 않는다 [T7] |\n| 정지 기회(정기 보수) | 임펠러 퇴적 상태를 육안으로 보고 세정한다. 세정 뒤 남은 불균형을 확인한다 | 퇴적물은 고르게 붙으면 영향이 작지만, 조각이 떨어지면 갑자기 큰 불균형이 된다 [T9]. 세정한 뒤에는 필요하면 밸런싱한다 [T9] |\n| 세정·정비 뒤 기동 | 기동 전후 진동을 정비 전 값과 비교한다(기동 뒤 24시간). 커플링 정렬을 확인한다 | 임펠러 세정·베어링 교체 같은 작업 뒤에는 축 정렬 확인을 권한다 [T9]. 정비 직후의 계단 상승은 정비 품질 문제일 수 있다 |\n\n## 5. 이상 시 조치\n\n모든 알람에서 먼저 할 일은 같다.\n1. 짝 태그를 본다. 같은 베어링의 진동과 온도, 반대쪽 베어링의 진동과 온도다. 진동 한 태그만 튀고 나머지가 그대로면 센서 고장부터 의심한다(MAN-VIB-01 4절).\n2. 값이 언제부터 어떤 모양(서서히, 계단, 튐, 출렁임)으로 바뀌었는지 1시간 요약으로 본다. 온도는 하루 주기를 빼고, 전날 같은 시각 값과 비교한다.\n3. 직전 작업을 확인한다. 세정, 정비, 재윤활, 가열로 운전 변경이다.\n4. 아래 항목별 조치를 하고, 원인은 6절 표에서 좁힌다.\n\n### 5.1 베어링 진동 VI-1101H(커플링 쪽), VI-1102H(입구 쪽)\n\n**관리 기준** — 평소 2 mm/s · 경고 ↑3.1 · 알람 ↑4.5 · 정지 ↑7.1 mm/s · 울림 지연 10초 · 해제 폭 0.04 mm/s · 해제 지연 15초\n\nVI-1102H도 기준이 같다.\n- **경고**\n  1. 반대쪽 베어링 진동과 같은 쪽 베어링 온도를 같이 본다.\n  2. 두 베어링 진동이 함께 올랐고 온도는 그대로면 임펠러 불균형 쪽이다(6.1절).\n  3. 한 베어링 진동과 그 베어링 온도가 함께 올랐으면 구름 베어링 결함 쪽이다(6.2절).\n  4. 계단처럼 한 번에 뛰었으면 직전 작업(세정, 정비)이 있었는지, 퇴적물이 떨어져 나갔는지 본다(6.1절, 6.3절).\n  5. 한 태그만 몇 초씩 튀거나 출렁이고 온도·반대쪽 진동이 그대로면 센서 고장 판별을 한다(6.4절).\n- **알람:** 정비 담당에게 알리고 휴대용 측정기로 진동 분석(1X, 2X, 베어링 결함 주파수, 포락 가속도)을 요청한다 [T8][T9]. 회전수를 낮출지는 노 통풍을 지킬 수 있는 범위에서 가열로 운전원과 정한다.\n- **정지:** 설비 보호 정지 값이다(AMCA 204 BV-4 정지값 [T7]). 정지되면 원인을 찾기 전까지 재기동하지 않는다. 가열로는 통풍 상실 절차에 따라 세우거나 감발한다.\n\n### 5.2 베어링 온도 TI-1101(커플링 쪽), TI-1102(입구 쪽)\n\n**관리 기준** — 평소 65 °C · 경고 ↑82 · 알람 ↑90 · 정지 ↑100 °C · 울림 지연 0초 · 해제 폭 0.65 °C · 해제 지연 60초\n\nTI-1102도 기준이 같다.\n- **먼저 하루 주기를 뺀다.** 오후에 2 °C 남짓 오른 것만으로는 이상이 아니다. 두 베어링이 같은 모양으로 오르내리면 주위 온도 영향이다.\n- **경고**\n  1. 반대쪽 베어링 온도와 비교한다.\n  2. 한 베어링만 하루 주기 위로 계속 오르고 그쪽 진동도 함께 올랐으면 구름 베어링 결함이다(6.2절).\n  3. 한 베어링만 오르고 진동은 그대로면 윤활 상태(재윤활 직후의 과다 충전, 윤활 부족)를 본다. 뜨겁다고 윤활제를 더 넣으면 오히려 나빠질 수 있다 [T9].\n  4. 입구 쪽 베어링 온도가 입구 연도가스 온도와 함께 서서히 오르면 고온 가스가 축을 타고 베어링 쪽으로 새는지 본다 [T9].\n  5. 하우징 80 °C에서 일정 기간 10% 넘게 오르면 이상일 가능성이 크다 [T9].\n- **알람:** 정비 담당에게 알리고 6.2절 점검을 시작한다. 온도를 휴대용 적외선 온도계로 다시 잰다 [T9].\n- **정지:** 설비 보호 정지 값이다. 정지되면 재기동 전에 베어링을 점검한다.\n\n## 6. 고장별 증상·점검·조치\n\n원인은 대부분 데이터만으로 하나로 확정할 수 없다. 아래 「추정 원인」은 현장 확인으로 확정한다. 매뉴얼이 정한 조치는 그대로 따른다.\n\n| 절 | 고장 | 먼저 움직이는 태그와 모양 | 가르는 단서 |\n|---|---|---|---|\n| 6.1 | 임펠러 퇴적 불균형 | VI-1101H와 VI-1102H가 함께 서서히↑, 퇴적물이 떨어지면 계단처럼 급변 | 베어링 온도 TI-1101·TI-1102가 그대로다 |\n| 6.2 | 구름 베어링 결함 | 한쪽 베어링 진동(VI-1101H 또는 VI-1102H)↑ + 같은 쪽 온도(TI-1101 또는 TI-1102)↑ | 같은 쪽 온도가 함께 오른다. 반대쪽은 그대로다 |\n| 6.3 | 그 밖에 진동이 오르는 고장(정렬 불량, 풀림, 날개 마모, 공진) | 정비 직후 계단↑, 불규칙한 급변, 몇 달 서서히↑, 특정 회전수에서만↑ | 진동 주파수 성분(2X, 축 방향)과 직전 작업·회전수 |\n| 6.4 | 센서 고장 | 한 태그만 튐·출렁임·고정 | 짝 태그(반대쪽 진동, 같은 쪽 온도)와 어긋난다 |\n\n### 6.1 임펠러 퇴적 불균형\n\n- **증상**\n  - 연도가스에 섞인 고형물이 임펠러에 붙는다. 고르게 붙으면 불균형이 작다. 한쪽이 무거워지면 회전수와 같은 주파수(1X) 진동이 커지고, 수평 방향이 크다 [T9][T12].\n  - 퇴적물이 쌓이는 동안은 두 베어링 진동이 몇 주에 걸쳐 함께 서서히 오른다. 쌓인 조각이 원심력으로 떨어져 나가면 갑자기 큰 불균형이 생겨 계단처럼 뛴다 [T9].\n  - 세정 뒤 퇴적물이 고르지 않게 남아도 같은 이유로 불균형이 된다. 이때는 세정 뒤 기동한 직후부터 진동이 높다(추론).\n  - 운전 회전수가 공진 근처면 작은 퇴적에도 진동이 크게 반응한다 [T9][T12].\n  - **베어링 온도는 그대로다.** 구름 베어링 결함과 가르는 단서다. 불균형이 아주 오래 크게 이어지면 나중에 베어링 온도가 오를 수 있다(설비조사 6.4절).\n- **크기 감각**\n  - 작은 질량 변화에도 1X가 크게 바뀐다. 정유 FD 팬에서 시험추 91 g 하나로 1X가 4.4 mils에서 7.3 mils 또는 1.2 mils가 됐다 [P41].\n  - 평소 값에서 구역 B/C 경계(F-1100은 알람값 4.5 mm/s)의 25%를 넘게 계단처럼 변하면 의미 있는 변화로 본다 [P40].\n  - 퇴적이 빠른 곳은 정지 주기가 짧다. 시멘트 킬른 ID 팬은 1~5주, 예열기 팬은 2~4주마다 세정했고 [P38], 발전소 ID 팬은 해마다 한 번 세정한다 [P39].\n- **추정 원인 → 확인 방법**\n  1. 베어링 온도 TI-1101·TI-1102가 하루 주기 말고는 그대로인지 본다. 같은 쪽 온도가 함께 오르면 6.2절이다.\n  2. 두 베어링 진동이 함께 움직였는지 본다. 한쪽만 움직였으면 6.2절이나 6.4절이다.\n  3. 휴대용 측정기로 1X 성분과 위상을 본다. 1X가 주된 성분이고 수평이 수직보다 크면 불균형이다 [T8][T9]. 계단 때 1X 위상도 바뀌었으면 퇴적물이 떨어져 나간 것이다.\n  4. 변화의 모양과 시점을 본다. 몇 주 서서히 오른 뒤 계단이면 쌓인 퇴적물의 탈락이다. 세정·정비 직후부터 높으면 세정 뒤 남은 퇴적물이나 정비 품질(6.3절 정렬 불량)이다.\n  5. 정지 기회에 점검구를 열어 날개마다 퇴적 상태를 본다.\n- **조치**\n  - 임펠러를 세정하고, 세정 뒤 남은 불균형은 현장 밸런싱으로 잡는다 [T9]. 정유 FD 팬은 밸런싱으로 1X가 4.4 mils에서 1.2 mils로 내려갔고 [T12], 밸런싱 뒤 11 mm/s에서 1.8 mm/s로 내려간 사례가 있다 [P42].\n  - 세정 뒤에는 축 정렬을 확인한다 [T9].\n  - 세정 주기는 진동의 통계 알람(평균↑) 추이를 보고 정한다. 계단이 나기 전에 세정하는 것이 목표다.\n\n### 6.2 구름 베어링 결함\n\n- **증상**\n  - 궤도나 전동체에 결함(박리 등)이 생기면 베어링 결함 주파수 성분과 포락 가속도가 오른다. 이것이 진동 속도·온도보다 먼저 오른다고 보지만, 근거는 추정이다 [T8][T9].\n  - 진행하면 그 베어링의 진동 속도와 하우징 온도가 함께 서서히 오르고, 말기에는 급변한다 [T8][T9].\n  - 한 베어링의 문제라 그쪽 진동·온도만 움직이고 반대쪽은 하루 주기 말고는 그대로다.\n- **추정 원인 → 확인 방법**\n  1. 같은 쪽 온도가 진동과 함께 올랐는지, 반대쪽은 그대로인지 본다.\n  2. 하루 주기와 구분한다. 주위 온도 때문이면 두 베어링이 같은 모양이다. 결함이면 한쪽만 하루 주기 위로 계속 오른다.\n  3. 휴대용 측정기로 베어링 결함 주파수(외륜·내륜·전동체)와 포락 가속도를 본다 [T8][T9]. 진동 속도·포락 가속도·온도를 함께 추이로 남긴다 [T9].\n  4. 윤활 이력(재윤활 날짜와 양)과 윤활제 상태(변색, 이물, 수분)를 본다 [T9].\n  5. 정지 기회에 베어링을 분해해 궤도면 박리, 압흔, 변색과 내륜이 축 위에서 돈 흔적을 본다 [T9].\n- **추정 원인:** 윤활 부족·열화, 과다 윤활, 이물·수분 유입, 정렬 불량에 따른 과부하, 잘못된 끼워 맞춤 [T8][T9].\n- **조치**\n  - 결함 주파수가 확인되면 교체 계획을 세운다. 진동·온도 추이로 진행 속도를 보며 정지 시기를 정한다.\n  - 알람을 넘고 온도가 계속 오르면 정지해 교체한다.\n  - 교체 뒤 기동하면 정비 전 값과 진동을 비교하고 축 정렬을 확인한다 [T9].\n\n### 6.3 그 밖에 진동이 오르는 고장\n\n| 고장 | 모양 | 가르는 단서 | 근거 |\n|---|---|---|---|\n| 정렬 불량 | 정비 직후 계단처럼 오른다(추정) | 2X 성분이 크고, 베어링이 과열될 수 있다 | [T8][T9] |\n| 풀림(임펠러·하우징·기초 볼트) | 급변하거나 불규칙하다(추정) | 2X 성분이 생긴다 | [T8][T9] |\n| 날개 마모·침식·균열 | 서서히 오른다 | 1X가 오른다. 세정해도 돌아오지 않는다(추론) | [T9] |\n| 공진 | 특정 회전수에서만 오른다 | 회전수를 바꾸면 크게 달라진다. 밸런싱으로 잘 잡히지 않는다 | [T11][T12] |\n\n### 6.4 센서 고장\n\n한 태그만 튀거나 출렁이거나 값이 고정되고 짝 태그는 그대로면 센서 고장이다. 케이블 결함 같은 계기 쪽 원인이 있다 [T4]. MAN-VIB-01 4절을 따른다.\n- F-1100의 짝 태그: VI-1101H는 VI-1102H(반대쪽 진동)와 TI-1101(같은 쪽 온도), VI-1102H는 VI-1101H와 TI-1102다.\n- 하우징 진동은 기계가 1초 만에 크게 변할 수 없다. 정지값을 넘었는데 다른 값이 모두 그대로면 센서 쪽이다(MAN-VIB-01 4.1절).\n\n## 7. 관련 문서\n\n- 매뉴얼: MAN-VIB-01(진동·센서 감시 공통 지침)\n- 과거 고장 사례: 사례 색인에서 설비 F-1100으로 찾는다.\n\n## 근거\n\n| 번호 | 출처 |\n|---|---|\n| T4 | ISO 20816-3:2022 미리보기(케이블 결함 등 계기 쪽 원인) |\n| T6 | Fabrico, ISO 20816 진동 등급 구역(알람 = 평소 + 구역 B 상한의 25%) |\n| T7 | ANSI/AMCA 204-20(BV-4 분류, 현장 경보·정지값, 측정 방향, 재윤활 등 일시 변화 제외) |\n| T8 | Greenheck FA/108-00(1X·2X·베어링 결함 주파수, 측정 방향) |\n| T9 | SKF 팬 고장 진단 가이드(퇴적·탈락, 세정과 밸런싱, 정렬, 공진, 고온 가스, 과다 윤활, 하우징 온도 경험칙) |\n| T10 | SKF Evolution(1997), 팬의 구면 롤러 베어링 배치 |\n| T11 | Engineering Dynamics, 원유 가열로 ID 팬(비틀림 공진) |\n| T12 | Engineering Dynamics, 정유 FD 팬 밸런싱(불균형·공진, 4.4 → 1.2 mils) |\n| T13 | Garg, Chemical Engineering(2004)(ID 팬 역할, 통풍 제어, arch 음압) |\n| S14 | Sloley, Don't err with fans, Chemical Processing(2020)(송풍기 고장 시 정지 또는 자연 통풍 감발) |\n| M20, M28 | SKF(Reliable Plant) 82 °C 규칙, TECO-Westinghouse RTD 경보·정지 설정 권장 |\n| P38, P39 | Robinson Fans 시멘트 팬 퇴적 주기, Chesterton 발전소 ID 팬 연 1회 세정 |\n| P40 | Fabrico, ISO 10816-3 진동 등급(25% 변화) |\n| P41, P42 | Engineering Dynamics 정유 FD 팬(시험추와 1X 변화), Instrumentation.co.za(밸런싱 뒤 회복) |\n| 팀 가정 | 베어링 온도 하루 주기 약 ±2.4 °C: 주위 일교차(기상청 울산 평년값, 10월 9.7 °C·11월 10.2 °C)의 절반을 따른다고 봄(`docs/생성기_근거.md` D-33) |\n\nT 번호는 `docs/설비조사_6유형.md` 5·6절 출처, S 번호는 같은 문서 0절 출처, M 번호는 3·4절 출처, P 번호는 8절이다.\n","MAN-LUBE-01":"# 재순환 가스 압축기·구동 터빈 공용 윤활유 계통 운전·정비 매뉴얼\n\n> 문서 ID MAN-LUBE-01 · 개정 2 · 2026-09-15 · 가상 정유 1공장 회전기계팀\n> 교육·시연용 가상 문서다. 실제 설비의 설정값은 제조사 기준을 따른다.\n\n## 1. 목적·적용 범위\n\n- C-2100(재순환 가스 압축기)과 T-2101(구동 증기 터빈)은 윤활유 콘솔 하나를 함께 쓴다. 이 매뉴얼은 그 콘솔의 정상 운전과 이상 시 조치를 정한다.\n- 콘솔에 문제가 생기면 압축기와 터빈의 모든 베어링이 함께 영향을 받는다. 그래서 피해 범위가 가장 넓은 계통이다 [원심 S8].\n- 베어링 자체의 문제는 각 설비 매뉴얼(MAN-C-2100 6.2절, MAN-T-2101)을 따른다.\n\n## 2. 계통 개요\n\n| 구성 | 하는 일 | 상태를 보는 방법 |\n|---|---|---|\n| 기름 탱크 | 기름을 담고 공기·물을 분리한다 | 현장 레벨 게이지 |\n| 주 펌프·예비 펌프 | 기름을 보낸다. 주 펌프 압력이 떨어지면 예비 펌프가 자동 기동한다 | 현장 압력계, 펌프 운전 표시 |\n| 쿨러 2대(한 대 예비) | 냉각수로 기름을 식힌다. 전환 밸브로 운전 중 바꿀 수 있다 | 쿨러 입출구 기름·냉각수 온도(현장) |\n| 온도 조절 밸브(TCV) | 쿨러를 지나는 기름과 우회하는 기름을 섞어 공급 온도를 맞춘다 | 밸브 개도(현장) |\n| 필터 2대(한 대 예비) | 이물을 거른다 | 현장 차압계 |\n| 공급 헤더 | 압축기·터빈 베어링으로 나눠 보낸다 | 공급 온도 TI-2108 |\n\n- DB로 감시하는 값은 공급 온도 TI-2108과, 기름을 받는 베어링들의 메탈 온도(TI-2101, TI-2102, TI-2111)다. 공급 압력·필터 차압·탱크 레벨은 현장 계기로 본다.\n- 쿨러와 필터를 두 대씩 두고 운전 중 바꿀 수 있게 하는 것은 특수 목적 윤활 계통의 일반 구성이다(API 614).\n\n## 3. 관리 항목표\n\n| 태그 | 측정 | 단위 | 평소 값 | 경고 | 알람 | 정지 | 울림 지연 | 해제 폭 · 해제 지연 | 통계 알람 |\n|---|---|---|---|---|---|---|---|---|---|\n| TI-2108 | 재순환 압축기 윤활유 공급 온도 | °C | 45 | ↑55 | ↑60 / ↓30 |  | 0초 | 0.45 · 60초 | 평균↑ |\n| TI-2101 | 재순환 압축기 구동측 베어링 메탈 온도 | °C | 80 | ↑90 | ↑95 | ↑115 | 0초 | 0.8 · 60초 | 평균↑ |\n| TI-2102 | 재순환 압축기 반구동측 베어링 메탈 온도 | °C | 80 | ↑90 | ↑95 | ↑115 | 0초 | 0.8 · 60초 | 평균↑ |\n| TI-2111 | 구동 터빈 배기 쪽 베어링 메탈 온도 | °C | 80 | ↑90 | ↑95 | ↑115 | 0초 | 0.8 · 60초 | 평균↑ |\n\n↑ 넘으면 이상, ↓ 내려가면 이상. 통계 알람은 정상 구간의 1시간 요약과 비교해 그 통계가 벗어날 때 울리는 경고(LOW)다(MAN-VIB-01 3절).\n\n## 4. 정상 운전 점검\n\n| 주기 | 항목 | 정상 |\n|---|---|---|\n| 매 교대 | 공급 온도 TI-2108 | 평소 값 부근이다. 하루 동안 주위 온도를 따라 1 °C 안팎 오르내리는 것은 정상이다 |\n| 매 교대 | 베어링 온도 TI-2101, TI-2102, TI-2111 | 세 베어링이 공급 온도와 같은 방향으로 조금씩 움직인다 |\n| 매 교대 | 현장: 필터 차압, 탱크 레벨, 쿨러 냉각수 입출구 온도, 누유 | 이상이 없다 |\n| 월 1회 | 기름 시료 분석(점도, 수분, 산가, MPC) | MAN-C-2100 4.2절 |\n| 분기 1회 | 예비 펌프 자동 기동 시험, 예비 쿨러·필터 전환 시험 | 전환 중 공급 온도·압력이 크게 흔들리지 않는다 |\n\n## 5. 이상 시 조치\n\n### 5.1 공급 온도 TI-2108\n\n**관리 기준** — 평소 45 °C · 경고 ↑55 · 알람 ↑60 / ↓30 °C · 울림 지연 0초 · 해제 폭 0.45 °C · 해제 지연 60초\n\n- **오를 때(경고·알람)**\n  1. 압축기·터빈 베어링 온도가 함께 같은 모양으로 오르는지 본다. 함께 오르면 이 계통 문제가 맞다.\n  2. 언제부터 어떤 속도로 올랐는지 1시간 요약으로 본다. 속도가 원인을 가른다(6절 표).\n  3. 온도 조절 밸브 개도를 본다. 다 열려 있으면(쿨러 쪽으로 모두 보냄) 쿨러가 열을 못 빼는 것이다. 우회 쪽에 멈춰 있으면 밸브 고착이다.\n  4. 쿨러 냉각수가 들어가는지, 냉각수 입출구 온도 차를 본다.\n  5. 원인을 바로 못 찾으면 예비 쿨러로 바꾼다.\n- **내려갈 때(알람):** 쿨러 우회가 막혔거나 온도 조절 밸브가 쿨러 쪽에 멈춘 것이다. 기름이 차가우면 점도가 올라 베어링이 불안정해질 수 있으니 밸브를 수동으로 맞춘다.\n\n### 5.2 공급 압력이 떨어질 때(현장 계기)\n\n- 예비 펌프가 자동 기동했는지 본다. 필터 차압이 높으면 예비 필터로 바꾼다.\n- 윤활유 저압 정지에는 보통 시간 지연을 두지 않는다 [원심 21]. 압력이 계속 떨어지면 정지에 대비한다.\n\n## 6. 고장별 증상·점검·조치\n\n| 원인 | 공급 온도의 모양 | 베어링 | 가르는 단서 | 근거 |\n|---|---|---|---|---|\n| 쿨러 성능 저하(냉각수 쪽 파울링) | 몇 주~몇 달에 걸쳐 서서히 오른다. 온도 조절 밸브가 쿨러 쪽으로 다 열린 뒤부터 보인다 | 압축기·터빈 베어링이 함께 서서히 오른다 | 오르는 속도가 느리고, 밸브가 쿨러 쪽으로 다 열려 있다 | [P7] |\n| 온도 조절 밸브 고착(우회 쪽) | 몇 시간 안에 오른다. 부분 고착이면 며칠에 걸쳐 오른다 | 함께 오른다 | 밸브 개도가 움직이지 않는다. 쿨러 출구 기름 온도는 낮은데 공급 온도만 높다 | [P8] |\n| 냉각수 공급 끊김 | 빠르게 크게 오른다(약 77 °C까지 오른 사례) | 진동이 공급 온도 출렁임을 따라간다 | 쿨러 냉각수 입출구 온도 차가 사라진다 | [P9] |\n| 필터 막힘·펌프 고장 | 온도보다 공급 압력이 먼저 떨어진다 | 기름이 모자라 온도가 오르고, 심하면 스러스트 베어링까지 상한다 | 현장 압력계·필터 차압계 | [원심 S8][원심 21] |\n\n### 6.1 쿨러 성능 저하\n\n- **추정 원인 → 확인:** 냉각수 쪽 파울링이 몇 주~몇 달에 걸쳐 쌓인다 [P7]. 쿨러 입출구 기름 온도 차가 예전보다 작아졌는지 본다.\n- **조치:** 예비 쿨러로 바꾸고, 빼낸 쿨러를 세정한다. 이물을 뺀 쿨러를 다시 넣으면 몇 분 안에 베어링 온도가 반응한다 [P9].\n\n### 6.2 온도 조절 밸브 고착\n\n- **추정 원인 → 확인:** 밸브 내부 이물이나 감온 요소 고장으로 우회 쪽에 멈춘다 [P8]. 밸브 개도 표시와 실제 위치가 맞는지, 쿨러 출구 온도와 공급 온도 차가 큰지 본다.\n- **조치:** 밸브를 수동 위치로 두고 공급 온도를 맞춘 뒤 밸브를 정비한다.\n\n### 6.3 베어링이 공급 온도를 얼마나 따라가나\n\n- 공급 온도가 1 °C 오를 때 베어링 메탈 온도가 오르는 폭은 자료마다 다르다. 0.2 °C 이하로 본 연구가 있고 [P11], 공급 온도 25%(°F) 상승에 배빗 최고 온도가 17.6% 오른 시험이 있다 [P10].\n- 그래서 「공급 온도가 먼저 오르고 여러 베어링이 같은 모양으로 따라 오른다」는 순서와 모양으로 판단한다. 크기 비율로 판단하지 않는다.\n- 공급 온도는 그대로인데 한 베어링만 오르면 이 계통 문제가 아니다. MAN-C-2100 6.2절(저널 베어링 이상)로 간다.\n\n## 7. 관련 문서\n\n- MAN-C-2100(재순환 가스 압축기), MAN-T-2101(구동 증기 터빈), MAN-VIB-01(진동·센서 감시 공통 지침)\n- 과거 고장 사례: 사례 색인에서 설비 C-2100, T-2101로 찾는다.\n\n## 근거\n\n| 번호 | 출처 |\n|---|---|\n| 원심 S8, 원심 21 | `docs/원심압축기_해부도.html` 고장 시나리오 S8(윤활유 계통 고장), Turbomachinery Magazine, Compressor lubrication(저압 정지에 지연 없음) |\n| P7 | HTRI, 쿨러 파울링 규모(몇 주~몇 달) |\n| P8 | Industrial Monitor Direct, 윤활유 탱크 고온 문제 해결(온도 조절 밸브 고착) |\n| P9 | core.ac.uk 87264832, 냉각수 미투입과 쿨러 재투입 뒤 반응 |\n| P10, P11 | Kingsbury 1988(공급 온도와 배빗 온도), Industrial Lubrication and Tribology ILT-01-2017-0021 |\n| API 614 | 특수 목적 윤활 계통(쿨러·필터 이중화) — 원문 유료, 일반 구성으로만 인용 |\n","MAN-M-2103":"# M-2103 보충 수소 압축기 구동 모터 운전·정비 매뉴얼\n\n> 문서 ID MAN-M-2103 · 개정 2 · 2026-09-15 · 가상 정유 1공장 회전기계팀\n> 교육·시연용 가상 문서다. 숫자의 근거는 끝의 「근거」에 있다. 실제 설비의 설정값은 제조사 기준을 따른다.\n\n## 1. 목적·적용 범위\n\n- 이 매뉴얼은 M-2103을 정상 상태로 운전하고, 관리 항목이 기준을 벗어났을 때 운전원과 정비원이 같은 순서로 대응하도록 정한다.\n- 적용 범위는 M-2103 모터 본체다. 구동측·반구동측 구름 베어링, 고정자 권선, 회전자, 냉각(외부 팬·흡입 필터·프레임 핀), 모터 전류를 다룬다.\n- 함께 보는 문서\n  - 피동기 보충 수소 압축기: MAN-C-2102\n  - 진동 판정 기준, 통계 알람의 뜻, 센서 고장 판별, 알람 해제 규칙: MAN-VIB-01\n\n## 2. 설비 개요\n\n| 항목 | 내용 |\n|---|---|\n| 설비 ID | M-2103 |\n| 설비명 | 보충 수소 압축기 구동 모터 |\n| 유형 | 모터 |\n| 설비 등급 | 2 (1 = 가장 중요) |\n| 유닛 | UNIT-21 수첨분해 |\n| 구동기 | — (C-2102 를 구동) |\n| 파트 | 보충 수소 압축기 모터 구동측 베어링, 보충 수소 압축기 모터 반구동측 베어링, 보충 수소 압축기 모터 고정자 권선 |\n\n- M-2103은 보충 수소 왕복동 압축기 C-2102를 커플링으로 바로 돌리는 농형 유도 전동기다. 3상 전원이 만드는 회전 자계로 회전자를 돌린다.\n- 크기는 약 500 kW, 750 rpm으로 본다. 수소 플랜트의 왕복동 압축기를 이 크기의 유도 전동기로 직결한 예가 있다 [S8].\n  - 전압은 6.6 kV로 가정했다. 정격 전류는 이 가정에서 계산한 약 54 A다(팀 가정).\n- 예비기가 없다고 본다. 멈추면 보충 수소가 끊겨 유닛 원료를 줄여야 한다(추정). 그래서 설비 등급이 2다.\n- 베어링은 그리스로 윤활하는 구름 베어링으로 가정했다. 이 크기는 구름 베어링과 슬리브 베어링을 모두 쓸 수 있다 [M24].\n- 냉각은 전폐 외선형(TEFC)으로 가정했다. 반구동측 축 끝의 외부 팬이 흡입 필터를 거쳐 바깥 공기를 빨아들이고, 팬 커버를 지나 프레임 바깥의 핀 사이로 불어 준다. 핀에 먼지가 쌓이면 열이 갇힌다 [M37].\n- 절연은 F종(최고 허용 155 °C)에 B종 온도 상승(130 °C)으로 여유를 둔 설계로 가정했다. 흔한 설계 방식이다 [M29].\n- 큰 농형 회전자는 구리 바를 끼워 양 끝 단락환에 붙여 만든다. 그래서 바와 단락환의 접합부가 깨질 수 있다 [M32].\n- 감시 센서\n  - 구동측(DE, 커플링 쪽)과 반구동측(NDE, 팬 쪽) 베어링 하우징에 진동 가속도계가 하나씩 있다. 값은 수평 방향 진동 속도(mm/s)다.\n  - 구동측 베어링에만 온도 RTD TI-2131이 있다. 반구동측 베어링 온도는 현장에서 휴대용 온도계로 잰다.\n  - 고정자 권선에는 RTD가 상마다 2개씩, 모두 6개 묻혀 있다 [M25]. 제어실로 오는 값은 대표값 TI-2133 하나이고, 6개 값은 모터 보호 계전기에서 따로 본다(팀 가정).\n  - 모터 전류 II-2133은 전류 변환기(CT)를 거쳐 모터 보호 계전기로 들어온다. 3상 전류와 전압은 계전기·변전실 화면에서 본다.\n- 모터 고장은 베어링(41~51%), 고정자 권선(16~36%), 회전자(5~9%) 순으로 많다 [M34].\n\n## 3. 관리 항목표\n\n| 태그 | 측정 | 단위 | 평소 값 | 경고 | 알람 | 정지 | 울림 지연 | 해제 폭 · 해제 지연 | 통계 알람 |\n|---|---|---|---|---|---|---|---|---|---|\n| VI-2131H | 보충 수소 압축기 모터 구동측 베어링 진동 수평 | mm/s | 1.5 | ↑2.6 | ↑4.5 | ↑7.1 | 10초 | 0.03 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| TI-2131 | 보충 수소 압축기 모터 구동측 베어링 온도 | °C | 65 | ↑82 | ↑90 | ↑100 | 0초 | 0.65 · 60초 | 평균↑ |\n| VI-2132H | 보충 수소 압축기 모터 반구동측 베어링 진동 수평 | mm/s | 1.5 | ↑2.6 | ↑4.5 | ↑7.1 | 10초 | 0.03 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| TI-2133 | 보충 수소 압축기 모터 고정자 권선 온도 | °C | 105 | ↑130 | ↑140 | ↑155 | 0초 | 1.05 · 60초 | 평균↑ |\n| II-2133 | 보충 수소 압축기 모터 전류 | A | 46 | ↑54 | ↑60 | ↑65 | 0초 | 0.92 · 15초 | 평균↑, 표준편차↑ |\n\n↑ 넘으면 이상, ↓ 내려가면 이상. 통계 알람은 정상 구간의 1시간 요약과 비교해 그 통계가 벗어날 때 울리는 경고(LOW)다(MAN-VIB-01 3절).\n\n- 경고·알람·정지는 설비 태그의 「경고 상한(초기 경고)」, 「알람 상한(운전 알람)」, 「정지 상한(설비 보호 정지)」이다.\n- 값의 근거\n  - **하우징 진동 VI-2131H, VI-2132H:** 300 kW를 넘는 모터(ISO 20816-3 Group 1, 강성 받침)의 구역 경계다. 구역 B/C 4.5 mm/s를 넘으면 장기 운전에 맞지 않고, 구역 C/D 7.1 mm/s를 넘으면 손상 위험이 있다 [M3]. 경고 2.6은 「평소 값 + 구역 B 상한의 25%」 규칙으로 정했다 [M3].\n  - **구동측 베어링 온도 TI-2131:** 경고 82 °C는 SKF 경험칙 [M20], 알람 90 °C는 TECO 권장 [M28], 정지 100 °C는 「100 °C면 이미 문제」라는 SKF 안내 [T9]에서 가져왔다.\n  - **권선 온도 TI-2133:** 경고 130 °C는 B종 상한, 정지 155 °C는 F종 상한이다 [M29]. 알람 140 °C는 GE 469의 트립 범위 140~155 °C의 아래 끝이다 [M27].\n  - **모터 전류 II-2133:** 정격 전류(약 54 A)의 100%·110%·120%다(팀 가정). 서비스 계수 1.15 모터는 정격의 115%까지 돌릴 수 있지만, 그때는 온도 상승을 정격보다 10 K 높게까지 허용한다 [P31]. 정격을 넘는 운전은 그만큼 권선을 더 뜨겁게 한다.\n- 권선 온도는 주위 온도를 1:1로 따라가고, 새 값에 안정되기까지 최대 약 8시간 걸린다 [P27]. 그래서 하루 일교차를 따라 약 ±4 K 오르내리는 것은 정상이다(가을 일교차 약 10 °C에서 낸 팀 추정). 낮 최고는 주위 온도 최고보다 몇 시간 늦다.\n- 통계 알람은 정상 구간과 비교하므로, 여름처럼 주위 온도가 크게 오르면 고장 없이도 권선 온도 통계 알람(평균↑)이 울릴 수 있다. 이때는 권선 온도와 주위 온도의 차이를 본다(5.1절).\n- 울림 지연·해제 폭·해제 지연의 뜻과 근거는 MAN-VIB-01 3절·5절이다.\n\n## 4. 정상 운전 점검\n\n### 4.1 매 교대\n\n| 항목 | 보는 것 | 정상 |\n|---|---|---|\n| 권선 온도 TI-2133 | 값과 24시간 추이 | 평소 값 부근이다. 주위 온도를 따라 하루 ±4 K 안팎 오르내리고, 주위 온도와의 차이는 거의 일정하다 |\n| 모터 전류 II-2133 | 값과 1시간 추이 | 평소 값 부근이다. 공정 조작이 없는데 수준이 바뀌거나, 값이 주기적으로 크게 흔들리지 않는다 |\n| 베어링 진동 VI-2131H, VI-2132H | 두 값과 추이 | 평소 값 부근이다. 한쪽만 서서히 오르거나 계단처럼 뛰지 않는다 |\n| 구동측 베어링 온도 TI-2131 | 값 | 평소 값 부근이다 |\n| 현장 | 소리, 냉각 공기, 외관 | 베어링 긁힘 소리나 「그르렁」 하는 맥동음이 없다. 팬 커버 출구에서 바람이 고르게 나온다. 흡입 필터와 프레임 핀에 먼지가 덮이지 않았다 |\n\n### 4.2 정기 점검\n\n| 주기 | 항목 | 이유 |\n|---|---|---|\n| 주 1회 | 냉각 공기 흡입 필터와 프레임 핀 육안 점검. 꽃가루·황사가 많은 봄철에는 더 자주 본다 | 필터나 핀이 막히면 전류는 그대로인데 권선 온도가 서서히 오른다 [M37][P25] |\n| 월 1회 | 베어링 진동 측정: 속도 스펙트럼과 고주파 엔벨로프 | 구름 베어링 손상은 고주파 성분이 먼저 오르고, 하우징 진동 속도와 온도는 나중에 오른다 [M18] |\n| 제조사 주기 | 그리스 보충, 보충 기록 | 윤활 부족은 구름 베어링 손상의 흔한 원인이다 |\n| 분기 1회 | 전류 스펙트럼 분석(MCSA) | 회전자 바 균열은 전류 스펙트럼의 측파대로 먼저 드러난다 [M31] |\n| 분기 1회 | 단자 전압 불평형 측정 | 1% 이하를 권장한다. 넘으면 출력을 낮춰야 한다 [M30] |\n| 기동 때마다 | 기동 횟수와 간격 기록 | 잦은 직입 기동은 회전자 바 균열의 원인이다 [설비조사 4.4] |\n| 정기 보수 | 절연 저항, 프레임 핀 청소, 외부 팬 날개 점검 | 권선 온도가 10 °C 오를 때마다 절연 수명이 반으로 준다 [M30] |\n\n## 5. 이상 시 조치\n\n모든 알람에서 먼저 할 일은 같다.\n1. 같은 설비의 다른 태그와 짝 태그가 함께 움직였는지 본다. 진동은 구동측·반구동측을, 권선 온도는 전류를 짝으로 본다. 한 태그만 튀면 센서 고장부터 의심한다(MAN-VIB-01 4절).\n2. 값이 언제부터 어떤 모양(서서히, 계단, 출렁임)으로 바뀌었는지 1시간 요약으로 본다.\n3. 아래 항목별 조치를 하고, 원인은 6절 표에서 좁힌다.\n\n### 5.1 고정자 권선 온도 TI-2133\n\n**관리 기준** — 평소 105 °C · 경고 ↑130 · 알람 ↑140 · 정지 ↑155 °C · 울림 지연 0초 · 해제 폭 1.05 °C · 해제 지연 60초\n\n- **경고**\n  1. 전류 II-2133을 같은 시간축에 놓고 본다. 전류가 먼저 올랐으면 과부하다(6.3절). 전류가 그대로면 냉각 불량 쪽이다(6.2절).\n  2. 주위 온도와 비교한다. 권선 온도와 주위 온도의 차이가 그대로면 주위 온도가 오른 것이다 [P27]. 차이가 커졌으면 냉각이나 부하 문제다.\n  3. 모터 보호 계전기에서 RTD 6개를 비교한다. 6개가 함께 오르면 모터 전체의 열 문제다. 필터가 막혀도 이웃 RTD들이 함께 높게 읽힌다 [P25]. 한 개만 튀거나 범위 밖이면 RTD 고장이다(MAN-VIB-01 4절). 몇 개만 늘 높으면 RTD 위치 편향일 수 있다 [M25].\n  4. 현장에서 흡입 필터, 팬 커버, 팬 소리, 팬 커버 출구 바람, 핀의 먼지를 본다.\n- **알람:** 정비 담당에게 알린다. 공정과 협의해 C-2102 부하를 줄일 수 있으면 줄인다. 권선 온도는 10 °C 오를 때마다 절연 수명이 반으로 준다 [M30].\n- **정지:** F종 절연의 최고 허용 온도다 [M29]. 보호 정지되면 절연 저항을 재고 원인을 없앤 뒤 재기동한다.\n\n### 5.2 모터 전류 II-2133\n\n**관리 기준** — 평소 46 A · 경고 ↑54 · 알람 ↑60 · 정지 ↑65 A · 울림 지연 0초 · 해제 폭 0.92 A · 해제 지연 15초\n\n- **경고**\n  1. 공정 운전원과 C-2102 운전 조건이 바뀌었는지 확인한다. 보충 수소 요구량, 스필백(재순환) 밸브 개도, 흡입·토출 압력을 본다.\n  2. 전기 담당과 모선 전압, 같은 모선의 다른 모터 전류가 함께 바뀌었는지 확인한다.\n  3. 3상 전류가 고른지 본다. 전압이 조금만 불평형이어도 전류 불평형은 그 6~10배가 된다 [M30].\n  4. 권선 온도가 아직 낮아도 안심하지 않는다. 권선 온도는 열 시상수만큼 늦게 따라온다(6.3절). 전류가 높게 이어지면 권선 온도가 경고에 닿기 전에 부하를 줄인다.\n- **알람:** 정격의 110%다. 서비스 계수 안에서도 온도 상승이 커진다 [P31]. 부하를 줄이고 정비 담당에게 알린다.\n- **정지:** 모터 보호 정지 값이다. 정지되면 피동기와 전원 쪽 원인을 찾은 뒤 재기동한다.\n- **수준은 그대로인데 값이 출렁일 때(통계 알람 표준편차):** 회전자 바 균열을 의심한다(6.4절).\n\n### 5.3 베어링 진동 VI-2131H(구동측), VI-2132H(반구동측)\n\n**관리 기준** — 평소 1.5 mm/s · 경고 ↑2.6 · 알람 ↑4.5 · 정지 ↑7.1 mm/s · 울림 지연 10초 · 해제 폭 0.03 mm/s · 해제 지연 15초\n\nVI-2132H도 기준이 같다.\n- **경고**\n  1. 구동측과 반구동측을 비교한다. 한쪽만 몇 주에 걸쳐 서서히 오르면 그 베어링 손상을 의심한다(6.1절).\n  2. 계단처럼 한 번에 뛰었으면 베어링보다 다른 원인을 먼저 본다. 반구동측만 뛰었으면 외부 팬 손상(6.2절), 양쪽이 함께 뛰었으면 커플링·정렬이나 피동기 쪽(6.6절)이다.\n  3. 진동 스펙트럼과 고주파 엔벨로프 측정을 요청한다 [M18].\n  4. 몇 초짜리 튐만 있고 다른 값이 그대로면 센서 쪽이다(MAN-VIB-01 4절).\n- **알람:** 구역 C에 들어선 값이다. 장기 운전에 맞지 않는다 [M3]. 정지 기회에 베어링을 바꾸도록 계획한다.\n- **정지:** 구역 D다. 손상 위험이 있다 [M3]. 정지되면 원인을 찾기 전까지 재기동하지 않는다.\n\n### 5.4 구동측 베어링 온도 TI-2131\n\n**관리 기준** — 평소 65 °C · 경고 ↑82 · 알람 ↑90 · 정지 ↑100 °C · 울림 지연 0초 · 해제 폭 0.65 °C · 해제 지연 60초\n\n- **경고**\n  1. 같은 베어링의 진동 VI-2131H를 본다. 진동이 먼저 몇 주에 걸쳐 올랐고 온도가 뒤따르면 베어링 손상이 많이 진행된 것이다(6.1절).\n  2. 권선 온도도 함께 올랐으면 프레임 전체가 뜨거운 것이다. 냉각 불량을 먼저 본다(6.2절).\n  3. 반구동측은 온도 태그가 없으니 현장에서 휴대용 온도계로 재어 비교한다.\n- **알람:** 정비 담당에게 알리고 그리스 상태와 보충 기록을 확인한다.\n- **정지:** 설비 보호 정지 값이다. 정지되면 베어링을 분해 점검한다.\n\n## 6. 고장별 증상·점검·조치\n\n원인은 대부분 데이터만으로 하나로 확정할 수 없다. 아래 「추정 원인」은 현장 확인으로 확정한다. 매뉴얼이 정한 조치는 그대로 따른다.\n\n| 절 | 고장 | 먼저 움직이는 태그와 모양 | 가르는 단서 |\n|---|---|---|---|\n| 6.1 | 구름 베어링 손상 | 한쪽 베어링 진동(VI-2131H 또는 VI-2132H) 서서히↑, 구동측이면 TI-2131 나중↑ | 한쪽 베어링 진동이 먼저 오르고, 전류·권선 온도는 그대로다 |\n| 6.2 | 냉각 불량 | 권선 온도 TI-2133↑, 전류 II-2133 그대로 | 전류가 오르지 않는다 |\n| 6.3 | 과부하 | 전류 II-2133 먼저↑ → 권선 온도 TI-2133 뒤따라↑ | 전류가 먼저 오른다 |\n| 6.4 | 회전자 바 균열 | 전류 II-2133 출렁임(1시간 요약 표준편차↑) | 전류만 맥동하고, 전류 평균과 온도는 거의 그대로다 |\n| 6.5 | 센서 고장 | 한 태그만 튐·고정 | 짝 태그와 어긋난다 |\n| 6.6 | 피동기(C-2102) 쪽 문제 | 압축기 쪽 값이 먼저 움직인다 | MAN-C-2102를 따른다 |\n\n### 6.1 구름 베어링 손상\n\n- **증상:** 구름 베어링 손상은 네 단계로 진행한다 [M18].\n  - 처음에는 초음파·고주파 가속도(엔벨로프) 성분만 오른다. 하우징 진동 속도(mm/s)에는 거의 안 보인다.\n  - 다음에 베어링 결함 주파수와 그 배수가 속도 스펙트럼에 나타나고, 하우징 진동이 며칠~몇 주에 걸쳐 서서히 오른다.\n  - 마지막 단계에서 넓은 대역의 잡음이 생기고 베어링 온도가 오른다. 온도가 오르면 이미 늦은 단계다.\n- **추정 원인 → 확인 방법**\n  1. 윤활 부족·그리스 열화: 그리스 보충 기록과 보충 주기를 본다.\n  2. 오염(먼지·수분 유입): 베어링 씰과 그리스 상태를 본다.\n  3. 정렬 불량·과한 축 하중: 정렬 기록을 보고, 커플링 양쪽 진동이 함께 올랐는지 본다.\n  4. 설치 불량: 최근 정비 이력을 본다.\n  - 엔벨로프 스펙트럼에서 결함 주파수(외륜·내륜·볼·케이지)를 보면 손상 위치를 좁힐 수 있다.\n- **조치**\n  - 경고를 넘으면 월 측정을 주 측정으로 바꾸고 정지 기회를 잡는다.\n  - 알람(구역 C)을 넘으면 정지 계획을 세워 베어링을 바꾼다. 바꾼 베어링을 잘라 손상 모양을 확인한다.\n  - 교체 뒤 정렬을 확인하고, 기동 전후 진동을 비교한다.\n- **가르는 단서**\n  - 진동이 계단처럼 한 번에 뛰면 베어링이 아니다. 외부 팬 손상(6.2절)이나 커플링·정렬(6.6절)을 본다.\n  - 전원을 끊는 순간 진동이 바로 사라지면 전기 쪽 원인(에어갭 편심·소프트 풋, 전원 주파수의 2배 성분)이다 [M32].\n\n### 6.2 냉각 불량\n\n- **증상:** 전류는 그대로인데 권선 온도가 오른다. 프레임 온도도 오른다 [M36][M37]. RTD 6개가 함께 오른다 [P25].\n- **원인별 모양**\n\n| 추정 원인 | 권선 온도의 모양 | 함께 보이는 것 | 근거 |\n|---|---|---|---|\n| 흡입 필터 막힘, 프레임 핀 먼지 | 며칠~몇 주에 걸쳐 서서히 오른다 | 진동은 그대로다. 필터 표면이 덮여 있고 팬 커버 출구 바람이 약하다 | [M37][P25] |\n| 외부 팬·팬 커버 파손 | 냉각 공기가 한 번에 줄어, 몇 시간에 걸쳐 새 값까지 오르고 멈춘다 | 팬 날개가 떨어져 나가면 반구동측 진동이 같은 시각 계단처럼 변한다(추론). 팬 쪽 이상음 | [M37], 열 시상수 [P28][P30] |\n| 주위 온도 상승(고장 아님) | 주위 온도를 1:1로 따라 오른다 | 권선 온도와 주위 온도의 차이가 그대로다 | [P27] |\n\n- **점검 순서**\n  1. 전류가 그대로인지 본다. 올랐으면 6.3절이다.\n  2. 권선 온도와 주위 온도의 차이가 커졌는지 하루 평균으로 본다.\n  3. 반구동측 진동 VI-2132H가 같은 시각에 계단처럼 변했는지 본다.\n  4. 현장에서 흡입 필터, 팬 커버 출구 바람, 팬 소리, 프레임 핀을 본다.\n  5. 모터 보호 계전기에서 RTD 6개가 함께 올랐는지 본다.\n- **조치**\n  - 필터·핀 막힘: 필터를 청소하거나 바꾼다. 필터는 운전 중에 한 장씩 바꿀 수 있게 예비품을 둔다.\n  - 팬·팬 커버 파손: 날개 조각이 더 떨어질 수 있으니 정지 기회를 빨리 잡아 팬을 바꾼다.\n  - 냉각을 고치면 권선 온도가 크게 내려간다. 모터 냉각기를 단 사례에서 93 °C가 74 °C가 됐다. 그 모터에 필요했던 감소 폭은 11~22 K였다 [P26].\n\n### 6.3 과부하\n\n- **증상:** 3상 전류가 고르게 오르고, 권선 전체가 고르게 열을 받는다 [M36].\n  - 전류가 먼저 오르고 권선 온도는 열 시상수만큼 늦게 따라온다.\n  - 권선 온도 상승분은 전류의 제곱에 비례한다 [P28]. 전류가 10% 오르면 평소 온도 상승분이 약 21% 커진다.\n  - 시상수는 모터마다 다르다. 400 hp 모터의 가열 시상수가 1,370초(약 23분)인 예가 있고 [P28], 운전 중 냉각 시상수가 150분인 예가 있다 [P29]. 시상수의 3배가 지나면 변화의 95%에 닿는다 [P30]. 그래서 전류가 한 번 오르면 권선 온도는 1~몇 시간에 걸쳐 따라 오르고 멈춘다.\n- **추정 원인 → 확인 방법**\n  1. **피동기 부하 증가:** 공정 조건 때문에 압축기 부하가 늘었다. 보충 수소 요구량, 스필백 밸브 개도, 흡입·토출 압력의 변화를 DCS 기록으로 본다. 공정 조작을 따라 몇 분~몇 십 분에 걸쳐 오른다.\n  2. **공급 전압 저하:** 같은 출력을 내려면 전압이 낮은 만큼 전류가 더 흐른다(원리에서 나온 추론). 모선 전압과 같은 모선의 다른 모터 전류를 본다. 전원 전환·변압기 탭 변경 순간에 계단처럼 오르고, 여러 모터가 함께 오른다.\n  3. **전압 불평형:** 3상 전류가 고르지 않다. 전류 불평형은 전압 불평형의 6~10배다. 온도 상승 80 °C 모터에서 2% 불평형이면 6.4 °C가 더 오른다 [M30].\n  4. **피동기 기계 문제:** 압축기 메인 베어링 손상 등으로 마찰이 늘었다. C-2102 메인 베어링 온도 TI-2121과 프레임 진동 VI-2121H가 먼저 움직인다(MAN-C-2102 6.4절).\n- **조치**\n  - 원인을 찾는 동안 공정과 협의해 압축기 부하를 줄인다. 전류를 정격 아래로 내리면 권선 온도도 시상수만큼 늦게 따라 내려간다.\n  - 전압 문제는 전기 담당이 모선 전압·탭을 바로잡는다.\n  - 알람(110%)을 넘은 채로 계속 돌리지 않는다.\n\n### 6.4 회전자 바 균열\n\n- **증상**\n  - 전류의 진폭이 「극수 × 슬립 주파수」로 맥동한다. 1X 진동 양옆에 측파대가 생기고, 「그르렁」 하는 맥동음이 난다. 길게 보면 서서히 나빠진다 [M31][M32][M35].\n  - 전류 스펙트럼에서 전원 주파수 양옆의 (1±2s)f 측파대가 커진다. 측파대가 기본파보다 45 dB 이내로 올라오면 바 파단 표시다 [M31].\n  - 1초 값에서는 전류가 흩어지듯 출렁인다. 그래서 전류의 1시간 요약 표준편차가 커져 통계 알람(표준편차)이 울린다. 전류 평균과 권선 온도는 거의 그대로다(MAN-VIB-01 3.2절).\n- **추정 원인 → 확인 방법**\n  1. 잦은 직입 기동, 관성이 큰 부하: 기동 횟수 기록을 본다 [설비조사 4.4].\n  2. 바·단락환 접합부의 제작 결함: 같은 형식 회전자의 이력을 본다 [M32].\n- **가르는 단서:** 왕복동 압축기는 한 회전 안에서 부하 토크가 크게 바뀌어, 전류에도 회전수 주기의 출렁임이 원래 있다(추론). 그래서 출렁임이 정상 구간보다 커졌는지로 보고, 전류 스펙트럼에서 측파대 간격이 슬립 주파수의 2배인지(바 균열) 회전수의 배수인지(부하 출렁임) 확인한다.\n- **조치**\n  - 측파대 크기를 매달 재어 추이를 본다. 기동 횟수를 줄인다.\n  - 계획 정지 때 회전자를 빼서 바와 단락환 접합부를 점검하고, 수리하거나 바꾼다.\n\n### 6.5 센서 고장\n\n한 태그만 튀거나 값이 고정되고 짝 태그는 그대로면 센서 고장이다. 권선 RTD는 단선되면 범위 밖 값을 낸다. MAN-VIB-01 4절을 따른다.\n\n### 6.6 피동기(C-2102) 쪽 문제\n\n- 압축기 쪽 고장도 모터 값을 바꾼다. 압축기 메인 베어링 손상이나 밸브 고장은 모터 전류와 진동에 나타날 수 있다.\n- 커플링 양쪽 진동이 함께 오르고 1X·2X·축방향 성분이 크면 정렬 불량이다 [설비조사 4.4].\n- 압축기 쪽 값(메인 베어링 온도, 프레임 진동, 단 토출 온도·압력)이 먼저 움직였으면 MAN-C-2102를 따른다. 압축기 부하가 늘었는지는 단 토출 압력과 함께 본다(MAN-C-2102 5.6절).\n\n## 7. 관련 문서\n\n- 매뉴얼: MAN-C-2102(피동기 보충 수소 압축기), MAN-VIB-01(진동·센서 감시 공통 지침)\n- 과거 고장 사례: 사례 색인에서 설비 M-2103으로 찾는다.\n\n## 근거\n\n| 번호 | 출처 |\n|---|---|\n| S8 | Williams·Richaume, PTQ 2016(수소 플랜트 왕복동 압축기, 500 kW·750 rpm 유도 전동기 직결 예) |\n| 설비조사 4.4 | `docs/설비조사_6유형.md` 4.4절 고장 시나리오 표(회전자 바 균열 원인, 정렬 불량) |\n| M3 | Fabrico, ISO 20816 진동 구역(Group 1 구역값, 경고 = 평소 + 구역 B 상한의 25%) |\n| M18 | Acoem, 베어링 고장 4단계 |\n| M20, M28, T9 | SKF(82 °C 규칙), TECO-Westinghouse RTD 설정 권장(베어링 알람 90 °C), SKF 팬 고장 진단 가이드(100 °C) |\n| M24 | Finley & Hodowanec, IEEE TIA 2002(출력별 베어링 선택) |\n| M25 | EASA, Getting the most from winding RTDs(RTD 6개, 위치 편향) |\n| M27, M29 | GE Multilin 469 매뉴얼(권선 RTD 트립), Fabrico 절연 등급(B 130 °C, F 155 °C, F종 절연 + B종 상승) |\n| M30 | US DOE Motor Systems Tip Sheet #7(전압 불평형 1%, 전류 6~10배, 10 °C당 수명 절반) |\n| M31, M32, M35 | Culbert & Letal, PCIC 2015(전류 측파대, 45 dB), Doyle, IRMC 2023(회전자 바, 편심, 소프트 풋), Reliable Plant(회전자 결함 사례) |\n| M34 | Reliamag, 모터 고장 통계 |\n| M36, M37 | EASA, 고정자 권선 근본 원인 분석(열 스트레스, 과부하), Fabrico, 모터 과열 원인(핀 막힘) |\n| P25, P26, P27 | EASA(필터 막힘 징후), Oil & Gas Journal(모터 냉각기, 93 → 74 °C, 11~22 K), Maintworld(주위 온도 1:1, 안정까지 8시간) |\n| P28, P29, P30, P31 | SEL 모터 열 모델(전류 제곱 비례, 시상수 1,370초), GE 469 매뉴얼(냉각 시상수 150분), SEL 6338(3τ = 95%), Engineering ToolBox(서비스 계수) |\n\nS 번호는 `docs/설비조사_6유형.md` 0절 출처, M 번호는 3·4절 출처, T 번호는 5·6절 출처, P 번호는 8절 출처다.\n","MAN-P-2104":"# P-2104 수첨분해 반응기 공급 펌프 운전·정비 매뉴얼\n\n> 문서 ID MAN-P-2104 · 개정 2 · 2026-09-15 · 가상 정유 1공장 회전기계팀\n> 교육·시연용 가상 문서다. 숫자의 근거는 끝의 「근거」에 있다. 실제 설비의 설정값은 제조사 기준을 따른다.\n\n## 1. 목적·적용 범위\n\n- 이 매뉴얼은 P-2104를 정상 상태로 운전하고, 관리 항목이 기준을 벗어났을 때 운전원과 정비원이 같은 순서로 대응하도록 정한다.\n- 적용 범위는 P-2104 본체다. 구동측 저널 베어링, 흡입부(흡입 스트레이너 포함), 토출부(최소 유량 재순환 배관 포함)를 다룬다.\n- 구동 모터와 메커니컬 씰에는 DB 감시 태그가 없다. 이 둘은 현장 점검(4절)으로만 다룬다.\n- 함께 보는 문서\n  - 진동 판정 기준, 통계 알람의 뜻, 센서 고장 판별, 알람 해제 규칙: MAN-VIB-01\n\n## 2. 설비 개요\n\n| 항목 | 내용 |\n|---|---|\n| 설비 ID | P-2104 |\n| 설비명 | 수첨분해 반응기 공급 펌프 |\n| 유형 | 펌프 |\n| 설비 등급 | 2 (1 = 가장 중요) |\n| 유닛 | UNIT-21 수첨분해 |\n| 구동기 | — |\n| 파트 | 반응기 공급 펌프 구동측 저널 베어링, 반응기 공급 펌프 흡입부, 반응기 공급 펌프 토출부 |\n\n- P-2104는 수첨분해 반응기로 원료유를 고압으로 보내는 원심 펌프(차지 펌프)다. 수첨분해 차지 펌프는 흔히 고압 다단 배럴형이고 전동기로 돌린다 [설비조사 0.1]. 구동 모터는 이 매뉴얼의 감시 범위 밖이다.\n- 설비 마스터에는 한 대만 있다. 이 매뉴얼은 예비기가 없는 것으로 본다. 멈추면 반응기로 가는 원료가 끊겨 유닛 운전에 영향을 준다.\n- 축은 유막(저널) 베어링이 받친다고 가정했다. 고압·고출력 펌프는 유막 베어링과 강제 윤활을 쓰고, 「정격 마력 × 회전수가 2.0백만을 넘으면 강제 윤활」이라는 기준이 있다 [M6]. 윤활유는 펌프 전용 윤활 장치에서 받는다(가정). 압축기·터빈 공용 콘솔(MAN-LUBE-01)과는 따로다.\n- 감시 센서\n  - 구동측(DE, 커플링 쪽) 베어링에 축 진동 근접 프로브 X·Y 두 개(VI-2141X/Y, 90° 간격)와 베어링 메탈 온도 RTD 하나(TI-2141)가 있다.\n  - 유막 베어링은 기름막이 진동을 걸러, 하우징 센서로는 축의 움직임이 잘 보이지 않는다. 그래서 축 진동을 근접 프로브로 잰다 [M5]. 센서를 한 베어링에만 단다면 커플링에 가장 가까운 베어링에 단다 [M5]. 반구동측 베어링은 현장 점검으로 본다.\n  - 공정 쪽은 흡입 압력 PI-2143, 토출 압력 PI-2144, 토출 유량 FI-2144다.\n    - PI-2143은 흡입 스트레이너 뒤(펌프 쪽)에서 잰다. 스트레이너가 막히면 그 차압만큼 내려간다.\n    - FI-2144는 최소 유량 재순환 분기 앞에서 잰다. 펌프를 지나는 전체 유량이고, 최소 유량 제어가 이 값을 본다.\n- 공정 쪽 구성(DB 밖)\n\n| 구성 | 하는 일 | 상태를 보는 방법 |\n|---|---|---|\n| 흡입 드럼 | 원료를 받아 두고 펌프에 흡입 압력을 준다. 드럼 압력은 블랭킷 가스로 맞춘다 | 공정 DCS의 드럼 압력·레벨 |\n| 흡입 스트레이너 2기(1기 예비) | 원료 속 이물을 거른다. 운전 중 바꿀 수 있다 | 현장 차압계 |\n| 반응기 공급 유량 조절 밸브 | 반응기로 가는 유량을 설정값에 맞춘다 | 공정 DCS의 설정값·밸브 개도 |\n| 최소 유량 재순환 밸브 | 유량이 최소 유량 설정 아래로 내려가면 열려 일부를 흡입 드럼으로 되돌린다 | 공정 DCS의 밸브 개도, 현장 |\n| 윤활 장치 | 베어링에 기름을 보낸다(탱크, 펌프, 쿨러, 필터) | 현장 레벨·공급 압력·필터 차압·쿨러 출구 온도 |\n| 메커니컬 씰과 씰 보조 계통 | 축이 케이싱을 지나는 곳에서 누설을 막는다 | 현장 리저버 레벨·압력 [M13] |\n\n- 반응기로 가는 유량은 유량 조절 밸브가 지킨다. 그래서 흡입 막힘이나 임펠러 마모가 생겨도, 밸브가 더 열려 메우는 동안에는 유량이 그대로 보인다. 밸브가 다 열린 뒤에야 유량이 떨어진다 [P35].\n\n## 3. 관리 항목표\n\n| 태그 | 측정 | 단위 | 평소 값 | 경고 | 알람 | 정지 | 울림 지연 | 해제 폭 · 해제 지연 | 통계 알람 |\n|---|---|---|---|---|---|---|---|---|---|\n| VI-2141X | 반응기 공급 펌프 구동측 베어링 축 진동 X | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2141Y | 반응기 공급 펌프 구동측 베어링 축 진동 Y | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| TI-2141 | 반응기 공급 펌프 구동측 베어링 메탈 온도 | °C | 80 | ↑90 | ↑95 | ↑115 | 0초 | 0.8 · 60초 | 평균↑ |\n| PI-2143 | 반응기 공급 펌프 흡입 압력 | kg/cm² | 5 | ↓4.5 | ↓4 |  | 0초 | 0.1 · 15초 | 평균↓ |\n| PI-2144 | 반응기 공급 펌프 토출 압력 | kg/cm² | 180 | ↓171 | ↑198 / ↓162 |  | 0초 | 3.6 · 15초 | 평균↓, 표준편차↑ |\n| FI-2144 | 반응기 공급 펌프 토출 유량 | m³/h | 300 | ↓210 | ↓150 |  | 0초 | 15 · 15초 | 평균↓, 표준편차↑ |\n\n↑ 넘으면 이상, ↓ 내려가면 이상. 통계 알람은 정상 구간의 1시간 요약과 비교해 그 통계가 벗어날 때 울리는 경고(LOW)다(MAN-VIB-01 3절).\n\n- 경고·알람·정지는 설비 태그의 「경고 상·하한(초기 경고)」, 「알람 상·하한(운전 알람)」, 「정지 상·하한(설비 보호 정지)」이다.\n- 공정값의 경고·알람은 팀이 정한 값이다.\n  - 흡입 압력: 평소 값의 −10%(경고)·−20%(알람). 흡입 쪽 여유(NPSH 여유)를 남기려는 값이다.\n  - 토출 압력: 평소 값의 −5%(경고)와 ±10%(알람).\n  - 토출 유량: 평소 값의 70%(경고)·50%(알람). 최소 연속 유량에 다가가는 것을 알리려는 값이다.\n- 축 진동 알람(50 µm)은 API 610 공장 시험에서 유막 베어링 펌프의 축 진동 허용치(50 µm p-p)와 같은 크기다 [M1]. 다만 API 610 값은 공장 성능 시험 기준이지 현장 알람값이 아니다.\n- 울림 지연: 그 시간보다 짧게 넘었다가 돌아오면 알람이 울리지 않는다. 진동은 10초다. 진동 알람·정지는 값이 약 10초 넘게 넘을 때 내라는 권고가 근거다 [M1].\n- 해제 폭·해제 지연: 울린 알람은 값이 한계값에서 해제 폭만큼 안쪽으로 돌아와 해제 지연만큼 이어져야 해제된다. 근거는 MAN-VIB-01 5절이다.\n\n## 4. 정상 운전 점검\n\n### 4.1 매 교대\n\n| 항목 | 보는 것 | 정상 |\n|---|---|---|\n| 베어링 메탈 온도 TI-2141 | 값과 12시간 추이 | 평소 값 부근이다. 진동과 함께 오르는 추이가 없다 |\n| 축 진동 VI-2141X/Y | 두 값과 추이 | X·Y가 비슷한 크기로 함께 움직인다. 순간 튐이 없다 |\n| 흡입 압력 PI-2143 | 값과 며칠 추이 | 평소 값 부근이다. 며칠에 걸쳐 조금씩 내려가는 추이가 없다 |\n| 토출 압력 PI-2144, 토출 유량 FI-2144 | 값, 유량 설정값, 유량 조절 밸브 개도 | 유량이 설정값과 맞고 압력이 출렁이지 않는다. 같은 유량에서 밸브 개도가 평소 범위다 |\n| 최소 유량 재순환 밸브 | 개도와 제어 모드 | 정상 유량에서는 닫혀 있고, 제어기는 자동이다 |\n| 현장 | 흡입 스트레이너 차압, 소음, 씰 누설과 씰 리저버 레벨·압력, 윤활 장치 레벨·공급 압력·필터 차압 | 이상이 없다. 스트레이너 차압은 깨끗할 때 값 부근이다 |\n\n- 메커니컬 씰은 펌프 고장에서 가장 자주 나오는 부위다. 펌프 고장 3,500건 중 60.4%에 씰이 나온다 [M14]. DB 태그가 없으니 현장 점검을 빠뜨리지 않는다.\n- 씰 리저버의 레벨·압력이 움직이는 방향으로 어느 씰이 새는지 가른다 [M13].\n\n### 4.2 정기 점검\n\n| 주기 | 항목 | 이유 |\n|---|---|---|\n| 매 교대(현장 순회) | 흡입 스트레이너 차압 기록 | 깨끗할 때 2~3 psi(약 0.14~0.21 kg/cm²)이고, 5 psi(약 0.35 kg/cm²)에서 경보한다. 차압만큼 흡입 쪽 여유(NPSHa)가 깎인다 [P32]. 새것보다 5~6 psi 오르면 청소한다 [P33]. 20 psi(약 1.4 kg/cm²)를 넘기지 않는다 [P34] |\n| 월 1회 | 윤활유 시료 분석: 수분, 점도, 입자 수, 마모 금속(배빗 성분) | 베어링 온도와 진동이 함께 오를 때(6.4절) 원인을 가르는 첫 자료다 |\n| 월 1회 | 성능 추이: 같은 유량에서 토출 압력, 유량 조절 밸브 개도, 모터 전류(현장) | 임펠러·웨어링 마모는 같은 유량에서 토출 압력이 서서히 내려가는 것으로 드러난다. 효율이 떨어져 같은 유량에 드는 전력이 는다 [M16] |\n| 분기 1회 | 최소 유량 재순환 밸브 작동 시험 | 정상 처리량에서는 거의 열리지 않는 밸브다. 필요할 때 실제로 열리는지 확인한다 |\n| 정비 뒤 기동 | 기동 전후 진동·베어링 온도 비교, 흡입·토출 밸브 라인업 확인 | 정렬 불량은 1X·2X 진동이 커지는 것으로 드러난다 [M4]. 흡입 밸브를 덜 연 채 기동하면 캐비테이션이 난다(6.1절) |\n\n## 5. 이상 시 조치\n\n모든 알람에서 먼저 할 일은 같다.\n1. 짝 태그(VI-2141X/Y)와 같은 설비의 다른 태그가 함께 움직였는지 본다. 한 태그만 튀면 센서 고장부터 의심한다(MAN-VIB-01 4절).\n2. 흡입 압력, 유량, 베어링 온도 중 무엇이 먼저 움직였는지 본다. 이 펌프는 먼저 움직인 값이 원인을 가른다(6절 표).\n3. 값이 언제부터 어떤 모양(서서히, 계단, 출렁임, 튐)으로 바뀌었는지 1시간 요약으로 본다.\n4. 아래 항목별 조치를 하고, 원인은 6절 표에서 좁힌다.\n\n### 5.1 베어링 메탈 온도 TI-2141\n\n**관리 기준** — 평소 80 °C · 경고 ↑90 · 알람 ↑95 · 정지 ↑115 °C · 울림 지연 0초 · 해제 폭 0.8 °C · 해제 지연 60초\n\n- **경고**\n  1. 같은 베어링의 축 진동 VI-2141X/Y가 함께 올랐는지 본다. 함께 올랐으면 베어링 이상이다(6.4절).\n  2. 온도만 오르고 진동은 그대로면 현장 윤활 장치(공급 압력, 쿨러 출구 온도, 필터 차압)를 먼저 본다.\n  3. 다른 값과 상관없이 온도 한 값만 몇 초 만에 크게 튀면 센서 고장을 의심한다(MAN-VIB-01 4절).\n  4. 윤활유 시료를 급히 분석한다(수분, 입자 수, 배빗 성분).\n- **알람:** 정비 담당에게 알리고 6.4절 점검을 시작한다. 예비기가 없으므로 공정 부서와 정지 계획을 미리 협의한다.\n- **정지:** 설비 보호 정지 값이다. 정지되면 재기동 전에 베어링을 분해 점검한다.\n\n### 5.2 축 진동 VI-2141X/Y\n\n**관리 기준** — 평소 25 µm · 경고 ↑38 · 알람 ↑50 · 정지 ↑65 µm · 울림 지연 10초 · 해제 폭 0.5 µm · 해제 지연 15초\n\nVI-2141Y도 기준이 같다.\n- **경고**\n  1. X·Y가 함께 올랐는지 본다. 한 프로브만 튀면 센서 고장 판별을 먼저 한다(MAN-VIB-01 4절).\n  2. 함께 올랐으면 같은 시간의 유량 FI-2144, 흡입 압력 PI-2143, 베어링 온도 TI-2141을 본다.\n     - 유량이 먼저 줄었으면 저유량 운전이다(6.2절).\n     - 흡입 압력이 먼저 내려갔으면 캐비테이션이다(6.1절).\n     - 베어링 온도가 함께 오르면 베어링 이상이다(6.4절).\n     - 셋 다 그대로면 불균형·정렬 불량 같은 기계 원인을 의심하고 진동 분석을 한다 [M4].\n- **알람:** 진동 분석(주파수 성분 1X, 2X, 회전수보다 낮은 성분)을 요청한다 [M4].\n- **정지:** 설비 보호 정지 값이다. 정지되면 원인을 찾기 전까지 재기동하지 않는다.\n\n### 5.3 흡입 압력 PI-2143\n\n**관리 기준** — 평소 5 kg/cm² · 경고 ↓4.5 · 알람 ↓4 kg/cm² · 울림 지연 0초 · 해제 폭 0.1 kg/cm² · 해제 지연 15초\n\n- **경고**\n  1. 얼마나 빨리 내려갔는지 본다. 몇 분~몇 시간 만이면 흡입 드럼 쪽(압력·레벨), 며칠에 걸쳐 서서히면 흡입 스트레이너 막힘을 먼저 의심한다(6.1절).\n  2. 공정 DCS에서 흡입 드럼 압력과 레벨을 본다. 함께 내려갔으면 드럼 쪽이다.\n  3. 현장 스트레이너 차압계를 본다. 경보(5 psi)를 넘었으면 예비 스트레이너로 바꾸고 막힌 쪽을 청소한다 [P32].\n  4. 정비 뒤 기동 직후라면 흡입 밸브가 다 열렸는지 본다.\n- **알람:** 캐비테이션이 날 수 있는 값이다. 토출 압력·유량이 출렁이는지, 현장에서 소음이 나는지 확인한다 [M10]. 흡입 쪽 원인(스트레이너 전환, 드럼 압력·레벨 회복)을 바로 없앤다.\n\n### 5.4 토출 유량 FI-2144, 토출 압력 PI-2144\n\n**관리 기준** — 평소 300 m³/h · 경고 ↓210 · 알람 ↓150 m³/h · 울림 지연 0초 · 해제 폭 15 m³/h · 해제 지연 15초\n\n**관리 기준** — 평소 180 kg/cm² · 경고 ↓171 · 알람 ↑198 / ↓162 kg/cm² · 울림 지연 0초 · 해제 폭 3.6 kg/cm² · 해제 지연 15초\n\n- **유량이 내려갈 때**\n  1. 처리량 설정을 바꾸는 중이었는지 공정 운전원과 확인한다.\n  2. 최소 유량 재순환 밸브 개도를 본다. 유량이 최소 유량 설정 아래인데 밸브가 닫혀 있으면 수동으로 연다(확정 조치). 저유량으로 오래 돌리지 않는다(6.2절).\n  3. 처리량 설정은 그대로인데 유량만 줄었으면 하류 밸브 라인업과 하류 막힘을 확인한다.\n  4. 진동·토출 압력은 그대로이고 유량 값만 떨어졌으면 유량계 고장을 의심한다(MAN-VIB-01 4절).\n  - 유량 알람은 처리량을 줄이는 중이라도 「최소 연속 유량에 다가감」으로 본다. 당연한 알람으로 넘기지 않는다.\n- **토출 압력이 내려갈 때**\n  - 유량이 그대로인데 오랜 기간에 걸쳐 서서히 내려가면 임펠러·웨어링 마모를 의심한다(6.3절). 현장 압력계와 비교해 전송기 고장을 먼저 뺀다.\n  - 압력과 유량이 함께 출렁이면 흡입 압력을 본다. 흡입 압력이 먼저 내려갔으면 캐비테이션이다(6.1절).\n- **토출 압력이 오를 때:** 유량이 함께 줄었는지 본다. 하류에서 유량이 막히면 펌프는 성능 곡선을 따라 유량이 줄고 압력이 오른다 [M17]. 하류 밸브 라인업을 확인한다(6.2절).\n- **토출 압력이 출렁일 때:** 흡입 압력이 먼저 내려갔으면 캐비테이션(6.1절), 유량이 먼저 줄었으면 저유량 운전(6.2절)이다.\n\n## 6. 고장별 증상·점검·조치\n\n원인은 대부분 데이터만으로 하나로 확정할 수 없다. 아래 「추정 원인」은 현장 확인으로 확정한다. 매뉴얼이 정한 조치는 그대로 따른다.\n\n| 절 | 고장 | 먼저 움직이는 태그와 모양 | 가르는 단서 |\n|---|---|---|---|\n| 6.1 | 캐비테이션 | 흡입 압력 PI-2143 먼저↓ → 토출 압력 PI-2144·유량 FI-2144 출렁임 | 흡입 압력이 먼저 내려간다 |\n| 6.2 | 저유량 운전 | 유량 FI-2144 먼저↓ → 축 진동 VI-2141X/Y↑·출렁임 | 유량이 먼저 줄고 흡입 압력은 그대로다 |\n| 6.3 | 임펠러 마모 | 토출 압력 PI-2144 서서히↓, 유량 그대로 | 유량은 그대로인데 토출 압력만 내려간다 |\n| 6.4 | 베어링 이상 | 베어링 온도 TI-2141↑과 축 진동 VI-2141X/Y↑ 함께 | 온도가 같이 오른다 |\n| 6.5 | 센서 고장 | 한 태그만 튐·고정 | 짝 태그와 어긋난다 |\n\n### 6.1 캐비테이션\n\n- **증상**\n  - 흡입 압력이 모자라면 임펠러 입구에서 기포가 생겼다 터진다. 양정이 3% 떨어지는 점(NPSH3)보다 앞서 시작된다 [M12].\n  - 흡입 압력 PI-2143이 먼저 내려가고, 충분히 낮아지면 토출 압력 PI-2144와 유량 FI-2144가 출렁이며 소음이 난다 [M10]. 진동은 고주파 광대역 성분이 커진다 [M11].\n  - 유량 평균은 유량 조절 밸브가 지키므로 한동안 그대로다 [P35]. 출렁임은 1시간 요약의 표준편차로 드러난다.\n  - 오래 이어지면 임펠러 입구가 침식된다 [M10].\n- **추정 원인 → 확인 방법**\n\n| 추정 원인 | 흡입 압력이 내려가는 모양 | 확인 방법 |\n|---|---|---|\n| 흡입 스트레이너 막힘 | 며칠에 걸쳐 서서히. 막히는 속도는 이물 양에 달려 정해진 값이 없다 | 현장 차압계가 오른다. 깨끗할 때 2~3 psi, 경보 5 psi [P32]. 흡입 드럼 압력·레벨은 그대로다 |\n| 흡입 드럼 압력·레벨 저하 | 몇 분~몇 시간 | 공정 DCS의 드럼 압력이나 레벨이 같이 내려간다. 스트레이너 차압은 그대로다 |\n| 흡입 밸브 덜 열림 | 정비 뒤 기동 때부터 낮다 | 현장 밸브 개도 |\n| 액체 온도 상승 | 흡입 압력은 그대로인데 증상이 난다 | 원료 온도(공정 DCS). 증기압이 올라 여유가 줄어든다 [M10] |\n\n- **점검 순서:** ① PI-2143이 언제부터 어떤 속도로 내려갔나 ② 흡입 드럼 압력·레벨 ③ 현장 스트레이너 차압 ④ 유량 조절 밸브 개도 ⑤ 현장 소음.\n- **조치**\n  - 스트레이너 막힘: 예비 스트레이너로 바꾸고 막힌 쪽을 청소한다. 새것보다 5~6 psi 오르면 청소하고 [P33], 20 psi를 넘기지 않는다 [P34].\n  - 드럼 쪽: 드럼 압력·레벨을 정상으로 되돌린다. 조절 밸브가 고장이면 수동으로 돌린다.\n  - 캐비테이션이 오래 이어졌으면 다음 정비 때 임펠러 입구 침식을 확인한다.\n\n### 6.2 저유량 운전\n\n- **증상**\n  - 유량이 최고 효율점(BEP)에서 멀어질수록 임펠러 안에서 와류와 재순환이 생기고 축에 걸리는 힘이 커진다 [M4]. 재순환은 BEP 유량의 80~60%에서 시작해 40~20%에서 심해진다 [P37].\n  - 유량 FI-2144가 먼저 줄고, 축 진동 VI-2141X/Y가 오르며 출렁인다. 회전수보다 낮은 주파수 성분이 커진다 [M4]. 토출 압력도 출렁인다. 흡입 압력은 그대로다.\n  - 시험 사례: 5단 펌프에서 BEP의 37% 유량일 때 진동이 69% 커졌고, 토출 압력 출렁임이 ±2.1%에서 ±2.8%로 커졌다. 그 펌프의 최소 연속 안정 유량은 BEP의 53%로 정했다 [P36].\n  - API 610의 허용 운전 영역 하한은 BEP 70% 유량에서 잰 진동보다 30% 커지는 유량이다(2차 자료) [P36].\n  - 하류에서 막혀 유량이 줄면 펌프는 성능 곡선을 따라 토출 압력이 오른다. 방사형 펌프는 유량이 줄면 동력이 줄어 모터 전류가 내려간다 [M17].\n- **추정 원인 → 확인 방법**\n  1. **처리량을 줄였는데 최소 유량 재순환 밸브가 열리지 않음:** 직전에 처리량 설정을 내렸고 유량이 설정값을 따라 내려갔다. 유량이 최소 유량 설정 아래인데 재순환 밸브 개도가 0이다. 제어기 모드와 밸브 고착을 본다.\n  2. **하류 밸브 오조작·하류 막힘:** 처리량 설정은 그대로인데 유량이 줄었다. 하류 밸브 라인업과 그 시각의 작업 기록을 본다.\n  3. **유량계 고장:** 유량 값만 떨어지고 진동·토출 압력은 그대로다.\n- 토출 압력 상승은 하류에서 유량을 줄이면 어느 원인이든 나타날 수 있다. 원인을 가르는 단서는 직전 조작, 유량 설정값, 재순환 밸브 개도다.\n- **조치**\n  - 유량을 최소 연속 유량 위로 되돌린다. 재순환 밸브를 수동으로 열거나 하류 라인업을 바로잡는다(확정 조치).\n  - 재순환 밸브가 열리지 않았으면 고친 뒤 작동 시험을 한다.\n\n### 6.3 임펠러 마모\n\n- **증상:** 임펠러와 웨어링이 닳아 틈새가 커지면 토출된 액체 일부가 흡입 쪽으로 되돌아간다(내부 재순환). 같은 유량에서 토출 압력(양정)이 서서히 내려가고 효율이 떨어진다 [M16]. 마모 흔적은 웨어링과 베어링 쉘에 남는다 [M4].\n  - 유량 조절 밸브가 더 열려 유량을 지키므로 FI-2144는 그대로이고 PI-2144만 내려간다.\n  - 진동, 베어링 온도, 흡입 압력은 그대로다.\n- **추정 원인 → 확인 방법**\n  1. 같은 유량에서 토출 압력, 유량 조절 밸브 개도, 모터 전류의 추이를 본다. 압력이 내려가는데 밸브 개도와 전류가 오르면 마모 쪽이다.\n  2. 흡입 압력이 그대로인지 본다. 같이 내려가면 6.1절이다.\n  3. 현장 압력계와 비교해 압력 전송기 고장을 뺀다.\n  4. 정비 기회에 웨어링 간극을 잰다.\n- **조치:** 계획 정지 때 웨어링을 바꾸고 임펠러를 점검·교체한다. 토출 압력이 경고 값에 다가가면 정비 계획에 넣는다.\n\n### 6.4 베어링 이상\n\n- **증상:** 기름막이 얇아지거나 배빗이 손상되면 베어링 메탈 온도 TI-2141과 같은 베어링의 축 진동 VI-2141X/Y가 함께 오른다 [M6][M18].\n  - 진동과 온도 중 무엇이 먼저 오르는지는 고장마다 달라 정해진 순서가 없다 [M19].\n  - 기름막 불안정(오일 휠)이면 회전수의 약 0.42~0.48배 성분이 생긴다 [원심 27]. 펌프에서도 진동 분석으로 오일 휠을 찾은 사례가 있다 [M35].\n- **추정 원인 → 확인 방법**\n  1. 윤활유 오염(이물·수분): 시료의 입자 수, 수분, 배빗 성분(주석 등)을 본다.\n  2. 윤활 장치 문제(공급 압력 저하, 쿨러 성능 저하): 현장 공급 압력과 쿨러 출구 온도를 본다.\n  3. 베어링 마모·간극 증가, 기름막 불안정: 진동 주파수 성분과 정비 이력을 본다.\n  4. 한 값만 튀면 센서 쪽이다(6.5절).\n- **조치**\n  - 오염: 원인(필터·급유)을 없애고 기름을 정화하거나 바꾼다.\n  - 온도가 내려오지 않거나 경고를 넘은 채 이어지면 정지해 베어링을 분해 점검한다. 배빗이 긁혔거나 녹았으면 교체한다.\n\n### 6.5 센서 고장\n\n- VI-2141X와 VI-2141Y는 같은 베어링의 짝 태그다. 한쪽만 튀거나 값이 고정되고, 다른 쪽과 TI-2141·FI-2144가 그대로면 센서 고장이다. MAN-VIB-01 4절을 따른다.\n- 몇 초짜리 튐은 울림 지연(10초) 때문에 한계값 알람이 되지 않지만, 1시간 요약의 최대값에 남아 통계 알람(최대)이 날 수 있다(MAN-VIB-01 4.2절).\n\n## 7. 관련 문서\n\n- 매뉴얼: MAN-VIB-01(진동·센서 감시 공통 지침)\n- 과거 고장 사례: 사례 색인에서 설비 P-2104로 찾는다.\n\n## 근거\n\n| 번호 | 출처 |\n|---|---|\n| 설비조사 0.1 | 수첨분해 차지 펌프는 고압 다단 배럴형, 전동기 구동(AFPM Q&A, Sulzer CP 배럴 펌프) |\n| M1 | Europump, Pump Vibration Standards Guidelines(진동 알람·정지 약 10초 지연, API 610 유막 베어링 축 진동 50 µm p-p) |\n| M4 | Marscher, An End-User's Guide to Centrifugal Pump Rotordynamics(BEP 이탈, 최소 유량, 1X·2X, 웨어링 마모 흔적) |\n| M5 | Metrix, Vibration Monitoring of Pumps(유막 베어링은 근접 프로브, 센서는 커플링 쪽 베어링) |\n| M6 | Turbomachinery Magazine, Bearing and mechanical seal application in pumps(강제 윤활 조건) |\n| M10, M11, M12 | DOE-HDBK-1018/1(캐비테이션 징후), Tractian(고주파 광대역 진동), HI Pump FAQs(NPSH3 정의) |\n| M13, M14 | John Crane Plan 52/53A 리저버 매뉴얼(레벨·압력의 뜻), Reliamag(펌프 고장 중 씰 60.4%) |\n| M16, M17 | US 특허 9027398(마모 → 양정·효율 저하), KSB 펌프 사전 Characteristic curve(성능 곡선, 유량 0에서 동력 최소) |\n| M18, M19 | Acoem(베어링 고장 4단계), Reliamag P-F curve(감지 순서가 고장마다 다름) |\n| M35 | Reliable Plant, Multiple PdM tools diagnose a pump problem(펌프 오일 휠 사례) |\n| 원심 27 | 진동 진단 차트(오일 휠 0.42~0.48X) |\n| P32, P33, P34, P35 | Flowserve DMX 매뉴얼(스트레이너 차압·경보), Caleffi(청소 시점), Pumps & Systems(20 psi), PTQ 2024(유량 제어가 가린 막힘) |\n| P36, P37 | Perez, 23rd Pump Users Symposium(허용 운전 영역, 저유량 진동·압력 실측), Pumps & Systems(재순환 시작 유량) |\n\nM 번호는 `docs/설비조사_6유형.md` 「3·4절 출처」, P 번호는 같은 문서 8절, 설비조사 0.1은 같은 문서 0.1절과 「0절 출처」, 원심 번호는 `docs/원심압축기_해부도.html` 출처 목록이다.\n","MAN-T-2101":"# T-2101 재순환 가스 압축기 구동 증기 터빈 운전·정비 매뉴얼\n\n> 문서 ID MAN-T-2101 · 개정 2 · 2026-09-15 · 가상 정유 1공장 회전기계팀\n> 교육·시연용 가상 문서다. 숫자의 근거는 끝의 「근거」에 있다. 실제 설비의 설정값은 제조사 기준을 따른다.\n\n## 1. 목적·적용 범위\n\n- 이 매뉴얼은 T-2101을 정상 상태로 운전하고, 관리 항목이 한계값을 벗어났을 때 운전원과 정비원이 같은 순서로 대응하도록 정한다.\n- 적용 범위는 T-2101 본체다. 증기 입구(트립·스로틀 밸브, 조속 밸브와 구동기), 노즐·1단, 로터, 배기(커플링) 쪽 저널 베어링, 커플링을 다룬다.\n- 함께 보는 문서\n  - 피구동 압축기: MAN-C-2100\n  - 압축기·터빈 공용 윤활유 계통: MAN-LUBE-01\n  - 진동 판정 기준, 통계 알람의 뜻, 센서 고장 판별, 알람 해제 규칙: MAN-VIB-01\n\n## 2. 설비 개요\n\n| 항목 | 내용 |\n|---|---|\n| 설비 ID | T-2101 |\n| 설비명 | 재순환 가스 압축기 구동 증기 터빈 |\n| 유형 | 터빈 |\n| 설비 등급 | 1 (1 = 가장 중요) |\n| 유닛 | UNIT-21 수첨분해 |\n| 구동기 | — (C-2100 를 구동) |\n| 파트 | 구동 터빈 배기(커플링) 쪽 저널 베어링, 구동 터빈 입구 증기(트립·스로틀 밸브 앞), 구동 터빈 1단 후 휠 챔버, 구동 터빈 축 끝 회전수 톱니바퀴 |\n\n- T-2101은 재순환 가스 압축기 C-2100을 돌리는 기계 구동용 증기 터빈이다. 커플링으로 바로 이어져 압축기와 같은 회전수로 돈다.\n- 회전수를 바꿔 압축기 유량을 맞춘다(가변 속도) [T25][T34]. 압축기 유량은 회전수에 거의 비례한다(친화 법칙). 그래서 터빈 회전수가 출렁이면 압축기 흡입 유량 FI-2104도 같은 주기로 출렁인다.\n- 예비기가 없는 핵심 설비라 특수 목적 터빈(API 612) 대상으로 본다 [T1]. 설비 등급이 1이다.\n- 증기는 증기 헤더 → 트립·스로틀 밸브 → 조속 밸브 → 노즐·1단(휠 챔버) → 뒤쪽 단 → 배기 순서로 흐른다 [T14][T19].\n- 조속기는 회전수 신호를 받아 유압 구동기를 움직인다. 구동기는 서보 밸브가 유압 실린더를 움직이는 방식이고, 실린더 로드가 링크로 조속 밸브 랙에 이어진다 [T20].\n- 조속기에는 조속 밸브 개도를 일정 값에 묶어 두는 밸브 리미터가 있다. 회전수가 출렁일 때 임시로 쓴다(5.5절).\n- 감시 센서\n  - 배기(커플링) 쪽 저널 베어링에 축 진동 근접 프로브 X·Y 두 개(VI-2111X/Y, 90° 간격)와 베어링 메탈 온도 RTD 하나(TI-2111)가 있다. 증기(조속기) 쪽 베어링과 추력 베어링은 이 관리 항목표에 태그가 없다.\n  - 입구 증기 압력 PI-2113은 트립·스로틀 밸브 앞에서 잰다. 멘토 표준 태그 「TBN Inlet Steam Press」에 해당한다.\n  - 1단 후(휠 챔버) 압력 PI-2114는 증기 통로 퇴적을 보려고 둔다 [T14].\n  - 회전수 SI-2116은 축 끝 톱니바퀴의 회전수 픽업으로 잰다. 멘토 표준 태그 「TBN RPM」에 해당한다. 과속 감지는 따로 독립 채널 3개를 두고 3개 중 2개가 동의하면 트립한다 [T29].\n  - 윤활유는 C-2100과 같은 콘솔에서 받는다. 공급 온도 TI-2108은 MAN-LUBE-01이 다룬다.\n  - 조속 밸브 개도, 구동기 위치, 조속기 제어 출력, 유압 오일 상태는 이 관리 항목표의 태그가 아니다. 제어 화면과 현장에서 본다.\n\n## 3. 관리 항목표\n\n| 태그 | 측정 | 단위 | 평소 값 | 경고 | 알람 | 정지 | 울림 지연 | 해제 폭 · 해제 지연 | 통계 알람 |\n|---|---|---|---|---|---|---|---|---|---|\n| VI-2111X | 구동 터빈 배기 쪽 베어링 축 진동 X | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2111Y | 구동 터빈 배기 쪽 베어링 축 진동 Y | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| TI-2111 | 구동 터빈 배기 쪽 베어링 메탈 온도 | °C | 80 | ↑90 | ↑95 | ↑115 | 0초 | 0.8 · 60초 | 평균↑ |\n| PI-2113 | 구동 터빈 입구 증기 압력 (TBN Inlet Steam Press) | kg/cm² | 42 | ↓39.9 | ↓37.8 |  | 0초 | 0.84 · 15초 |  |\n| PI-2114 | 구동 터빈 1단 후 압력 | kg/cm² | 30 | ↑31.5 | ↑33 |  | 0초 | 0.6 · 15초 | 평균↑ |\n| SI-2116 | 구동 터빈 회전수 (TBN RPM) | rpm | 9,500 |  | ↑10,500 | ↑11,550 | 0초 | 190 · 15초 | 표준편차↑ |\n\n↑ 넘으면 이상, ↓ 내려가면 이상. 통계 알람은 정상 구간의 1시간 요약과 비교해 그 통계가 벗어날 때 울리는 경고(LOW)다(MAN-VIB-01 3절).\n\n- 경고·알람·정지는 설비 태그의 「경고 상·하한(초기 경고)」, 「알람 상·하한(운전 알람)」, 「정지 상·하한(설비 보호 정지)」이다.\n- 회전수의 알람 값은 최대 연속 속도이고, 정지 값은 과속 트립 속도다. 최대 연속 속도는 운전 중 가장 높은 요구 속도의 105% 이상, 트립 속도는 최대 연속 속도의 110% 이상으로 잡는다 [T1]. 가장 높은 요구 속도 10,000 rpm은 팀 가정이다.\n- 회전수에는 내려가는 쪽 한계값이 없다. 회전수가 출렁이는 헌팅은 1시간 평균이 그대로라 한계값 알람으로 잡히지 않는다. 1시간 요약의 표준편차 통계 알람으로 잡는다(MAN-VIB-01 3.2절).\n- 입구 증기 압력과 1단 후 압력의 경고·알람 값은 평소 값의 5%·10%로 팀이 정했다. 1단 후 압력은 퇴적으로 오르는 것을 보려고 올라가는 쪽만 둔다 [T14].\n- 울림 지연, 해제 폭·해제 지연의 뜻은 MAN-VIB-01 5절이다.\n\n## 4. 정상 운전 점검\n\n### 4.1 매 교대\n\n| 항목 | 보는 것 | 정상 |\n|---|---|---|\n| 베어링 메탈 온도 TI-2111 | 값과 12시간 추이 | 평소 값 부근이고, 압축기 베어링 온도(TI-2101, TI-2102)와 같은 방향으로 움직인다 |\n| 축 진동 VI-2111X/Y | 두 값과 추이 | X·Y가 비슷한 크기로 함께 움직인다. 계단처럼 뛰거나 순간 튀지 않는다 |\n| 회전수 SI-2116 | 설정값과 실제값, 1시간 표준편차 | 설정값 부근에서 출렁이지 않는다. 압축기 유량 FI-2104도 출렁이지 않는다 |\n| 입구 증기 압력 PI-2113 | 값 | 평소 값 부근이다. 헤더 압력이 바뀌면 유틸리티 담당과 확인한다 |\n| 1단 후 압력 PI-2114 | 값과 그때의 회전수·압축기 유량 | 같은 회전수·유량에서 예전과 같은 값이다 |\n| 조속 밸브 | 조속기 제어 출력, 구동기 위치, 밸브 개도 | 셋이 함께 매끄럽게 움직인다. 같은 부하에서 개도가 예전보다 커지지 않았다 |\n| 현장 | 증기 누설, 그랜드 증기, 유압 계통 누유, 조속 밸브 링크, 이상음 | 이상이 없다 |\n\n### 4.2 정기 점검\n\n| 주기 | 항목 | 이유 |\n|---|---|---|\n| 월 1회 | 1단 후 압력과 조속 밸브 개도를 같은 회전수·유량끼리 비교한 추이 | 퇴적은 같은 증기 유량에서 1단 후 압력이 오르는 것으로 드러난다 [T14] |\n| 월 1회 | 증기 품질 기록(나트륨·실리카) 확인. 유틸리티 부서 자료 | 증기에 섞인 염이 노즐·날개에 쌓인다 [T14] |\n| 반기 1회 | 조속기 유압 오일 시료 분석: 수분, 산가, 오염도 | 열린 탱크로 수분이 들고 산화해 산이 생기면 서보 밸브가 고착된다 [P19] |\n| 분기 1회 | 조속 밸브 링크의 핀·부싱 유격과 윤활 | 유격이 생기면 밸브가 구동기를 늦게 따라가 회전수가 출렁일 수 있다(추론) |\n| 분기 1회 | 트립·스로틀 밸브 부분 행정 시험 | 한 자리에 오래 있으면 스템 부싱에 퇴적이 생겨 트립 때 닫히지 않을 수 있다 [T19][T35] |\n| 윤활유 시료 분석 때 | 윤활유 수분 | 그랜드 증기가 새면 베어링 하우징에서 응축해 기름에 물이 든다 [T32]. 시료 분석은 MAN-LUBE-01을 따른다 |\n| 정비 뒤 기동 | 커플링 체결 토크 기록, 기동 전후 진동 비교(1X 크기와 위상) | 커플링이 풀리면 1X가 계단처럼 뛰고 위상이 바뀐다 [T16] |\n| 정기 보수 | 과속 트립 시험 | 트립 속도는 최대 연속 속도의 110% 이상이다 [T1] |\n\n## 5. 이상 시 조치\n\n모든 알람에서 먼저 할 일은 같다.\n1. 같은 설비의 다른 태그, 짝 태그(X/Y), 압축기 쪽 태그(구동측 진동 VI-2101X/Y, 흡입 유량 FI-2104), 공용 윤활유 공급 온도 TI-2108이 함께 움직였는지 본다. 한 태그만 튀면 센서 고장부터 의심한다(MAN-VIB-01 4절).\n2. 값이 언제부터 어떤 모양(서서히, 계단, 출렁임, 튐)으로 바뀌었는지 1시간 요약으로 본다.\n3. 아래 항목별 조치를 하고, 원인은 6절 표에서 좁힌다.\n\n### 5.1 베어링 메탈 온도 TI-2111\n\n**관리 기준** — 평소 80 °C · 경고 ↑90 · 알람 ↑95 · 정지 ↑115 °C · 울림 지연 0초 · 해제 폭 0.8 °C · 해제 지연 60초\n\n- **경고**\n  1. 윤활유 공급 온도 TI-2108과 압축기 베어링 온도 TI-2101, TI-2102를 같이 본다. 공급 온도가 먼저 올랐고 여러 베어링이 함께 오르면 윤활유 계통 문제다(MAN-LUBE-01 5.1절).\n  2. TI-2111만 오르면 터빈 베어링 문제다. 같은 베어링의 축 진동 VI-2111X/Y가 함께 움직였는지 본다.\n  3. 윤활유 시료의 수분을 확인한다. 그랜드 증기 누설로 물이 들면 베어링 온도와 진동이 서서히 오른다 [T32]. 수분 500 ppm을 경고로 쓰는 제조사가 있다 [T31].\n  4. 아주 서서히 오르면 더러운 기름에 따른 베어링 마모일 수 있다. 짧은 기간 데이터로는 안 보이고 긴 추세에서만 보인다 [T18].\n- **알람:** 정비 담당에게 알리고 부하를 줄일 수 있으면 줄인다.\n- **정지:** 설비 보호 정지 값이다. 정지되면 재기동 전에 베어링을 분해 점검한다.\n\n### 5.2 축 진동 VI-2111X/Y\n\n**관리 기준** — 평소 25 µm · 경고 ↑38 · 알람 ↑50 · 정지 ↑65 µm · 울림 지연 10초 · 해제 폭 0.5 µm · 해제 지연 15초\n\nVI-2111Y도 기준이 같다.\n- **경고**\n  1. X·Y가 함께 움직였는지 본다. 한 프로브만 튀면 센서 고장 판별을 먼저 한다(MAN-VIB-01 4절).\n  2. 모양을 본다.\n     - 계단처럼 한 번에 뛰고 그 값에 머물면 커플링 풀림·날개 파손을 의심한다(6.3절).\n     - 압축기 구동측 진동 VI-2101X/Y도 함께 오르면 정렬 불량이다(6.4절).\n     - 기동 직후 몇 분~수십 분에 걸쳐 서서히 오르면 러빙·축 열 휨을 의심한다(6.7절) [T15].\n     - 베어링 온도 TI-2111이 함께 오르면 베어링 쪽이다(5.1절).\n- **알람:** 진동 분석(1X 크기와 위상, 2X 성분)을 요청한다. 1X 위상이 갑자기 바뀌었는지 본다 [T16].\n- **정지:** 설비 보호 정지 값이다. 정지되면 원인을 찾기 전까지 재기동하지 않는다.\n\n### 5.3 입구 증기 압력 PI-2113\n\n**관리 기준** — 평소 42 kg/cm² · 경고 ↓39.9 · 알람 ↓37.8 kg/cm² · 울림 지연 0초 · 해제 폭 0.84 kg/cm² · 해제 지연 15초\n\n- **경고·알람(내려감)**\n  1. 유틸리티 담당과 증기 헤더 압력을 확인한다. 같은 헤더를 쓰는 다른 공정의 증기 사용이 늘었는지 본다.\n  2. 회전수가 유지되는지 본다. 입구 압력이 내려가면 조속기가 밸브를 더 열어 회전수를 지킨다(추론). 밸브가 끝까지 열리면 회전수가 떨어지고 압축기 유량 FI-2104가 줄어든다(추론). 그때는 공정 운전원과 처리량을 맞춘다.\n  3. 입구 압력이 출렁이면 회전수도 따라 출렁일 수 있다. 조속 계통 문제와 가를 때 쓴다(6.2절).\n\n### 5.4 1단 후 압력 PI-2114\n\n**관리 기준** — 평소 30 kg/cm² · 경고 ↑31.5 · 알람 ↑33 kg/cm² · 울림 지연 0초 · 해제 폭 0.6 kg/cm² · 해제 지연 15초\n\n- 1단 후 압력은 증기 유량을 따라 움직인다. 부하가 늘면 함께 오르므로, 같은 회전수·압축기 유량끼리 비교한다 [T14].\n- **경고**\n  1. 회전수 SI-2116과 압축기 유량 FI-2104가 그대로인데 올랐는지 본다.\n  2. 입구 압력 PI-2113이 함께 올랐는지 본다. 함께 올랐으면 헤더 압력 변화다.\n  3. 현장 압력계와 비교해 전송기 드리프트가 아닌지 확인한다.\n  4. 같은 부하에서 조속 밸브 개도가 예전보다 커졌으면 증기 통로 퇴적을 의심한다(6.1절).\n- **알람:** 증기 품질 기록을 확인하고 제조사와 세척 방법을 정한다(6.1절). 퇴적이 심해지면 터빈 앞뒤 압력 차가 기계적 한계까지 커진다 [T14].\n\n### 5.5 회전수 SI-2116\n\n**관리 기준** — 평소 9,500 rpm · 알람 ↑10,500 · 정지 ↑11,550 rpm · 울림 지연 0초 · 해제 폭 190 rpm · 해제 지연 15초\n\n- **알람(최대 연속 속도를 넘음)**\n  1. 회전수 설정값을 바꾼 조작이 있었는지 본다.\n  2. 압축기 쪽 부하가 갑자기 빠졌는지 본다. 압축기 서지 때 회전수가 순간 오른다 [P12](MAN-C-2100 6.4절).\n  3. 조속 밸브가 제어 출력대로 닫히는지 본다.\n- **정지(과속 트립)**\n  - 과속 감지 계기는 감지에서 릴레이 출력까지 40 ms 안에 트립한다 [T29].\n  - 트립 뒤 회전수가 떨어지지 않으면 트립·스로틀 밸브가 닫히지 않은 것이다 [T19]. 비상 절차에 따라 증기 입구 차단 밸브를 닫는다.\n  - 과속은 날개 뿌리 파손으로 이어질 수 있다 [T18]. 재기동 전에 트립 밸브와 로터를 점검한다.\n- **출렁임(통계 알람: 표준편차↑)**\n  1. 한계값 알람 없이 1시간 표준편차만 커진다. 압축기 유량 FI-2104가 같은 주기로 따라 출렁이는지 본다. 따라 출렁이지 않고 한 채널만 움직이면 센서 고장이다.\n  2. 입구 압력 PI-2113이 같은 주기로 출렁이면 증기 쪽 원인이다.\n  3. 압축기 유량이 먼저 크게 떨어지고 축 위치 ZI-2105A가 튀면 서지다(MAN-C-2100 6.4절).\n  4. 둘 다 아니면 조속 계통 문제로 보고 6.2절로 간다.\n  5. 출렁임이 커지면 밸브 리미터로 조속 밸브 개도를 묶어 회전수를 안정시킨다. 이때 회전수가 공정 요구를 스스로 따라가지 못하므로 운전원이 직접 맞춘다.\n\n### 5.6 윤활유 공급 온도 TI-2108\n\n공용 계통이라 MAN-LUBE-01 5절을 따른다.\n\n## 6. 고장별 증상·점검·조치\n\n원인은 대부분 데이터만으로 하나로 확정할 수 없다. 아래 「추정 원인」은 현장 확인으로 확정한다. 매뉴얼이 정한 조치는 그대로 따른다.\n\n| 절 | 고장 | 먼저 움직이는 태그와 모양 | 가르는 단서 |\n|---|---|---|---|\n| 6.1 | 증기 통로 퇴적 | 1단 후 압력 PI-2114 서서히↑(같은 회전수·유량에서) | 1단 후 압력만 오르고 입구 압력은 그대로다 |\n| 6.2 | 조속 밸브 고착·헌팅 | 회전수 SI-2116 출렁임, 압축기 유량 FI-2104가 따라 출렁임 | 회전수만 출렁이고 입구 압력·진동·온도는 그대로다 |\n| 6.3 | 커플링 풀림·날개 파손 | 축 진동 VI-2111X/Y 계단↑, 1X 위상 급변 | 진동만 계단처럼 뛰고 압축기 쪽 진동·온도·공정값은 그대로다 |\n| 6.4 | 정렬 불량 | VI-2111X/Y와 압축기 구동측 VI-2101X/Y 함께↑ | 커플링 양쪽이 같이 오른다 |\n| 6.5 | 윤활유 계통 | 공급 온도 TI-2108↑ → TI-2111과 압축기 베어링 온도 함께↑ | 공급 온도가 먼저 움직인다 |\n| 6.6 | 센서 고장 | 한 태그만 튐·고정 | 짝 태그와 어긋난다 |\n\n### 6.1 증기 통로 퇴적\n\n- **증상**\n  - 오래 운전하면 증기에 섞인 나트륨·실리카 같은 염이 노즐과 날개에 쌓인다 [T14].\n  - 통로가 좁아져 같은 증기 유량에서 1단 후 압력이 오르고, 증기 유량과 출력이 줄어든다 [T14].\n  - 몇 달~몇 년에 걸쳐 서서히 진행한다. 제조사 자료의 퇴적 사진은 7년 연속 운전 뒤의 것이다 [T14].\n  - 조속기는 회전수를 지키려고 밸브를 더 연다(추론). 밸브가 끝까지 열리면 회전수를 지키지 못한다(추론).\n  - 추력 하중이 늘어 추력 패드 온도가 오를 수 있다 [T27]. 이 설비는 추력 베어링 온도를 관리 항목표에 두지 않았다.\n- **추정 원인 → 확인 방법**\n  1. 1단 후 압력 전송기의 드리프트가 아닌지 현장 압력계와 비교한다.\n  2. 같은 회전수·유량끼리 1단 후 압력과 조속 밸브 개도의 추이를 본다. 둘 다 커졌으면 통로가 좁아진 것이다 [T14].\n  3. 증기 품질 기록에서 나트륨·실리카가 늘었던 때를 찾는다. 보일러 쪽 문제(물방울이 증기에 섞여 나가는 캐리오버 등)를 유틸리티 부서와 확인한다.\n  4. 정지 기회에 노즐과 날개를 보어스코프로 본다.\n- **조치**\n  - 증기 품질 원인을 먼저 고친다. 그대로 두면 세척해도 다시 쌓인다.\n  - **운전 중 세척:** 증기에 물을 뿌려 습도를 높이고 온도를 낮춰 퇴적물을 녹여 낸다. 정격 회전수로 운전을 이어 가며, 2~4주에 출력이 약 6% 회복하고 1단 후 압력이 설계선 쪽으로 돌아온 사례가 있다 [T14]. 복수식·추기 복수식 터빈에 쓰고, 설치에는 조속 밸브를 바꿔 다는 공사가 든다 [T14].\n  - **정지 세척:** 운전 중 세척을 못 하면 온수 세척을 한다. 며칠 정지가 필요하다 [T14].\n\n### 6.2 조속 밸브 고착·헌팅\n\n- **증상**\n  - 회전수가 설정값을 가운데 두고 오르내린다(헌팅). 1시간 평균은 그대로라 한계값 알람은 나지 않고, 표준편차 통계 알람이 난다.\n  - 압축기 유량 FI-2104가 회전수를 따라 같은 주기로 출렁인다(친화 법칙).\n  - 정유사 송풍기 구동 터빈에서 회전수가 100~200 rpm 출렁였고, 고착된 구동기 때문에 공정 트립까지 간 사례가 있다 [T20].\n  - 경미할 때는 폭이 작다. 9,300~9,500 rpm 터빈에서 8~15 rpm 출렁인 사례가 있다 [P17]. 부하와 상관없이 계속 헌팅한 사례도 있다 [P18].\n- **추정 원인 → 확인 방법**\n\n| 추정 원인 | 회전수 모양 | 확인 방법 | 근거 |\n|---|---|---|---|\n| 서보 밸브 고착(유압 오일 열화) | 붙어 있다가 한 번에 미끄러지므로 계단처럼 뛰는 사각파가 된다. 제어 출력은 톱니 모양이 된다 | 제어 출력이 계속 변하는데 구동기 위치가 멈춰 있다가 한 번에 뛴다. 유압 오일 시료의 수분·산가, 서보 밸브 필터의 찌꺼기 | [P16][P19] |\n| 링크·연결부 마모(유격) | 계단 없이 완만한 물결이다. 유격 크기가 그대로라 처음부터 거의 같은 폭으로 계속된다 | 구동기는 제어 출력을 매끄럽게 따라가는데, 움직이는 방향이 바뀔 때 밸브 스템이 늦게 따라온다. 링크 핀·부싱 유격을 잰다. 유압 오일은 정상이다 | (추론) |\n| 제어 게인 과다 | 비례 게인이 과하면 1초 미만, 적분 게인이 과하면 1초 넘는 주기로 출렁인다 | 게인을 바꾼 이력이 있다. 밸브는 제어 출력을 그대로 따라간다 | [P15] |\n| 증기 헤더 압력 출렁임 | 입구 압력과 같은 주기다 | 입구 압력 PI-2113을 같은 시간축에 놓고 본다 | (추론) |\n| 압축기 서지 | 회전수가 순간 오른다 | 압축기 유량이 먼저 크게 떨어지고 축 위치가 튄다(MAN-C-2100 6.4절) | [P12] |\n\n- **조치**\n  1. 출렁임이 크면 밸브 리미터로 조속 밸브 개도를 묶고 운전원이 회전수를 직접 맞춘다(임시 조치).\n  2. 원인별 조치\n     - 서보 밸브 고착: 유압 오일을 빼고 계통을 씻어 낸 뒤 새 기름을 넣는다. 서보 밸브를 세척하거나 교체한다 [P19].\n     - 링크 마모: 핀·부싱·로드 엔드를 교체하고 윤활한 뒤 밸브 행정을 다시 맞춘다.\n     - 게인 과다: 게인을 되돌리거나 다시 맞춘다 [P15].\n  3. 고착이 되풀이되면 구동기 형식을 바꾸는 것도 검토한다. T20 사례는 유압 구동기를 전기-유압식 구동기로 바꿨다 [T20].\n\n### 6.3 커플링 풀림·날개 파손\n\n- **증상**\n  - 로터의 질량 불균형이 갑자기 바뀌어 회전수 성분(1X) 진동이 계단처럼 뛰고, 1X 위상이 급변한다 [T16].\n  - 인용 사례는 커플링 너트가 풀린 경우다. 재기동 뒤 1X가 계단처럼 올라 약 100 µm p-p가 됐고, 두 베어링의 위상이 약 180° 뒤집혔다 [T16].\n  - 베어링 온도와 공정값(증기 압력, 회전수)은 그대로다.\n- **추정 원인 → 확인 방법**\n  1. X·Y가 함께 계단처럼 뛰었는지 본다. 하나만 뛰면 센서다.\n  2. 압축기 구동측 진동 VI-2101X/Y가 그대로인지 본다. 함께 올랐으면 정렬 불량(6.4절)이다.\n  3. 진동 분석으로 1X 크기와 위상의 변화를 본다.\n  4. 직전 정비 이력(커플링 분해·조립, 체결 토크 기록)을 본다.\n  5. 정지해 커플링 체결 상태를 보고, 보어스코프로 날개를 본다. 커플링 풀림인지 날개 파손인지는 데이터만으로 가르기 어렵다.\n- **조치:** 경고·알람 구간이면 진동 추이를 짧은 간격으로 보며 계획 정지를 잡는다. 정지 값에 닿으면 멈춘다. 커플링이 풀렸으면 체결 부품을 새것으로 바꾸고 규정 토크로 조인다. 날개가 파손됐으면 로터를 수리한다.\n\n### 6.4 정렬 불량\n\n- 터빈 진동 VI-2111X/Y와 압축기 구동측 진동 VI-2101X/Y가 함께 오르면 정렬 불량이다. MAN-C-2100 6.6절을 따른다.\n- 베어링 받침의 미끄럼면이 더러우면 터빈의 열팽창이 막혀 정렬이 바뀔 수 있다 [T18]. 승온 중에 진동이 바뀌는지 본다.\n\n### 6.5 윤활유 계통\n\n- 공급 온도 TI-2108이 먼저 오르고 터빈 베어링 TI-2111과 압축기 베어링 TI-2101, TI-2102가 함께 같은 모양으로 오른다.\n- 원인과 조치는 MAN-LUBE-01 6절을 따른다.\n\n### 6.6 센서 고장\n\n- 한 태그만 튀거나 값이 고정되고 짝 태그는 그대로면 센서 고장이다. MAN-VIB-01 4절을 따른다.\n- 회전수는 과속 감지용 채널 셋과 비교한다 [T29]. 케이블 결함 사례에서도 별도 속도계로 교차 확인했다 [T15]. 회전수가 출렁여도 압축기 유량이 따라 움직이지 않으면 센서 쪽이다.\n\n### 6.7 태그로 잘 드러나지 않는 고장\n\n| 고장 | 드러나는 모양 | 찾는 방법 | 근거 |\n|---|---|---|---|\n| 러빙·축 열 휨 | 기동 직후 몇 분~수십 분에 1X가 서서히 커진다. 20분에 약 25 µm에서 100 µm로 오른 사례가 있다 | 1X 벡터가 회전 반대 방향으로 도는지 본다 | [T15] |\n| 트립·스로틀 밸브 고착 | 평소에는 신호가 없다. 트립 때 닫히지 않아 과속으로 이어진다 | 부분 행정 시험 | [T19][T35] |\n| 그랜드 증기 누설 | 윤활유 수분이 서서히 늘고 베어링 수명이 4~12개월로 줄어든다 | 윤활유 수분 분석 | [T32][T31] |\n| 수분 유입 | 기동·정지·부하 변경 같은 과도 상태에 주로 생긴다(정상 부하 중은 18%). 추력 베어링·날개를 상하게 한다 | 기동·부하 변경 직후 진동·축 이동 확인, 드레인 점검 | [T23] |\n| 날개 침식 | 운전 중에는 거의 안 보이고 분해 때 발견한다 | 정기 보수 때 육안 점검 | [T18][T24] |\n| 추력 베어링 손상 | 추력 패드 온도가 서서히 오르다 튄다 | 이 설비는 추력 패드 온도를 관리 항목표에 두지 않았다. 정기 보수 때 패드를 본다 | [T17] |\n\n## 7. 관련 문서\n\n- 매뉴얼: MAN-C-2100(피구동 압축기), MAN-LUBE-01(윤활유 계통), MAN-VIB-01(진동·센서 감시 공통 지침)\n- 과거 고장 사례: 사례 색인에서 설비 T-2101로 찾는다.\n\n## 근거\n\n| 번호 | 출처 |\n|---|---|\n| T1 | ISO 10437:1993(= API 612 3판): 특수 목적 터빈, 최대 연속 속도 105%·트립 속도 110% |\n| T14 | MHI Compressor T-E-010(2012): 나트륨·실리카 퇴적과 1단 후 압력, 운전 중 세척(2~4주, 출력 약 6% 회복), 온수 세척 며칠 정지 |\n| T15 | Bently Nevada Orbit Q1 2022: 러빙·축 열 휨, 별도 속도계 교차 확인 |\n| T16 | Orbit, 증기 터빈 커플링 사례: 1X 계단, 위상 반전 |\n| T17 | Kingsbury, 전기 피팅: 추력 패드 온도 변화 |\n| T18 | Fortum(2022) 정비 백서: 베어링 마모, 날개 침식, 과속, 받침 고착 |\n| T19 | Turbomachinery Magazine(2014), 터빈 파괴 방지: 트립 밸브 미폐쇄 |\n| T20 | Turbomachinery Magazine(2016), 속도 불안정: 100~200 rpm 출렁임, 구동기 고착, 구동기 교체 |\n| T23 | POWER(2009), ASME TDP-1 개정 요약: 수분 유입 |\n| T24 | TLV / Hydrocarbon Processing(2022): 습증기 피해 |\n| T25, T34 | Almasi, Chemical Processing(2015), MHI 기계 구동 터빈: 가변 속도 |\n| T27 | AIChE 초록(2021): 퇴적과 추력(검색 요약) |\n| T29 | Istec, API 670 과속 감지: 3채널·2oo3·40 ms |\n| T31, T32 | Noria(오일 수분 500 ppm 경고), Reliabilityweb(그랜드 증기 누설과 베어링 수명) |\n| T35 | 미국 특허 9057450: 스템 부싱 퇴적(검색 요약) |\n| P12 | Control Global, 압축기 서지 제어: 서지 때 회전수 |\n| P15 | Woodward 매뉴얼 26839: 게인과 출렁임 주기 |\n| P16 | AIChE 2008 밸브 고착(stiction): 제어 출력 톱니, 측정값 사각파(검색 요약) |\n| P17, P18 | Eng-Tips(8~15 rpm), Control.com(계속 헌팅) 포럼 |\n| P19 | Turbomachinery Magazine(2016), 속도 불안정: 수분 유입·산화로 열화한 유압 오일이 서보 밸브를 고착시킴(T20과 같은 기사) |\n\nT 번호는 `docs/설비조사_6유형.md` 5·6절 출처, P 번호는 같은 문서 8절이다. 「(추론)」은 출처에 직접 쓰여 있지 않고 팀이 원리로 짐작한 것이다.\n","MAN-VIB-01":"# 회전기계 진동·센서 감시 공통 지침\n\n> 문서 ID MAN-VIB-01 · 개정 2 · 2026-09-15 · 가상 정유 1공장 회전기계팀\n> 교육·시연용 가상 문서다. 실제 설비의 설정값은 제조사 기준을 따른다.\n\n## 1. 목적·적용 범위\n\n- 회전기계 여섯 대(C-2100, T-2101, C-2102, M-2103, P-2104, F-1100)에 공통으로 쓰는 감시 기준을 정한다.\n- 다루는 것: 진동 측정의 종류(2절), 알람의 두 방식(3절), 센서 고장 판별(4절), 알람 해제 규칙(5절), 결측·품질(6절).\n- 설비마다 다른 한계값과 고장별 조치는 각 설비 매뉴얼을 따른다.\n\n## 2. 진동 측정의 종류\n\n| 종류 | 무엇을 재나 | 단위 | 붙는 곳 | 근거 |\n|---|---|---|---|---|\n| 축 진동(근접 프로브) | 베어링 안에서 축이 흔들리는 폭(봉우리-봉우리) | µm | 유막(저널) 베어링. 베어링마다 X·Y 두 개를 90° 간격으로 단다 | API 670 관행 [설비조사 2.3·5.3] |\n| 하우징 진동(가속도계 → 속도) | 베어링 하우징의 진동 속도(RMS) | mm/s | 구름 베어링, 왕복동 프레임 | ISO 20816 [설비조사 3·4·6절] |\n| 크로스헤드 가속도 | 왕복동 크로스헤드의 충격 | g | 왕복동 압축기 스로마다 | [P22][P23] |\n| 축 위치 | 축이 축방향으로 움직인 양 | mm | 원심 압축기 스러스트 베어링 | [원심 19] |\n| 로드 드롭 | 왕복동 피스톤 로드가 내려앉은 양 | µm | 왕복동 압축기 스로마다 | [설비조사 1.3] |\n\n### 진동 태그 기준\n\n| 태그 | 측정 | 단위 | 평소 값 | 경고 | 알람 | 정지 | 울림 지연 | 해제 폭 · 해제 지연 | 통계 알람 |\n|---|---|---|---|---|---|---|---|---|---|\n| VI-2101X | 재순환 압축기 구동측 베어링 축 진동 X | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2101Y | 재순환 압축기 구동측 베어링 축 진동 Y | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2102X | 재순환 압축기 반구동측 베어링 축 진동 X | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2102Y | 재순환 압축기 반구동측 베어링 축 진동 Y | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| ZI-2105A | 재순환 압축기 축방향 위치 | mm | 0 |  | ↑0.5 / ↓-0.5 | ↑0.7 / ↓-0.7 | 0초 | 0.014 · 15초 |  |\n| VI-2111X | 구동 터빈 배기 쪽 베어링 축 진동 X | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2111Y | 구동 터빈 배기 쪽 베어링 축 진동 Y | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2121H | 보충 수소 압축기 프레임 진동 수평 | mm/s | 3.5 | ↑5.5 | ↑8 | ↑12 | 10초 | 0.07 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2122V | 보충 수소 압축기 1번 크로스헤드 가속도 | g | 1 |  |  |  |  |  | 평균↑, 최대↑ |\n| ZI-2122V | 보충 수소 압축기 1번 피스톤 로드 드롭 | µm | 450 | ↑700 | ↑1,000 | ↑1,500 | 0초 | 9 · 15초 | 평균↑ |\n| VI-2123V | 보충 수소 압축기 2번 크로스헤드 가속도 | g | 1 |  |  |  |  |  | 평균↑, 최대↑ |\n| ZI-2123V | 보충 수소 압축기 2번 피스톤 로드 드롭 | µm | 450 | ↑700 | ↑1,000 | ↑1,500 | 0초 | 9 · 15초 | 평균↑ |\n| VI-2131H | 보충 수소 압축기 모터 구동측 베어링 진동 수평 | mm/s | 1.5 | ↑2.6 | ↑4.5 | ↑7.1 | 10초 | 0.03 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2132H | 보충 수소 압축기 모터 반구동측 베어링 진동 수평 | mm/s | 1.5 | ↑2.6 | ↑4.5 | ↑7.1 | 10초 | 0.03 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2141X | 반응기 공급 펌프 구동측 베어링 축 진동 X | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-2141Y | 반응기 공급 펌프 구동측 베어링 축 진동 Y | µm | 25 | ↑38 | ↑50 | ↑65 | 10초 | 0.5 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-1101H | 가열로 유인 송풍기 커플링 쪽 베어링 진동 수평 | mm/s | 2 | ↑3.1 | ↑4.5 | ↑7.1 | 10초 | 0.04 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n| VI-1102H | 가열로 유인 송풍기 입구 쪽 베어링 진동 수평 | mm/s | 2 | ↑3.1 | ↑4.5 | ↑7.1 | 10초 | 0.04 · 15초 | 평균↑, 최대↑, 표준편차↑ |\n\n↑ 넘으면 이상, ↓ 내려가면 이상. 통계 알람은 정상 구간의 1시간 요약과 비교해 그 통계가 벗어날 때 울리는 경고(LOW)다(MAN-VIB-01 3절).\n\n- 진동 크기만으로 원인을 정하지 않는다. 주파수 성분이 원인을 가른다: 회전수와 같은 성분(1X)이 크면 불균형, 2X·축 방향 성분이 크면 정렬 불량, 회전수의 약 0.42~0.48배 성분이면 기름막 불안정(오일 휠)이다 [원심 27]. 우리 감시 값은 1초마다의 전체 크기라 성분은 진동 분석으로 따로 본다.\n\n## 3. 알람의 두 방식\n\n### 3.1 한계값 알람(LIMIT)\n\n- 1초 값이 정해진 한계값(경고·알람·정지)을 넘으면 울린다.\n- 울림 지연이 있는 태그는 그 시간보다 길게 넘어야 울린다. 진동은 10초다. 그래서 몇 초짜리 튐으로는 울리지 않는다.\n- 경고는 초기 경고(Soft High), 알람은 운전 알람, 정지는 설비 보호 정지다. 대응 순서를 정할 때는 이 심각도와 설비 등급을 함께 본다.\n\n### 3.2 통계 알람(BASELINE)\n\n- 설비가 건강하게 돌던 「정상 구간」의 1시간 요약에서 평소 값과 흔들림 폭을 구해 고정해 둔다.\n- 매 시간, 그 1시간 요약이 「평소 값 + 3 × 흔들림 폭 + 고정 폭」을 넘으면 경고(LOW)를 낸다. 고정 폭은 사소한 변화가 알람이 되지 않게 막는다.\n- 통계마다 뜻이 다르다.\n\n| 통계 | 울리면 무엇을 뜻하나 | 흔한 원인 |\n|---|---|---|\n| 평균 | 값의 수준이 평소보다 올랐거나 내려갔다 | 서서히 진행하는 마모·퇴적·온도 상승 |\n| 최대 | 한 시간 안에 짧게 튄 값이 있다 | 순간 충격, 짧은 이상, 센서 튐 |\n| 표준편차 | 한 시간 안에서 값이 크게 출렁인다 | 서지, 캐비테이션, 조속 밸브 헌팅, 저유량 |\n\n- 통계 알람은 한계값에 닿기 전에 변화를 먼저 알리는 것이 목적이다. 진동 판정 기준(ISO 20816)도 평소 값에서 구역 B 상한의 25% 넘게 변하면 위아래 모두 의미 있는 변화로 본다 [P40].\n- 통계 알람은 대응 순서에 넣지 않는다. 트렌드에서 강조할 구간과 원인 검색의 재료로 쓴다.\n\n## 4. 센서 고장 판별\n\n센서·배선·전송기가 고장 나면 설비 상태와 상관없이 값이 이상해진다. 기계 고장으로 오판하면 불필요한 정지로 이어지므로, 알람이 나면 먼저 아래를 확인한다.\n\n### 4.1 판별 순서\n\n1. **짝 태그와 비교한다.** 같은 베어링의 X·Y, 같은 축의 DE·NDE, 함께 움직여야 할 온도·공정값을 본다. 짝은 그대로인데 한 태그만 튀거나 움직이면 센서 쪽이다 [원심 S11].\n2. **값의 모양을 본다.**\n   - 몇 초 이하로 크게 튀었다 돌아오는 것이 하루에 몇 번씩 몰려서 나타나면 접촉 불량을 의심한다. 포럼 사례에서는 평소 1.6 mils에서 최대 6 mils까지, 3초 이하로, 하루 두 번 3.5~5.5시간씩 몰려 튀었다 [P50].\n   - 기계가 1초 만에 그렇게 크게 변할 수는 없다. 정지값을 넘었는데 다른 값이 모두 그대로면 센서 쪽이다.\n   - 값이 범위 안에서 한 값에 고정되면 범위 검사로는 못 잡는다 [P48]. 평소 있던 작은 흔들림이 사라졌는지 본다.\n3. **품질 표시를 본다.** 감시 계기가 Not OK를 내면 그동안 값의 품질이 BAD다. Not OK가 끝나도 약 30초 지나야 값이 다시 나온다 [P47]. 4~20 mA 신호가 3.6 mA 이하나 21 mA 이상이면 계기 고장 신호다(NAMUR NE43) [P43]. RTD 오류 코드를 온도로 읽으면 수천 °C가 된다 [P44].\n4. **현장 확인:** 커넥터 체결 상태, 케이블 손상, 근접 프로브의 간극 전압, 부품 조합(서로 다른 길이의 케이블·프로브를 섞으면 간헐 오트립이 난다 [P49]).\n\n### 4.2 조치\n\n- 센서 고장으로 판단되면 그 태그의 알람을 기계 이상으로 보고하지 않는다. 계기 정비를 요청하고 짝 태그로 감시를 이어 간다.\n- 보호 정지는 보통 센서 여러 개의 표결(예: 3개 중 2개 동의)로 내려 한 센서 고장으로 정지하지 않게 한다 [원심 26].\n- 짧은 튐은 울림 지연 때문에 한계값 알람이 되지 않지만, 1시간 요약의 최대값에는 남아 통계 알람(최대)이 날 수 있다. 짝 태그와 비교해 센서 튐인지 먼저 본다.\n\n## 5. 알람 해제 규칙\n\n- 울린 한계값 알람은 값이 한계값에서 「해제 폭」만큼 안쪽으로 돌아온 상태가 「해제 지연」만큼 이어져야 해제된다. 그보다 짧게 돌아왔다 다시 넘으면 같은 알람으로 본다.\n- 이유: 값이 한계값 근처에 머물면 잡음 때문에 알람이 켜졌다 꺼지기를 되풀이한다(깜빡이는 알람). 현업 알람 관리에서는 해제 폭을 먼저 걸고, 그래도 남으면 해제 지연을 건다 [K3].\n- 값(신호 종류별)\n\n| 신호 | 해제 폭 | 해제 지연 | 근거 |\n|---|---|---|---|\n| 유량 | 평소 값의 5% | 15초 | [K3][K4] |\n| 압력 | 평소 값의 2% | 15초 | [K3][K4] |\n| 온도 | 평소 값의 1% | 60초 | [K3][K4] (지연은 권장 30~60초의 위쪽) |\n| 진동·변위·회전수·전류 | 평소 값의 2% | 15초 | 권장표에 없어 팀이 정함 |\n\n- 권장값은 원래 계기 범위의 %다. 우리 기준표에는 계기 범위가 없어 평소 값의 %로 대신했다. 평소 값이 0인 축 위치는 가장 바깥 한계값의 2%다.\n- 통계 알람은 1시간 단위라 이탈이 끝난 첫 시간에 해제한다.\n\n## 6. 결측·품질\n\n- 값의 품질은 GOOD, BAD(센서 이상), MISSING(결측)이다. 판정과 1시간 요약에는 GOOD 값만 쓴다.\n- 한 시간에 GOOD 값이 4분의 3(2,700초)보다 적으면 그 시간 요약은 BAD 또는 MISSING이고 통계 알람 판정에서 빠진다.\n- 데이터가 없는 구간을 이상이라고 말하지 않는다. 「그 시간은 데이터가 없다」고 말한다.\n\n## 7. 관련 문서\n\n- 설비 매뉴얼: MAN-C-2100, MAN-T-2101, MAN-C-2102, MAN-M-2103, MAN-P-2104, MAN-F-1100\n- 윤활유 계통: MAN-LUBE-01\n\n## 근거\n\n| 번호 | 출처 |\n|---|---|\n| 설비조사 n절 | `docs/설비조사_6유형.md`의 그 절(API 670, ISO 20816 2차 자료) |\n| 원심 19, 26, 27, S11 | `docs/원심압축기_해부도.html` 출처 목록과 고장 시나리오 S11(센서 고장) |\n| P22, P23 | Digital Refining(크로스헤드 g), PCB(왕복동 감시) |\n| P40 | Fabrico, ISO 10816-3 진동 등급(25% 변화) |\n| P43, P44, P47, P48, P49, P50 | Rosemount 3144P(NE43), SEL(RTD 오류), Bently Nevada 3300(Not OK 30초), exida(값 고정), Bently Nevada Orbit(부품 섞임 오트립), Control.com 포럼(튐의 모양) |\n| K3, K4 | Bill Hollifield, Taming the wild alarm system 3편(해제 폭·해제 지연, 순서), exida, Why should I use an alarm deadband(EEMUA 191 권장값) |\n"},"CASE":{"CASE-C-2100-20230612":{"fm":{"title":"C-2100 성능 저하와 진동 상승(임펠러 염화암모늄 퇴적)","equipment_ids":"[C-2100]","tag_ids":"[PI-2103, FI-2104, VI-2101X, VI-2101Y, VI-2102X, VI-2102Y]","occurred_at":"2023-06-12 10:00","resolved_at":"2023-10-05 16:00","failure_mode":"CC-FOUL","root_cause":"염화암모늄 퇴적","grade":"이상","cause_class_1":"공정 조건","cause_class_2":"원료 염화물 증가","detected_by":"분기 성능 계산","downtime_h":"0","written_at":"2023-10-20"},"md":"# C-2100 성능 저하와 진동 상승(임펠러 염화암모늄 퇴적)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-C-2100-20230612 |\n| 설비 | C-2100 수첨분해 재순환 가스 압축기 (임펠러·다이어프램 통로) |\n| 발생 | 2023-06-12 10:00 (분기 성능 계산에서 효율 저하를 확인한 시각) |\n| 종료 | 2023-10-05 16:00 (정기 보수 세정 뒤 기동해 성능 회복 확인) |\n| 발견 경위 | 분기 성능 계산 |\n| 사고 등급 | 이상 (계획 정지 때 조치, 비계획 정지 없음) |\n| 정지 시간 | 0시간 (정기 보수 기간에 포함) |\n\n## 1. 현상\n\n- 분기 성능 계산에서 폴리트로픽 효율이 1분기 72%에서 2분기 66%로 내려갔다.\n- 흡입 유량 FI-2104가 120,000 Nm³/h 부근으로 같은데 토출 압력 PI-2103이 3개월에 걸쳐 170에서 164 kg/cm²로 서서히 내려갔다. 경고(161.5 kg/cm²)에는 닿지 않았고, 통계 알람(평균↓)이 07월부터 간간이 울렸다.\n- 축 진동 VI-2101X/Y와 VI-2102X/Y가 같은 기간 25 µm에서 30~31 µm로 서서히 올랐다. 07-28에 네 값이 함께 3 µm 계단처럼 내려갔다가 다시 서서히 올랐다.\n- 베어링 온도와 윤활유 공급 온도는 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 성능 계산 재확인(가스 조성 보정) | 같은 회전수·유량에서 헤드가 설계보다 약 8% 낮다 → 파울링 정의와 맞다 [원심 14] |\n| 2 | 진동 주파수 분석 | 1X가 커짐. 07-28 계단 때 1X 위상이 바뀜 → 퇴적물 일부가 떨어져 나감 |\n| 3 | 공정 부서 확인 | 4월부터 원료의 염화물이 늘었다 |\n| 4 | 정기 보수 개방 점검(09월) | 2·3단 임펠러와 다이어프램 통로에 흰색 퇴적물(최대 약 2 mm)이 고르지 않게 붙어 있었다. 물에 녹았고 분석 결과 염화암모늄이었다 |\n\n## 3. 원인\n\n- **직접 원인:** 재순환 가스 속 염화물과 암모니아가 압축되며 염화암모늄으로 석출해 임펠러와 통로에 쌓였다. 통로가 좁아지고 표면이 거칠어져 헤드가 줄었다. 퇴적물이 고르지 않아 1X 진동이 커졌다 [원심 15].\n- **원인 분류:** 공정 조건 / 원료 염화물 증가.\n- **확정 여부:** 확정(개방 점검과 퇴적물 분석).\n\n## 4. 조치\n\n- 2023-09 정기 보수 때 로터와 다이어프램을 세정했다.\n- 10-05 기동 뒤 효율 71%, 토출 압력 170 kg/cm², 축 진동 25 µm로 돌아왔다.\n\n## 5. 재발 방지\n\n- 성능 계산을 분기 1회에서 월 1회로 바꿨다.\n- 원료 염화물 값을 공정 부서와 매주 공유한다.\n- 토출 압력의 통계 알람(평균↓)을 성능 저하의 첫 신호로 본다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 불균형·러빙 | 진동이 오른다 | 토출 압력이 그대로다 |\n| 서지 | 토출 압력이 바뀐다 | 유량이 먼저 줄고, 압력·유량이 짧게 출렁인다. 몇 달에 걸친 서서히 하강이 아니다 |\n| 저널 베어링 이상, 윤활유 계통 | 진동이 오른다 | 베어링 온도가 함께 오른다 |\n\n## 7. 관련 문서\n\n- MAN-C-2100 6.1절(파울링), 4.2절(성능 계산)\n"},"CASE-C-2100-20240311":{"fm":{"title":"정기 보수 뒤 C-2100·T-2101 커플링 양쪽 진동 상승(정렬 불량)","equipment_ids":"[C-2100, T-2101]","tag_ids":"[VI-2101X, VI-2101Y, VI-2111X, VI-2111Y, VI-2102X, TI-2101]","occurred_at":"2024-03-11 08:00","resolved_at":"2024-03-19 17:00","failure_mode":"CC-MISAL","root_cause":"열 성장을 반영하지 않은 커플링 정렬","grade":"C급","cause_class_1":"정비 작업","cause_class_2":"작업 기준 미흡","detected_by":"기동 후 진동 비교","downtime_h":"50","written_at":"2024-03-28"},"md":"# 정기 보수 뒤 C-2100·T-2101 커플링 양쪽 진동 상승(정렬 불량)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-C-2100-20240311 |\n| 설비 | C-2100 재순환 가스 압축기 구동측, T-2101 구동 증기 터빈 (커플링) |\n| 발생 | 2024-03-11 08:00 (정기 보수 뒤 기동) |\n| 종료 | 2024-03-19 17:00 (재정렬 뒤 기동해 진동 정상 확인) |\n| 발견 경위 | 기동 후 진동 비교(정비 전 값과 비교) |\n| 사고 등급 | C급 (재정렬을 위해 계획 외 정지) |\n| 정지 시간 | 50시간 |\n\n## 1. 현상\n\n- 기동 직후 압축기 구동측 축 진동 VI-2101X가 34 µm, 터빈 축 진동 VI-2111X가 33 µm였다(정비 전 둘 다 25 µm 안팎).\n- 부하를 올리자 두 값이 함께 37~39 µm까지 올라 경고(38 µm)가 여러 번 울렸다. Y 프로브도 같은 모양으로 올랐다.\n- 압축기 반구동측 VI-2102X는 26 µm로 그대로였다.\n- 구동측 베어링 온도 TI-2101은 80 °C에서 84 °C로 조금 올랐다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 커플링 양쪽 진동 비교 | 압축기 구동측과 터빈이 같이 오름. 압축기 반구동측은 그대로 |\n| 2 | 진동 주파수 분석 | 2X 성분이 1X의 약 80%, 축 방향 성분이 큼, 커플링 양쪽 위상차 약 170° → 정렬 불량의 특징 [원심 27] |\n| 3 | 정비 기록 | 정기 보수 때 커플링을 냉간에서 「0」 기준으로 맞췄다. 운전 온도에서 늘어나는 양(열 성장)을 반영한 목표값이 작업 지시에 없었다 |\n| 4 | 운전 중 열간 정렬 확인 | 운전 온도에서 터빈 축이 압축기 축보다 약 0.25 mm 높았다 |\n\n## 3. 원인\n\n- **직접 원인:** 정기 보수 때 열 성장을 반영하지 않고 커플링을 정렬했다. 운전 온도에서 터빈 축이 올라가 두 축이 어긋났다.\n- **원인 분류:** 정비 작업 / 작업 기준 미흡.\n- **확정 여부:** 확정(열간 정렬 측정과 재정렬 뒤 회복).\n\n## 4. 조치\n\n- 03-17 정지해 열 성장을 반영한 냉간 목표값으로 다시 정렬했다.\n- 03-19 기동 뒤 VI-2101X 26 µm, VI-2111X 25 µm, TI-2101 80 °C로 돌아왔다.\n\n## 5. 재발 방지\n\n- 정렬 작업 표준에 설비별 냉간 목표값(열 성장 보정) 표를 넣었다.\n- 정비 뒤 기동하면 24시간 동안 커플링 양쪽 진동을 정비 전 값과 비교한다(MAN-C-2100 4.2절).\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 불균형 | 진동이 오른다 | 한 설비 안에서만 오르고, 1X가 주된 성분이다 |\n| 저널 베어링 이상 | 구동측 진동·온도가 오른다 | 베어링 온도가 먼저 오르고, 터빈 쪽 진동은 그대로다 |\n| 터빈 커플링 풀림·날개 파손 | 터빈 진동이 오른다 | 터빈 진동이 계단처럼 뛰고, 압축기 쪽은 그대로다 |\n\n## 7. 관련 문서\n\n- MAN-C-2100 6.6절(정렬 불량)\n"},"CASE-C-2100-20240826":{"fm":{"title":"C-2100 구동측 저널 베어링 온도 톱니 모양 상승(윤활유 바니시)","equipment_ids":"[C-2100]","tag_ids":"[TI-2101, VI-2101X, VI-2101Y, TI-2102, TI-2108]","occurred_at":"2024-08-26 09:00","resolved_at":"2024-09-24 18:00","failure_mode":"CC-JBRG","root_cause":"윤활유 바니시","grade":"이상","cause_class_1":"윤활 관리","cause_class_2":"윤활유 열화 감시 미흡","detected_by":"교대 순회(베어링 온도 추이)","downtime_h":"0","written_at":"20
