24-10-02"},"md":"# C-2100 구동측 저널 베어링 온도 톱니 모양 상승(윤활유 바니시)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-C-2100-20240826 |\n| 설비 | C-2100 수첨분해 재순환 가스 압축기 (구동측 저널 베어링) |\n| 발생 | 2024-08-26 09:00 (처음 알아챈 시각) |\n| 종료 | 2024-09-24 18:00 (스파이크가 멈추고 평소 값으로 안정) |\n| 발견 경위 | 교대 순회 중 구동측 베어링 온도 추이가 톱니 모양으로 오르내리는 것을 봄 |\n| 사고 등급 | 이상 (정지 없음) |\n| 정지 시간 | 0시간 |\n\n## 1. 현상\n\n- 2024-08-26부터 구동측 베어링 메탈 온도 TI-2101이 1~4시간마다 톱니 모양으로 튀었다.\n  - 5분 안팎에 빠르게 오르고, 30~60분에 걸쳐 천천히 식었다.\n  - 봉우리는 처음에 평소(80 °C)보다 5 °C 높은 85 °C였고, 3주에 걸쳐 커져 9월 중순에는 96 °C까지 튀었다.\n  - 부하를 바꿀 때 특히 크게 튀었다.\n- TI-2101 경고(90 °C)가 09-03에 처음 울렸고, 알람(95 °C)이 09-12에 처음 울렸다. 봉우리마다 울렸다가 식으면 해제됐다.\n- 구동측 축 진동 VI-2101X/Y는 2주에 걸쳐 25 µm에서 29 µm로 조금 올랐다. 스파이크 때 1~2 µm씩 같이 올랐다. 경고(38 µm)에는 닿지 않았고, 통계 알람(평균)만 9월 중순에 울렸다.\n- 반구동측 베어링 온도 TI-2102(80 °C 안팎)와 윤활유 공급 온도 TI-2108(45 °C 안팎)은 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 공급 온도와 반대쪽 베어링 온도 | 그대로 → 윤활유 계통 문제가 아니다(MAN-LUBE-01 6.3절) |\n| 2 | 구동측 진동 주파수 분석 | 1X가 조금 커짐. 0.4~0.5X 성분 없음 → 기름막 불안정·헐거움 쪽이 아니다 |\n| 3 | 윤활유 시료(08-30 채취) | MPC 52(40 넘음), 남은 산화 방지제 31%, 수분·점도 정상 → 바니시가 생겼다 [K1][K2] |\n| 4 | 공급 온도를 2 °C 낮춰 봄(09-02) | 베어링 온도가 오히려 1~2 °C 올랐다. 바니시가 있을 때 보이는 반응이다 [P3] |\n| 5 | 이전 시료 기록 | 분기 측정이라 05월 MPC 27 이후 값이 없었다 |\n\n- 종합 판정: 윤활유 산화로 생긴 바니시가 구동측 베어링 패드에 붙은 것으로 판정했다. 바니시 제거 조치 뒤 스파이크가 멈춰 판정을 확인했다(4절).\n\n## 3. 원인\n\n- **직접 원인:** 윤활유가 산화하며 생긴 바니시(녹지 않는 갈색 찌꺼기 막)가 구동측 베어링 패드 표면에 붙었다. 패드와 축 사이 간극과 열 전달이 나빠져, 부하가 바뀔 때마다 패드 온도가 튀었다 [P1][P2].\n- **원인 분류:** 윤활 관리 / 윤활유 열화 감시 미흡(MPC를 분기마다 재서 05~08월 변화를 놓쳤다).\n- **확정 여부:** 확정. 시료 분석과 제거 조치 뒤의 회복으로 확인했다.\n\n## 4. 조치\n\n| 날짜 | 조치 | 결과 |\n|---|---|---|\n| 09-05 | 정전기식 바니시 제거 장치를 윤활유 탱크에 연결 | 봉우리 높이가 줄기 시작 |\n| 09-14 | 용해성 첨가제 투입 | 몇 시간 안에 스파이크가 거의 멈춤 [P2] |\n| 09-24 | 경과 확인 후 종료 | TI-2101 81 °C 안정, VI-2101X/Y 26 µm, MPC 18 |\n\n- 정화 장치만으로 몇 주에 걸쳐 베어링 온도가 내려간 사례(19일에 121 → 86 °C)와 비슷한 흐름이었다 [P6].\n\n## 5. 재발 방지\n\n- 윤활유 MPC를 분기 1회에서 월 1회로 바꿨다. 40을 넘으면 바니시 제거 장치를 바로 연결한다.\n- 베어링 온도의 톱니 모양(빠르게 튀고 천천히 식음)을 교대 순회 점검 항목에 넣었다(MAN-C-2100 4.1절).\n- 다음 정기 보수 때 구동측 베어링을 분해해 패드 표면을 확인한다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 윤활유 계통(쿨러 성능 저하, 온도 조절 밸브 고착) | 베어링 온도가 오른다 | 공급 온도 TI-2108이 먼저 오르고, 두 베어링(터빈 베어링 포함)이 함께 같은 모양으로 오른다 |\n| 베어링 헐거움·기름막 불안정 | 한 베어링 문제다 | 진동이 먼저 오르고, 0.4~0.5X 성분이 생긴다 |\n| 정렬 불량 | 구동측 진동이 오른다 | 터빈 쪽 진동도 함께 오르고, 베어링 온도의 톱니 모양이 없다 |\n| 센서 고장 | 한 태그만 이상하다 | 몇 초짜리 튐이고, 식는 꼬리가 없다. 진동이 함께 움직이지 않는다 |\n\n## 7. 관련 문서\n\n- MAN-C-2100 6.2절(저널 베어링 이상), 4.2절(윤활유 시료 분석)\n- MAN-LUBE-01 6.3절(베어링이 공급 온도를 얼마나 따라가나)\n"},"CASE-C-2100-20250219":{"fm":{"title":"C-2100 하류 압력 상승으로 운전점이 밀려 일어난 서지","equipment_ids":"[C-2100]","tag_ids":"[PI-2103, FI-2104, ZI-2105A]","occurred_at":"2025-02-19 14:10","resolved_at":"2025-02-20 16:00","failure_mode":"CC-SURGE","root_cause":"하류 열교환기 막힘에 따른 토출 압력 상승","grade":"이상","cause_class_1":"공정 조건","cause_class_2":"하류 설비 막힘","detected_by":"흡입 유량 알람","downtime_h":"0","written_at":"2025-02-27"},"md":"# C-2100 하류 압력 상승으로 운전점이 밀려 일어난 서지\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-C-2100-20250219 |\n| 설비 | C-2100 수첨분해 재순환 가스 압축기 |\n| 발생 | 2025-02-19 14:10 (흡입 유량 경고가 처음 울린 시각) |\n| 종료 | 2025-02-20 16:00 (하류 열교환기 세정 뒤 토출 압력 정상 확인) |\n| 발견 경위 | 흡입 유량 경고·알람 |\n| 사고 등급 | 이상 (정지 없음, 처리량 일시 감축) |\n| 정지 시간 | 0시간 |\n\n## 1. 현상\n\n- 02-17부터 이틀 동안 토출 압력 PI-2103이 170에서 181 kg/cm²로 서서히 올랐다. 흡입 유량 FI-2104는 120,000 Nm³/h 부근으로 그대로였다.\n- 02-19 14:10에 흡입 유량이 101,000 Nm³/h로 떨어지며 경고(96,000 아래)가 울렸다.\n- 14:12~14:40 사이 1초 값에서 흡입 유량과 토출 압력이 20~50초씩 흩어지듯 크게 떨어졌다 돌아오는 구간이 6번 있었다. 그때마다 흡입 유량 알람(84,000 아래)이 울렸다.\n- 같은 구간에 축 위치 ZI-2105A가 ±0.3 mm 튀었다(알람 ±0.5 mm 안).\n- 1시간 요약에서는 흡입 유량과 토출 압력의 표준편차가 커져 통계 알람이 울렸다.\n- 베어링 온도는 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 직전 운전 조작 | 처리량 변경 없음. 토출 압력이 이틀 동안 먼저 올랐다 |\n| 2 | 안티서지 밸브 개도·응답 기록 | 자동으로 2초 안에 열렸다(정상). 하지만 운전점이 이미 제어선에 붙어 있었다 |\n| 3 | 공정 부서 확인 | 반응기 유출물 열교환기의 차압이 1주 동안 꾸준히 올랐다 |\n| 4 | 서지 누적 시간 | 6구간 합계 약 4분 |\n\n## 3. 원인\n\n- **직접 원인:** 반응기 유출물 열교환기가 막혀 하류 압력이 올랐다. 토출 압력이 오르자 같은 회전수에서 유량이 줄어 운전점이 서지선 쪽으로 밀렸다 [원심 12].\n- **원인 분류:** 공정 조건 / 하류 설비 막힘.\n- **확정 여부:** 확정(열교환기 차압 기록과 세정 뒤 회복).\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 02-19 14:40 | 안티서지 밸브를 수동으로 더 열고 처리량을 5% 줄임 | 서지 멈춤 |\n| 02-20 | 열교환기를 우회시키고 세정 | 16:00 토출 압력 170 kg/cm², 흡입 유량 120,000 Nm³/h 회복 |\n\n- 서지 누적 4분은 손상 판단 기준(누적 30분)보다 짧았다 [P14]. 축 위치도 알람 안이었다. 다음 정기 보수 때 스러스트 패드를 확인하기로 했다.\n\n## 5. 재발 방지\n\n- 토출 압력이 서서히 오르는 추세를 매 교대 확인한다. 하류 압력 상승은 서지의 앞선 신호다.\n- 안티서지 화면에 운전점과 제어선 사이 거리를 숫자로 띄웠다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 처리량을 줄이는 중의 서지(안티서지 응답 지연 등) | 유량이 떨어지고 압력·유량이 짧게 출렁인다 | 유량이 먼저 줄고, 토출 압력이 미리 오르지 않는다 |\n| 파울링 | 토출 압력이 바뀐다 | 토출 압력이 몇 달에 걸쳐 서서히 내려가고 출렁임이 없다 |\n| 흡입 유량계 고장 | 유량 값이 떨어진다 | 토출 압력·축 위치가 함께 움직이지 않는다 |\n\n## 7. 관련 문서\n\n- MAN-C-2100 6.4절(서지), 5.3절(흡입 유량·토출 압력)\n"},"CASE-C-2100-20250708":{"fm":{"title":"공용 윤활유 공급 온도 급상승(온도 조절 밸브 우회 쪽 고착)","equipment_ids":"[C-2100, T-2101]","tag_ids":"[TI-2108, TI-2101, TI-2102, TI-2111]","occurred_at":"2025-07-08 10:20","resolved_at":"2025-07-09 11:00","failure_mode":"CC-LUBE","root_cause":"온도 조절 밸브 고착","grade":"이상","cause_class_1":"설비 결함","cause_class_2":"부품 노후","detected_by":"윤활유 공급 온도 경고","downtime_h":"0","written_at":"2025-07-15"},"md":"# 공용 윤활유 공급 온도 급상승(온도 조절 밸브 우회 쪽 고착)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-C-2100-20250708 |\n| 설비 | C-2100·T-2101 공용 윤활유 콘솔 (온도 조절 밸브) |\n| 발생 | 2025-07-08 10:20 (공급 온도가 오르기 시작한 시각) |\n| 종료 | 2025-07-09 11:00 (감온 요소 교체 뒤 자동 제어 복귀) |\n| 발견 경위 | 윤활유 공급 온도 경고 |\n| 사고 등급 | 이상 (정지 없음) |\n| 정지 시간 | 0시간 |\n\n## 1. 현상\n\n- 07-08 10:20부터 윤활유 공급 온도 TI-2108이 45 °C에서 약 3시간 만에 57 °C까지 올랐다. 13:05에 경고(55 °C)가 울렸다.\n- 압축기 구동측 TI-2101, 반구동측 TI-2102, 터빈 베어링 TI-2111이 모두 80 °C 안팎에서 86~87 °C로 같은 모양으로 함께 올랐다. 공급 온도보다 약 30분 늦게 따라갔다.\n- 축 진동은 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 여러 베어링이 함께 오르는지 | 압축기·터빈 베어링 셋이 함께 오름 → 공용 계통 문제(MAN-LUBE-01 5.1절) |\n| 2 | 쿨러 출구 기름 온도와 공급 온도 | 쿨러 출구 41 °C인데 공급 온도 57 °C → 쿨러를 거치지 않은 뜨거운 기름이 많이 섞임 |\n| 3 | 온도 조절 밸브 | 개도가 움직이지 않음. 수동으로 움직여도 반응 없음 → 우회 쪽 고착 |\n| 4 | 냉각수 | 입출구 온도 차 정상 |\n\n## 3. 원인\n\n- **직접 원인:** 온도 조절 밸브의 감온 요소가 우회 쪽에 고착돼, 쿨러를 거치지 않은 기름이 공급 헤더로 많이 갔다 [P8].\n- **원인 분류:** 설비 결함 / 부품 노후(감온 요소가 교체 주기를 넘김).\n- **확정 여부:** 확정(교체한 감온 요소 분해 확인).\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 07-08 13:30 | 수동 우회 밸브로 쿨러 쪽 유량을 늘림 | 14:30 공급 온도 46 °C, 베어링 온도 81 °C |\n| 07-09 09:00 | 감온 요소 교체(수동 운전 유지 중) | 11:00 자동 제어 복귀 |\n\n## 5. 재발 방지\n\n- 감온 요소 교체 주기를 작업 계획에 넣었다.\n- 분기 점검에 온도 조절 밸브 동작 시험을 넣었다(MAN-LUBE-01 4절).\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 쿨러 성능 저하(냉각수 쪽 파울링) | 공급 온도가 먼저 오르고 여러 베어링이 함께 오른다 | 몇 주~몇 달에 걸쳐 서서히 오르고, 온도 조절 밸브가 쿨러 쪽으로 다 열려 있다 |\n| 냉각수 공급 끊김 | 공급 온도가 빠르게 오른다 | 쿨러 냉각수 입출구 온도 차가 사라진다 |\n| 저널 베어링 이상(바니시 등) | 베어링 온도가 오른다 | 공급 온도는 그대로이고 한 베어링만 오른다 |\n\n## 7. 관련 문서\n\n- MAN-LUBE-01 6.2절(온도 조절 밸브 고착), 5.1절(공급 온도)\n- MAN-C-2100 6.3절\n"},"CASE-C-2100-20260114":{"fm":{"title":"트립 뒤 재기동에서 C-2100 진동 서서히 상승(축 열 휨에 따른 러빙)","equipment_ids":"[C-2100]","tag_ids":"[VI-2101X, VI-2101Y, VI-2102X, VI-2102Y, TI-2101, TI-2102]","occurred_at":"2026-01-14 03:40","resolved_at":"2026-01-14 09:00","failure_mode":"CC-UNB","root_cause":"재기동 때 축 열 휨에 따른 러빙","grade":"C급","cause_class_1":"운전 절차","cause_class_2":"재기동 절차 미준수","detected_by":"축 진동 경고","downtime_h":"1","written_at":"2026-01-22"},"md":"# 트립 뒤 재기동에서 C-2100 진동 서서히 상승(축 열 휨에 따른 러빙)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-C-2100-20260114 |\n| 설비 | C-2100 수첨분해 재순환 가스 압축기 (로터·래버린스 씰) |\n| 발생 | 2026-01-14 03:40 (재기동) |\n| 종료 | 2026-01-14 09:00 (진동 안정 확인) |\n| 발견 경위 | 축 진동 경고 |\n| 사고 등급 | C급 (트립 정지 포함) |\n| 정지 시간 | 약 1시간 |\n\n## 1. 현상\n\n- 01-14 02:55에 외부 원인으로 구동 터빈이 트립돼 C-2100이 약 40분 멈췄다. 03:40에 다시 기동했다.\n- 정격 회전수에 닿은 뒤 축 진동 VI-2101X/Y와 VI-2102X/Y가 네 개 모두 40분에 걸쳐 25 µm에서 39~41 µm로 서서히 올랐다. 04:15에 경고(38 µm)가 울렸다.\n- 베어링 온도 TI-2101·TI-2102와 흡입 유량·토출 압력은 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 온도·공정값 | 그대로 → 베어링·윤활·서지가 아니다 |\n| 2 | 진동 주파수 분석 | 고조파 없는 1X가 크고, 1X 위상이 천천히 돌았다 → 러빙의 특징 [원심 28] |\n| 3 | 재기동 기록 | 40분 정지 뒤 슬로 롤(저속 회전) 없이 바로 정격 회전수로 올렸다 |\n| 4 | 센서 | 네 프로브가 함께 같은 모양 → 센서 고장이 아니다 |\n\n## 3. 원인\n\n- **직접 원인:** 짧게 멈춘 사이 축 위아래 온도 차로 축이 조금 휘었고, 그 상태로 정격 회전수까지 올려 단간 래버린스 씰에 닿았다(러빙).\n- **원인 분류:** 운전 절차 / 재기동 절차 미준수.\n- **확정 여부:** 추정. 진동 모양과 재기동 기록으로 판단했다. 다음 정기 보수 때 래버린스 마모를 확인한다.\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 04:20 | 회전수를 낮춰 30분 슬로 롤 | 진동 28 µm로 내려감 |\n| 05:00 | 정격 회전수 복귀 | 06:00 진동 27 µm |\n| 09:00 | 경과 확인 후 종료 | 진동 26 µm 안정 |\n\n## 5. 재발 방지\n\n- 재기동 절차에 정지 시간별 슬로 롤 시간을 적었다.\n- 재기동 뒤 1시간은 진동 추이를 따로 확인한다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 불균형(퇴적물 탈락, 임펠러 손상) | 1X 진동이 오르고 온도·공정값은 그대로다 | 계단처럼 갑자기 바뀌고, 기동과 상관이 없다 |\n| 파울링 | 진동이 오른다 | 몇 주~몇 달에 걸쳐 오르고 토출 압력이 같이 내려간다 |\n| 정렬 불량 | 기동 뒤 진동이 높다 | 커플링 양쪽(터빈 쪽 포함)이 함께 오르고 2X가 크다 |\n\n## 7. 관련 문서\n\n- MAN-C-2100 6.5절(불균형·러빙)\n"},"CASE-C-2102-20230531":{"fm":{"title":"C-2102 1번 피스톤 로드 드롭 서서히 상승(1단 라이더 밴드 마모)","equipment_ids":"[C-2102]","tag_ids":"[ZI-2122V, ZI-2123V, VI-2122V, TI-2122]","occurred_at":"2023-05-31 09:00","resolved_at":"2023-07-20 18:00","failure_mode":"RC-RIDER","root_cause":"실린더 주유 부족에 따른 라이더 밴드 마모","grade":"C급","cause_class_1":"윤활 관리","cause_class_2":"실린더 주유기 점검 미흡","detected_by":"로드 드롭 통계 알람(평균)","downtime_h":"38","written_at":"2023-07-28"},"md":"# C-2102 1번 피스톤 로드 드롭 서서히 상승(1단 라이더 밴드 마모)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-C-2102-20230531 |\n| 설비 | C-2102 수첨분해 보충 수소 압축기 (1번 스로, 1단 실린더) |\n| 발생 | 2023-05-31 09:00 (로드 드롭 통계 알람이 처음 울린 시각) |\n| 종료 | 2023-07-20 18:00 (라이더 밴드 교체 뒤 로드 드롭 안정 확인) |\n| 발견 경위 | 1번 로드 드롭 통계 알람(평균) |\n| 사고 등급 | C급 (계획 정지) |\n| 정지 시간 | 38시간 |\n\n## 1. 현상\n\n- 지난 추이를 보니 05-22쯤부터 1번 피스톤 로드 드롭 ZI-2122V가 평소(450 µm)에서 하루 약 9 µm씩 고르게 올랐다. 보충 수소 압축기 사례의 속도(3개월에 432 → 1,252 µm)와 비슷했다 [왕복 4].\n- 05-31에 1시간 평균이 평소보다 50 µm 넘게 올라 통계 알람(평균)이 처음 울렸다. 작은 변화로 보고 지켜봤다.\n- 06-19 10:00에 경고(700 µm)가 울렸다. 07-11에는 약 940 µm까지 올랐다. 출렁임 없이 고르게 오르는 모양이었다.\n- 2번 로드 드롭 ZI-2123V는 평소(450 µm) 부근 그대로였다.\n- 크로스헤드 가속도 VI-2122V·VI-2123V(1.0 g 부근), 1단 토출 온도 TI-2122(110 °C 부근), 프레임 진동과 메인 베어링 온도는 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 2번 스로 로드 드롭과 비교 | 1번만 오름 → 1번 스로 문제 |\n| 2 | 값 모양 | 하루 약 9 µm씩 고르게 오르고 출렁임이 없음 → 로드 휨이나 센서 문제가 아니다 [왕복 4] |\n| 3 | 크로스헤드 가속도, 토출 온도 | 그대로 → 러닝기어 헐거움이나 밸브·피스톤 링 누설이 아니다 |\n| 4 | 실린더 주유기(06-20) | 1단 실린더로 가는 주유 펌프 한 개의 토출량이 설정보다 적었다. 주유량 점검을 몇 달 동안 기록하지 않았다 |\n| 5 | 알람 도달 예상 | 하루 상승량으로 계산하니 1,000 µm 알람까지 약 1주 → 07-11 계획 정지 |\n| 6 | 분해 점검(07-11) | 1단 라이더 밴드 아래쪽이 많이 닳았다. 남은 바닥 간극이 새 밴드 때의 약 3분의 1이었다. 라이너 아래쪽에 가벼운 긁힘이 있었다 |\n\n- 종합 판정: 1단 라이더 밴드 마모로 피스톤이 내려앉았다. 사례에서도 1,000 µm 경보 때 열어 보니 새 밴드 바닥 간극 2,100 µm 중 630 µm가 남아 있었다 [왕복 4]. 이번 분해 결과도 그와 비슷했다.\n\n## 3. 원인\n\n- **직접 원인:** 1단 라이더 밴드가 닳아 피스톤이 내려앉았다. 그래서 피스톤 로드가 아래로 처져 로드 드롭이 올랐다 [왕복 4][왕복 6].\n- **원인 분류:** 윤활 관리 / 실린더 주유기 점검 미흡. 주유 펌프 한 개의 토출량이 줄어 1단 실린더 윤활이 모자랐다.\n- **확정 여부:** 추정. 라이더 밴드 마모는 분해로 확인했다. 주유 부족이 마모를 앞당겼다는 것은 주유 펌프 상태와 마모 속도로 판단한 추정이다.\n\n## 4. 조치\n\n| 날짜 | 조치 | 결과 |\n|---|---|---|\n| 06-20 | 1단 주유 펌프 토출량을 설정값으로 다시 맞춤 | 로드 드롭 상승 속도는 크게 줄지 않았다(이미 닳은 밴드) |\n| 07-11 06:00 | 처리량을 줄이고 C-2102 계획 정지 | — |\n| 07-11 ~ 07-12 | 1단 라이더 밴드·피스톤 링 교체, 라이너 긁힘 다듬기, 주유 펌프 교체 | — |\n| 07-12 20:00 | 재기동 | ZI-2122V 450 µm 부근으로 돌아옴 |\n| 07-20 | 경과 확인 후 종료 | 로드 드롭 그대로, 크로스헤드·토출 온도 정상 |\n\n## 5. 재발 방지\n\n- 실린더 주유기의 주유량을 매주 확인하고 기록한다(MAN-C-2102 4.1절 현장 점검).\n- 로드 드롭 추이를 월 1회 검토하고, 하루 상승량으로 알람에 닿는 날을 계산해 정지를 계획한다(MAN-C-2102 4.2절).\n- 로드 드롭 통계 알람이 울리면 지켜보기만 하지 않고 주유기와 다른 스로 값을 바로 확인한다.\n- 라이더 밴드를 바꾼 뒤 로드 드롭 값을 새로 기록한다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 피스톤 로드 휨·센서 이상 | 로드 드롭 값이 바뀐다 | 값이 고르게 오르지 않고 출렁인다 [왕복 4]. 로드 길이가 지름의 25배를 넘으면 측정이 맞지 않는다 [왕복 6] |\n| 러닝기어 헐거움 | 한 스로 문제다 | 크로스헤드 가속도가 다른 스로의 2배를 넘는다 [왕복 6]. 로드 드롭 평균은 그대로다 |\n| 피스톤 링 누설 | 실린더 안의 마모다 | 토출 온도가 오르고 크로스헤드 고주파가 회전 내내 커진다 [왕복 1][왕복 3]. 로드 드롭은 그대로다 |\n\n## 7. 관련 문서\n\n- MAN-C-2102 6.2절(라이더 밴드 마모), 5.4절(로드 드롭), 4.2절(정기 점검)\n- MAN-VIB-01 4절(센서 고장 판별)\n"},"CASE-C-2102-20240205":{"fm":{"title":"C-2102 메인 베어링 온도 서서히 상승 뒤 프레임 진동 급변(프레임 윤활유 필터 막힘)","equipment_ids":"[C-2102]","tag_ids":"[TI-2121, VI-2121H, VI-2122V, VI-2123V, PI-2123]","occurred_at":"2024-02-05 10:00","resolved_at":"2024-02-19 16:00","failure_mode":"RC-MAINBRG","root_cause":"프레임 윤활유 필터 막힘","grade":"B급","cause_class_1":"윤활 관리","cause_class_2":"필터 차압 점검 미흡","detected_by":"메인 베어링 온도 통계 알람(평균)","downtime_h":"100","written_at":"2024-02-28"},"md":"# C-2102 메인 베어링 온도 서서히 상승 뒤 프레임 진동 급변(프레임 윤활유 필터 막힘)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-C-2102-20240205 |\n| 설비 | C-2102 수첨분해 보충 수소 압축기 (프레임·메인 베어링) |\n| 발생 | 2024-02-05 10:00 (메인 베어링 온도 통계 알람이 처음 울린 시각) |\n| 종료 | 2024-02-19 16:00 (메인 베어링 교체 뒤 온도·진동 안정 확인) |\n| 발견 경위 | 메인 베어링 온도 통계 알람(평균), 이어서 경고 |\n| 사고 등급 | B급 (예정 외 정지, 베어링 교체) |\n| 정지 시간 | 100시간 |\n\n## 1. 현상\n\n- 지난 추이를 보니 02-01쯤부터 메인 베어링 온도 TI-2121이 평소(80 °C)에서 하루 1 °C 안팎씩 서서히 올랐다.\n- 02-05 10:00에 84 °C를 넘어 통계 알람(평균)이 울렸다. 운전 조건이 바뀐 것으로 보고 지켜봤다.\n- 02-12 07:40에 경고(90 °C)가 울렸다. 02-14 오전에는 93 °C였다.\n- 같은 기간 프레임 진동 VI-2121H는 평소(3.5 mm/s)에서 3.8 mm/s로 아주 조금 올랐다.\n- 02-14 15:20에 프레임 진동이 몇 분 만에 3.8에서 8.6 mm/s로 뛰어 알람(8.0 mm/s)이 울렸다. 같은 때 TI-2121이 97 °C까지 올라 알람(95 °C)이 울렸다. 운전원이 15:45에 수동으로 정지했다(정지 값 12 mm/s 전).\n- 크로스헤드 가속도 VI-2122V·VI-2123V는 진동이 뛰기 전까지 두 스로 모두 1.0 g 부근이었고, 뛴 뒤에도 두 스로가 비슷했다.\n- 단 토출 온도·압력(PI-2123 175 kg/cm² 부근), 로드 드롭은 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 먼저 움직인 태그 | 메인 베어링 온도가 진동보다 약 2주 먼저 올랐다 → 프레임(메인 베어링) 쪽 |\n| 2 | 크로스헤드 가속도, 토출 온도 | 두 스로가 비슷하고 토출 온도는 그대로 → 러닝기어·밸브 쪽이 아니다 |\n| 3 | 부하 | 단 토출 압력 PI-2122, PI-2123과 모터 전류 II-2133이 평소 그대로 → 과부하가 아니다 |\n| 4 | 프레임 윤활유 계통(현장 계기) | 필터 차압이 교체 기준을 넘어 있었다. 메인 베어링 급유 압력이 평소보다 낮았다. 필터 차압 기록은 2주 넘게 비어 있었다 |\n| 5 | 윤활유 시료 | 배빗 성분 금속 입자가 많았다 → 베어링 표면 손상 |\n| 6 | 분해 점검(02-15) | 메인 베어링 하나의 배빗이 일부 녹아 번졌다. 크랭크축 저널에 가벼운 긁힘이 있었다 |\n\n- 종합 판정: 필터가 막혀 메인 베어링으로 가는 기름이 줄었고, 베어링이 손상됐다. 온도가 먼저 서서히 오르고 진동이 뒤에 뛰는 순서가 메인 베어링 손상과 같다 [왕복 1][왕복 2].\n\n## 3. 원인\n\n- **직접 원인:** 프레임 윤활유 필터가 막혀 메인 베어링 급유가 모자랐다. 기름막이 얇아져 베어링 온도가 서서히 오르다가, 배빗이 녹아 번지며 베어링 간극이 바뀌어 프레임 진동이 갑자기 뛰었다 [왕복 2].\n- **원인 분류:** 윤활 관리 / 필터 차압 점검 미흡.\n- **확정 여부:** 확정. 필터 차압 기록, 윤활유 시료, 분해 결과로 확인했다.\n\n## 4. 조치\n\n| 날짜 | 조치 | 결과 |\n|---|---|---|\n| 02-14 15:45 | 수동 정지, 감압·퍼지 | — |\n| 02-15 ~ 02-18 | 손상된 메인 베어링 교체, 크랭크축 저널 연마, 필터 교체, 프레임 윤활유 교체와 크랭크케이스 세정 | — |\n| 02-18 19:45 | 재기동 | TI-2121 81 °C, VI-2121H 3.6 mm/s |\n| 02-19 16:00 | 경과 확인 후 종료 | 온도·진동이 평소 값 부근에서 안정 |\n\n- 온도·진동이 먼저 변했는데 조치하지 않아 충격 트립까지 간 사례 [왕복 1]와 같은 흐름이었다. 이번에는 정지 값 전에 수동으로 멈춰 크랭크축 교체는 피했다.\n\n## 5. 재발 방지\n\n- 프레임 윤활유 필터 차압을 매 교대 현장 점검 항목에 넣고, 교체 기준을 점검표에 적었다(MAN-C-2102 4.1절).\n- 메인 베어링 온도 통계 알람이 울리면 지켜보기만 하지 않고 윤활 계통을 바로 점검한다(MAN-C-2102 5.1절).\n- 프레임 윤활유 시료를 월 1회 분석한다(MAN-C-2102 4.2절).\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 프레임·기초 헐거움 | 프레임 진동이 오른다 | 메인 베어링 온도가 그대로이고, 1X·2X 성분과 프레임 양 끝의 진폭·위상이 바뀐다 [왕복 1][왕복 2] |\n| 러닝기어 헐거움 | 프레임 진동이 오른다 | 한 크로스헤드가 다른 크로스헤드의 2배를 넘고, 메인 베어링 온도는 그대로다 [왕복 6] |\n| 과부하 | 메인 베어링 온도가 오른다 | 단 토출 압력이나 모터 전류 II-2133이 먼저 오른다(추론) |\n| 대형 파손(로드 파단 등) | 프레임 진동이 갑자기 뛴다 | 앞선 온도 상승 없이 뛴다 [왕복 1] |\n| 메인 베어링 온도 센서 고장 | 온도 값이 이상하다 | 몇 초짜리 튐이거나 값이 고정되고, 진동이 따라오지 않는다 |\n\n## 7. 관련 문서\n\n- MAN-C-2102 6.4절(메인 베어링 손상), 5.1절(메인 베어링 온도), 5.2절(프레임 진동), 4.1절\n- MAN-VIB-01 4절(센서 고장 판별)\n"},"CASE-C-2102-20241105":{"fm":{"title":"C-2102 2단 토출 온도 하루 만에 계단 상승(2단 토출 밸브 판 파손)","equipment_ids":"[C-2102]","tag_ids":"[TI-2123, VI-2121H, VI-2123V, PI-2122, TI-2122]","occurred_at":"2024-11-05 14:30","resolved_at":"2024-11-07 10:00","failure_mode":"RC-VALVE","root_cause":"2단 토출 밸브 판 파손","grade":"C급","cause_class_1":"설비 결함","cause_class_2":"밸브 판 피로 파손","detected_by":"2단 토출 온도 경고","downtime_h":"9","written_at":"2024-11-15"},"md":"# C-2102 2단 토출 온도 하루 만에 계단 상승(2단 토출 밸브 판 파손)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-C-2102-20241105 |\n| 설비 | C-2102 수첨분해 보충 수소 압축기 (2번 스로, 2단 실린더 헤드 쪽 토출 밸브) |\n| 발생 | 2024-11-05 14:30 (2단 토출 온도가 오르기 시작한 시각) |\n| 종료 | 2024-11-07 10:00 (밸브 교체 뒤 값 안정 확인) |\n| 발견 경위 | 2단 토출 온도 경고 |\n| 사고 등급 | C급 (정지해 밸브 교체) |\n| 정지 시간 | 9시간 |\n\n## 1. 현상\n\n- 11-05 14:30부터 2단 토출 가스 온도 TI-2123이 평소(110 °C)에서 약 6시간 만에 123 °C로 계단처럼 올랐다. 20:10에 경고(121 °C)가 울렸다. 그 뒤로는 119~124 °C 사이에서 출렁였다.\n- 같은 날 프레임 진동 VI-2121H가 평소(3.5 mm/s)에서 4.6 mm/s로 올랐다. 경고(5.5 mm/s)에는 닿지 않았고 통계 알람(평균)이 울렸다.\n- 2번 크로스헤드 가속도 VI-2123V가 1.0에서 1.3 g로 조금 올랐다. 1번 VI-2122V(1.0 g 부근)의 2배에는 닿지 않았다.\n- 단간 압력 PI-2122가 60에서 61.2 kg/cm²로 조금 올랐다(알람 66 아래). 2단 토출 압력 PI-2123은 175 kg/cm² 부근 그대로였다.\n- 1단 토출 온도 TI-2122(110 °C 부근), 메인 베어링 온도 TI-2121(80 °C 부근), 로드 드롭 ZI-2122V·ZI-2123V(450 µm 부근)는 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 두 단 토출 온도 비교 | 2단만 오름 → 2단 실린더 문제 |\n| 2 | 오른 모양 | 몇 시간 만에 계단처럼 오르고 그 뒤 출렁임 → 판 파손 쪽. 몇 주에 걸쳐 서서히 오르는 누설과 다르다 [P20][P21] |\n| 3 | 단간 냉각기 출구 온도(현장 계기) | 평소와 같음 → 2단 흡입 온도가 오른 탓이 아니다 |\n| 4 | 2단 밸브 커버 온도(11-05 21:00, 휴대용) | 헤드 쪽 토출 밸브 하나가 같은 그룹 평균보다 약 15 °C 높았다 → 그 밸브 [왕복 6] |\n| 5 | 프레임 진동·크로스헤드 | 프레임 진동이 같은 날 함께 올랐다. 근거 사례와 같은 흐름이다 [P20]. 2번 크로스헤드는 1번의 2배 아래 → 러닝기어 쪽이 아니다 |\n| 6 | 분해 점검(11-06) | 판이 두 조각으로 깨져 있었다. 파단면이 피로 파손 모양이었다 |\n\n- 단간 압력이 조금 오른 것은 2단이 빨아들이는 양이 줄어 단간에 가스가 쌓인 것으로 봤다(원리 추론). 단간 압력 방향은 근거가 약해 판단에 쓰지 않았다(MAN-C-2102 5.6절).\n- 종합 판정: 2단 헤드 쪽 토출 밸브 판 파손. 분해로 확정했다.\n\n## 3. 원인\n\n- **직접 원인:** 2단 헤드 쪽 토출 밸브의 판이 피로로 깨졌다. 깨진 틈으로 토출된 뜨거운 가스가 실린더로 되돌아와 다시 압축돼 2단 토출 온도가 계단처럼 올랐다 [왕복 2][P20].\n- **원인 분류:** 설비 결함 / 밸브 판 피로 파손. 판은 교체 주기 안이었다. 판 재질과 부분 부하 운전 시간의 영향을 제조사와 검토하기로 했다.\n- **확정 여부:** 확정(분해 확인).\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 11-06 06:00 | 처리량을 줄이고 C-2102 정지, 감압·퍼지 | — |\n| 11-06 06:00 ~ 14:00 | 깨진 토출 밸브 교체. 판 조각이 실린더 안에 남지 않았는지 확인. 2단의 다른 밸브 점검 | 조각은 밸브 안에 모두 남아 있었다. 다른 밸브는 정상 |\n| 11-06 15:00 | 재기동 | 17:00 TI-2123 111 °C, VI-2121H 3.6 mm/s, VI-2123V 1.0 g, PI-2122 60 kg/cm² |\n| 11-07 10:00 | 경과 확인 후 종료 | 평소 값 부근에서 안정 |\n\n- 밸브를 바꾼 뒤 토출 온도가 평소 값으로 돌아왔다. 근거 사례와 같다 [P20].\n\n## 5. 재발 방지\n\n- 1단·2단 밸브 커버 온도를 월 1회 휴대용으로 재서 같은 그룹 평균과 비교한다(MAN-C-2102 4.2절).\n- 토출 온도가 몇 시간 만에 계단처럼 오르고 프레임 진동이 함께 오르면 판 파손으로 보고 정지를 바로 검토한다(MAN-C-2102 6.1절).\n- 깨진 판을 제조사에 보내 파손 원인을 분석한다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 1단 토출 밸브 누설(서서히) | 토출된 가스가 되돌아와 그 단 토출 온도가 오른다 | **오른 단이 다르다:** 1단 토출 온도 TI-2122가 오른다. **모양이 다르다:** 계단이 아니라 몇 주에 걸쳐 서서히 오른다 [P21]. 프레임 진동이 같은 날 뛰지 않는다. **단간 압력:** 1단 쪽 누설에서 1단 토출 압력이 예측보다 낮았던 사례가 있다 [P21]. 그러나 「1단이 새면 단간 압력↓, 2단 쪽이면 ↑」라는 방향 규칙은 특허 한 건과 원리 추론뿐이라 근거가 약하다(설비조사 1.4절 주의). 단은 토출 온도가 오른 쪽으로 정한다 |\n| 피스톤 링 누설 | 토출 온도가 오른다 | 서서히 오르고, 크로스헤드 고주파가 회전 내내 커진다 [왕복 3]. 밸브 커버 온도 사이에 큰 차이가 없다(추론) |\n| 단간 냉각기 성능 저하 | 2단 토출 온도만 오른다 | 단간 냉각기 출구 온도가 같이 오른다(추론) |\n| 러닝기어 헐거움 | 크로스헤드 가속도와 프레임 진동이 오른다 | 한 크로스헤드가 다른 크로스헤드의 2배를 넘고, 토출 온도는 그대로다 [왕복 6] |\n\n## 7. 관련 문서\n\n- MAN-C-2102 6.1절(토출 밸브 누설·파손), 5.5절(단 토출 가스 온도), 5.6절(단 토출 압력), 4.2절(밸브 커버 온도)\n"},"CASE-C-2102-20250616":{"fm":{"title":"C-2102 2번 크로스헤드 충격 상승(크로스헤드 핀 부싱 마모)","equipment_ids":"[C-2102]","tag_ids":"[VI-2123V, VI-2122V, VI-2121H, ZI-2123V, TI-2123]","occurred_at":"2025-06-16 22:00","resolved_at":"2025-06-19 12:00","failure_mode":"RC-RUN","root_cause":"크로스헤드 핀 부싱 마모","grade":"C급","cause_class_1":"정비 관리","cause_class_2":"러닝기어 간극 점검 누락","detected_by":"크로스헤드 가속도 통계 알람(최대·평균)","downtime_h":"30","written_at":"2025-06-27"},"md":"# C-2102 2번 크로스헤드 충격 상승(크로스헤드 핀 부싱 마모)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-C-2102-20250616 |\n| 설비 | C-2102 수첨분해 보충 수소 압축기 (2번 스로 크로스헤드) |\n| 발생 | 2025-06-16 22:00 (크로스헤드 가속도 통계 알람이 처음 울린 시각) |\n| 종료 | 2025-06-19 12:00 (부싱 교체 뒤 값 안정 확인) |\n| 발견 경위 | 2번 크로스헤드 가속도 통계 알람(최대, 이어서 평균) |\n| 사고 등급 | C급 (정지해 부품 교체) |\n| 정지 시간 | 30시간 |\n\n## 1. 현상\n\n- 지난 1초 값을 보니 06-15 오후부터 2번 크로스헤드 가속도 VI-2123V에 평소(1.0 g)보다 높은 짧은 튐이 섞이기 시작했다. 튐은 끊기지 않고 하루 사이 높이와 횟수가 커졌다.\n- 06-16 22:00 1시간 요약에서 VI-2123V의 최대값이 평소 최대의 2배를 넘어 통계 알람(최대)이 울렸다. 06-17 02:00에는 1시간 평균이 2.1 g로 평소의 2배를 넘어 통계 알람(평균)도 울렸다. 그 시간 최대값은 2.6 g였다.\n- 1번 크로스헤드 가속도 VI-2122V는 1.0 g 부근 그대로였다. 2번이 1번의 2배를 넘었다.\n- 프레임 진동 VI-2121H가 평소(3.5 mm/s)에서 4.1 mm/s로 조금 올랐다(경고 5.5 아래).\n- 2번 로드 드롭 ZI-2123V(450 µm 부근), 토출 온도 TI-2122·TI-2123(110 °C 부근), 메인 베어링 온도 TI-2121은 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 두 스로 크로스헤드 비교 | 2번이 1번의 2배를 넘음 → 2번 스로의 러닝기어 헐거움 또는 액체 유입 [왕복 6] |\n| 2 | 단간 분리기 레벨·배출 기록 | 레벨 정상, 배출 밸브 동작 정상 → 액체 유입 근거가 없다 |\n| 3 | 값 모양 | 튐이 끊기지 않고 하루 사이 계속 커짐. 분리기 레벨 변화나 기동과 상관없음 → 헐거움 쪽. 헐거움은 빨리 진행된다 [P24] |\n| 4 | 센서 | 프레임 진동이 함께 올랐고 가속도계 커넥터 정상 → 센서 문제가 아니다 |\n| 5 | 토출 온도, 로드 드롭 | 그대로 → 밸브·라이더 밴드 쪽이 아니다 |\n| 6 | 분해 점검(06-17) | 2번 크로스헤드 핀 부싱 간극이 허용값을 넘었다. 부싱 안쪽 면이 닳고 변색됐다. 직전 정기 보수에서 이 간극을 재지 않은 것을 확인했다 |\n\n- 평균 2.1 g, 최대 2.6 g는 한 정유 사례의 크로스헤드 셧다운 값(2.0~2.3 g) [P22]과 비슷한 크기라, 06-17 새벽에 정지를 결정했다.\n- 종합 판정: 2번 크로스헤드 핀 부싱 마모로 생긴 헐거움. 분해로 확정했다.\n\n## 3. 원인\n\n- **직접 원인:** 2번 크로스헤드 핀 부싱이 닳아 간극이 커졌다. 피스톤에 걸리는 힘의 방향이 바뀔 때마다 핀과 부싱이 부딪혀 크로스헤드에 충격이 생겼다 [왕복 1][왕복 6].\n- **원인 분류:** 정비 관리 / 러닝기어 간극 점검 누락.\n- **확정 여부:** 확정(분해 확인).\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 06-17 06:00 | 처리량을 줄이고 C-2102 정지, 감압·퍼지 | — |\n| 06-17 ~ 06-18 | 2번 크로스헤드 핀·부싱 교체. 1번 스로 간극도 측정 | 1번은 허용값 안 |\n| 06-18 12:00 | 재기동 | VI-2123V 1.0 g, VI-2121H 3.5 mm/s |\n| 06-19 12:00 | 경과 확인 후 종료 | 두 스로 크로스헤드가 비슷한 값으로 안정 |\n\n- 크로스헤드가 파손된 사례는 첫 진단에서 파손까지 29시간이었다 [P22]. 이번에는 첫 알람에서 8시간 만에 정지했다.\n\n## 5. 재발 방지\n\n- 정기 보수 때 크로스헤드 핀·부싱 간극과 피스톤 너트 조임을 반드시 재고 기록한다(MAN-C-2102 4.2절).\n- 크로스헤드 가속도 통계 알람이 울리면 하루 안에 정지 여부를 정한다(MAN-C-2102 5.3절).\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 액체 유입 | 한 크로스헤드 충격이 튄다 | 튐이 분리기 레벨 상승·배출 이상과 같은 때 나타나고, 사이사이 평소 값으로 돌아온다(추론). 되풀이되면 밸브·피스톤 손상이 쌓인다 [왕복 5] |\n| 토출 밸브 판 파손 | 크로스헤드 가속도와 프레임 진동이 오른다 | 그 단 토출 온도가 같은 날 계단처럼 오른다 [P20] |\n| 메인 베어링 손상 | 프레임 진동이 오른다 | 메인 베어링 온도 TI-2121이 먼저 서서히 오르고, 크로스헤드는 두 스로가 비슷하다 [왕복 1] |\n| 크로스헤드 가속도 센서 고장 | 한 태그만 이상하다 | 몇 초짜리 튐이 몰려 나타나고 프레임 진동이 같이 움직이지 않는다 |\n\n## 7. 관련 문서\n\n- MAN-C-2102 6.3절(러닝기어 헐거움·액체 유입), 5.3절(크로스헤드 가속도), 4.2절(정기 점검)\n- MAN-VIB-01 4절(센서 고장 판별)\n"},"CASE-F-1100-20230904":{"fm":{"title":"F-1100 커플링 쪽 베어링 진동·온도 함께 상승(재윤활 누락에 따른 외륜 박리)","equipment_ids":"[F-1100]","tag_ids":"[VI-1101H, TI-1101, VI-1102H, TI-1102]","occurred_at":"2023-09-04 10:00","resolved_at":"2023-10-06 16:00","failure_mode":"FA-BRG","root_cause":"재윤활 누락에 따른 구름 베어링 외륜 박리","grade":"C급","cause_class_1":"윤활 관리","cause_class_2":"재윤활 주기 누락","detected_by":"통계 알람(VI-1101H 평균↑)","downtime_h":"16","written_at":"2023-10-16"},"md":"# F-1100 커플링 쪽 베어링 진동·온도 함께 상승(재윤활 누락에 따른 외륜 박리)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-F-1100-20230904 |\n| 설비 | F-1100 상압증류 가열로 유인 송풍기 (커플링 쪽 구름 베어링) |\n| 발생 | 2023-09-04 10:00 (VI-1101H 통계 알람이 처음 울린 시각) |\n| 종료 | 2023-10-06 16:00 (베어링 교체 뒤 기동해 진동·온도 정상 확인) |\n| 발견 경위 | 통계 알람(VI-1101H 평균↑) |\n| 사고 등급 | C급 (베어링 교체를 위해 계획 외 정지, 가열로 감발) |\n| 정지 시간 | 16시간 |\n\n## 1. 현상\n\n- 09-04 10:00 커플링 쪽 베어링 진동 VI-1101H의 통계 알람(평균↑)이 처음 울렸다. 1시간 평균이 평소 2.0 mm/s에서 2.7 mm/s가 돼 있었다. 추이를 거슬러 보니 8월 말부터 서서히 오르고 있었다.\n- 같은 쪽 베어링 온도 TI-1101의 하루 평균이 평소 65 °C에서 70 °C로 올라 있었다. 하루 주기(오후에 높고 새벽에 낮음, 약 ±2.4 °C)는 그 위에 그대로 얹혀 있었다. TI-1101 통계 알람(평균↑)은 09-08부터 울렸다.\n- 09-04 ~ 09-25에는 VI-1101H가 2.7에서 3.0 mm/s로, TI-1101 하루 평균이 70 °C에서 74 °C로 서서히 올랐다.\n- 09-26부터 오름이 빨라졌다.\n  - 09-27 VI-1101H가 3.1 mm/s를 넘어 경고가 울렸다. 10-02에는 3.6 mm/s였다.\n  - 10-02 TI-1101 하루 평균이 78 °C가 됐고, 16시께 오후 봉우리가 83 °C로 경고(82 °C)가 울렸다.\n- 반대쪽인 입구 쪽 베어링 진동 VI-1102H는 2.0~2.2 mm/s, 온도 TI-1102는 65 °C 안팎에서 하루 주기만 보였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 반대쪽 베어링과 비교 | 입구 쪽 진동·온도는 그대로 → 커플링 쪽 베어링 한 곳의 문제(MAN-F-1100 6.2절) |\n| 2 | 하루 주기와 비교 | TI-1102는 하루 주기만 보이는데 TI-1101은 하루 주기 위로 하루 평균이 계속 오름 → 주위 온도 영향이 아니다 |\n| 3 | 휴대용 진동 측정(09-06) | 커플링 쪽 포락 가속도가 8월 월 점검 값보다 뚜렷이 높았다. 외륜 결함 주파수와 그 고조파가 보였다. 1X·2X는 평소와 비슷했다 → 외륜 결함 [T8][T9] |\n| 4 | 윤활 이력 | 커플링 쪽 베어링의 재윤활 기록이 5월 이후 없었다. 작업 계획을 바꿀 때 재윤활 작업이 빠졌다 |\n| 5 | 분해 점검(10-05) | 외륜 하중 영역에 박리가 있었다. 윤활제가 굳고 검게 변해 있었다 |\n\n- 종합 판정: 윤활이 모자라 커플링 쪽 베어링 외륜에 박리가 생긴 것으로 판정했다. 분해 점검으로 확인했다(4절).\n\n## 3. 원인\n\n- **직접 원인:** 재윤활이 빠져 커플링 쪽 베어링의 윤활이 모자랐다. 윤활막이 얇아져 외륜 하중 영역에 피로 박리가 생겼다. 박리가 커지며 진동과 마찰열이 함께 늘었다 [T9].\n- **원인 분류:** 윤활 관리 / 재윤활 주기 누락(작업 계획 변경 때 재윤활 작업이 빠졌고, 빠진 것을 알리는 장치가 없었다).\n- **확정 여부:** 확정. 분해 점검으로 확인했다.\n\n## 4. 조치\n\n| 날짜 | 조치 | 결과 |\n|---|---|---|\n| 09-07 | 정해진 양만큼 재윤활(더 넣지 않음 [T9]) | TI-1101이 하루쯤 1~2 °C 내려갔다가 다시 올랐다. 재윤활 직후의 일시 변화라 판단에 쓰지 않았다 [T7] |\n| 09-08 ~ 10-04 | 진동 속도·포락 가속도·온도를 매일 재고 추이를 남김. 예비 베어링과 가열로 감발 일정 준비 | 알람(4.5 mm/s, 90 °C) 아래에서 진행 |\n| 10-05 06:00 | 가열로를 감발하고 F-1100 정지. 커플링 쪽 베어링 교체, 축 정렬 확인 [T9] | 22:00 기동(정지 16시간) |\n| 10-06 16:00 | 경과 확인 후 종료 | VI-1101H 1.9 mm/s, TI-1101 65 °C 안팎에서 하루 주기만 보임 |\n\n## 5. 재발 방지\n\n- 재윤활 작업을 설비별 작업 계획의 고정 항목으로 넣고, 날짜를 넘기면 경고가 뜨게 했다.\n- 월 점검에서 두 베어링의 포락 가속도 추이를 따로 남긴다(MAN-F-1100 4.2절).\n- 베어링 온도는 하루 주기를 빼고 하루 평균과 반대쪽 베어링과의 차이로 본다(MAN-F-1100 5.2절).\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 임펠러 퇴적 불균형 | 진동이 오른다 | 두 베어링 진동이 함께 오르고 베어링 온도는 그대로다. 1X가 주된 성분이다 |\n| 주위 온도(하루 주기) | 베어링 온도가 오르내린다 | 두 베어링이 같은 모양으로 오르내리고 하루 평균은 그대로다 |\n| 과다 윤활 | 베어링 온도가 오른다 | 재윤활 직후에 오르고 진동은 그대로다 [T9] |\n| 고온 가스 누설 | 베어링 온도가 오른다 | 입구 쪽 베어링이 입구 연도가스 온도를 따라 오르고 진동은 그대로다 [T9] |\n| 센서 고장 | 한 베어링만 이상하다 | 진동 한 태그만 튀고 같은 쪽 온도는 그대로다 |\n\n## 7. 관련 문서\n\n- MAN-F-1100 6.2절(구름 베어링 결함), 5.2절(베어링 온도), 4.2절(재윤활, 월 점검)\n- MAN-VIB-01 3절(통계 알람)\n"},"CASE-F-1100-20250428":{"fm":{"title":"정기 보수 물 세정 뒤 F-1100 진동 계단 상승(임펠러 퇴적물 잔류 불균형)","equipment_ids":"[F-1100]","tag_ids":"[VI-1101H, VI-1102H, TI-1101, TI-1102]","occurred_at":"2025-04-28 05:30","resolved_at":"2025-04-30 12:00","failure_mode":"FA-DEPO","root_cause":"물 세정 뒤 퇴적물 잔류 불균형","grade":"C급","cause_class_1":"정비 작업","cause_class_2":"세정 확인 기준 미흡","detected_by":"정비 뒤 기동 진동 비교","downtime_h":"12","written_at":"2025-05-09"},"md":"# 정기 보수 물 세정 뒤 F-1100 진동 계단 상승(임펠러 퇴적물 잔류 불균형)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-F-1100-20250428 |\n| 설비 | F-1100 상압증류 가열로 유인 송풍기 (임펠러) |\n| 발생 | 2025-04-28 05:30 (정기 보수 뒤 기동) |\n| 종료 | 2025-04-30 12:00 (가열로 정상 부하에서 진동 정상 확인) |\n| 발견 경위 | 정비 뒤 기동 진동 비교(보수 전 값과 비교) |\n| 사고 등급 | C급 (다시 세정하려고 계획 외 정지, 가열로 재가동 14시간 지연) |\n| 정지 시간 | 12시간 |\n\n## 1. 현상\n\n- 2025-04 가열로 정기 보수 때 F-1100 임펠러를 고압수로 물 세정했다. 커플링과 베어링에는 손대지 않았다.\n- 04-28 05:30 가열로 재가동 준비로 F-1100을 기동했다. 정격 회전수에 닿자마자 커플링 쪽 진동 VI-1101H가 3.3 mm/s, 입구 쪽 진동 VI-1102H가 3.0 mm/s였다. 보수 전에는 각각 2.1, 2.0 mm/s였다.\n- 05:31 VI-1101H 경고(3.1 mm/s)가 울렸다.\n- 두 값은 기동 순간부터 계단처럼 높았고, 그 뒤 두 시간 동안 거의 그대로였다. 서서히 오르지 않았다.\n- 베어링 온도 TI-1101·TI-1102는 기동 뒤 몇 시간에 걸쳐 평소 값 65 °C 부근까지 올라와 안정됐다. 두 베어링이 같은 모양이었고 보수 전과 같았다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 보수 전후 진동 비교 | 두 베어링이 함께 1 mm/s 남짓 계단처럼 높아짐. 구역 B/C 경계(알람 4.5 mm/s)의 25%를 넘는 의미 있는 변화다 [P40] |\n| 2 | 베어링 온도 | 두 베어링 모두 평소 값, 같은 모양 → 구름 베어링 결함이 아니다(MAN-F-1100 6.2절) |\n| 3 | 휴대용 진동 분석(06:30) | 1X가 주된 성분이고 수평이 수직보다 컸다. 2X·축 방향 성분은 보수 전과 같았고, 베어링 결함 주파수는 없었다 → 불균형이다. 정렬 불량이 아니다 [T8][T9] |\n| 4 | 보수 작업 기록 | 세정은 입구 쪽 점검구에서만 했다. 세정 뒤 날개마다 확인한 기록이 없었다 |\n| 5 | 정지 뒤 점검구 개방(08:00) | 입구 점검구에서 잘 보이지 않는 날개 몇 장의 뒤판 쪽 뿌리에 퇴적물이 두껍게 남아 있었다. 나머지 날개는 깨끗했다 |\n\n- 종합 판정: 세정 뒤 퇴적물이 몇 장의 날개에만 남아 생긴 불균형으로 판정했다. 다시 세정하고 밸런싱한 뒤 회복해 판정을 확인했다(4절).\n\n## 3. 원인\n\n- **직접 원인:** 물 세정에서 일부 날개의 퇴적물이 덜 벗겨져 남았다. 퇴적물이 고르게 남았으면 불균형이 작았겠지만 [T9], 몇 장에만 남아 로터 한쪽이 무거워졌다. 그래서 1X 진동이 커졌다. 작은 질량 차이로도 1X가 크게 바뀐다 [P41].\n- **원인 분류:** 정비 작업 / 세정 확인 기준 미흡(세정 뒤 날개별 확인과 밸런싱 확인 절차가 없었다).\n- **확정 여부:** 확정. 점검구 육안 확인과, 다시 세정한 뒤의 회복으로 확인했다.\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 04-28 07:30 | F-1100 정지, 가열로 재가동 연기 | — |\n| 04-28 08:00 ~ 13:00 | 반대쪽 점검구도 열어 남은 퇴적물을 제거. 날개마다 사진으로 확인 | — |\n| 04-28 14:00 | 시험 기동 | VI-1101H 2.4, VI-1102H 2.2 mm/s. 보수 전보다 아직 조금 높음 |\n| 04-28 15:00 ~ 19:00 | 현장 밸런싱(시험추 1회, 보정추 부착). 세정 뒤 필요하면 밸런싱한다는 기준을 따름 [T9] | — |\n| 04-28 19:30 | 기동, 축 정렬 확인 [T9]. 가열로 재가동 시작 | VI-1101H 2.0, VI-1102H 1.9 mm/s. 정지 12시간, 가열로 재가동은 계획보다 14시간 늦음 |\n| 04-30 12:00 | 가열로 정상 부하에서 경과 확인 후 종료 | VI-1101H 2.0, VI-1102H 1.9 mm/s, TI-1101·TI-1102 65 °C 안팎 |\n\n- 밸런싱으로 진동이 크게 내려간 사례(11 → 1.8 mm/s [P42], 1X 4.4 → 1.2 mils [T12])와 같은 흐름이었다.\n\n## 5. 재발 방지\n\n- 세정 작업 표준에 「양쪽 점검구에서 세정, 날개마다 세정 전후 사진」을 넣었다.\n- 세정 뒤 기동하면 보수 전 진동과 비교하고, 구역 B/C 경계의 25%를 넘는 계단 변화면 [P40] 가열로 점화 전에 세워 확인한다(MAN-F-1100 4.2절).\n- 세정 뒤 밸런싱 확인을 정기 보수 작업 목록에 넣었다 [T9].\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 쌓인 퇴적물의 일부 탈락 | 두 베어링 진동이 함께 계단처럼 뛰고 베어링 온도는 그대로다. 1X가 커진다 | 운전 중에 일어나고, 그 앞 몇 주 동안 두 베어링 진동이 함께 서서히 오른다. 계단 때 1X 위상이 바뀐다. 세정·정비와 상관이 없다 |\n| 정렬 불량(정비 뒤) | 정비 직후부터 진동이 높다 | 2X·축 방향 성분이 크고 베어링이 과열될 수 있다 [T8][T9]. 이번에는 커플링에 손대지 않았고 2X가 그대로였다 |\n| 구름 베어링 결함 | 진동이 오른다 | 한쪽 베어링만 오르고 같은 쪽 온도가 함께 오른다 |\n| 날개 마모·침식 | 1X가 오른다 | 몇 달에 걸쳐 서서히 오르고, 세정해도 돌아오지 않는다 |\n| 센서 고장 | 진동 값이 이상하다 | 한 태그만 움직이고 반대쪽 진동은 그대로다 |\n\n- **세정 잔류와 퇴적물 탈락을 가르는 법:** 둘 다 퇴적물 때문에 로터 한쪽이 무거워진 불균형이다. 크기로는 못 가른다.\n  - 둘 다 계단 크기가 구역 B/C 경계의 25%를 넘을 수 있다 [P40]. 작은 질량 변화로도 1X가 크게 바뀌기 때문이다 [P41].\n  - **시점과 앞선 추이로 가른다.** 퇴적물은 쌓이는 데 시간이 걸린다. 퇴적이 빠른 시멘트 킬른 ID 팬도 1~5주 [P38], 발전소 ID 팬은 1년 단위로 세정한다 [P39]. 그래서 탈락은 몇 주에 걸친 서서히 상승 뒤에 온다. 세정 잔류는 세정 뒤 기동한 순간부터 계단이고, 그 앞에 서서히 상승이 없다.\n  - **조치도 다르다.** 세정 잔류는 남은 퇴적물을 다시 세정하고 밸런싱으로 마무리한다 [T9][P42]. 탈락은 쌓인 퇴적물 전체를 세정하고, 진동 추이를 보고 세정 주기를 정한다.\n\n## 7. 관련 문서\n\n- MAN-F-1100 6.1절(임펠러 퇴적 불균형), 6.3절(정렬 불량), 4.2절(세정·정비 뒤 기동)\n- MAN-VIB-01 2절(주파수 성분)\n"},"CASE-F-1100-20260706":{"fm":{"title":"비 올 때만 F-1100 입구 쪽 진동 값 튐(가속도계 케이블 피복 손상에 따른 간헐 접지)","equipment_ids":"[F-1100]","tag_ids":"[VI-1102H, VI-1101H, TI-1102, TI-1101]","occurred_at":"2026-07-06 14:20","resolved_at":"2026-07-09 17:00","failure_mode":"SENSOR","root_cause":"가속도계 케이블 피복 손상에 따른 간헐 접지","grade":"이상","cause_class_1":"계기 결함","cause_class_2":"고온 구간 케이블 열화","detected_by":"진동 경고(VI-1102H)","downtime_h":"0","written_at":"2026-07-16"},"md":"# 비 올 때만 F-1100 입구 쪽 진동 값 튐(가속도계 케이블 피복 손상에 따른 간헐 접지)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-F-1100-20260706 |\n| 설비 | F-1100 상압증류 가열로 유인 송풍기 (입구 쪽 베어링 진동 가속도계 VI-1102H의 신호 케이블) |\n| 발생 | 2026-07-06 14:20 (값이 튀기 시작한 시각) |\n| 종료 | 2026-07-09 17:00 (케이블 교체 뒤 물 뿌림 시험에서 정상 확인) |\n| 발견 경위 | 진동 경고(VI-1102H) |\n| 사고 등급 | 이상 (정지 없음) |\n| 정지 시간 | 0시간 |\n\n## 1. 현상\n\n- 07-06 14시께 비가 오기 시작한 뒤, 14:20부터 입구 쪽 베어링 진동 VI-1102H가 평소 2.0 mm/s 부근에서 거칠게 흔들렸다.\n  - 몇 초씩 5~8 mm/s로 튀었고, 튐 사이에는 3~4 mm/s에서 들쭉날쭉했다.\n  - 14:31 3.1 mm/s 위에 10초 넘게 머물러 경고가 울렸다.\n  - 튐은 대부분 몇 초라 정지값(7.1 mm/s)을 넘은 순간에도 알람·정지가 되지 않았다(울림 지연 10초, MAN-VIB-01 3.1절).\n  - 감시 계기가 Not OK를 낸 구간이 띄엄띄엄 있었고, 그동안 값의 품질은 BAD로 남았다.\n- 비가 그친 21시께부터 평소 값으로 돌아왔다. 07-07 새벽과 07-08 오후에 비가 올 때 같은 모양이 다시 나왔다. 비가 오지 않은 시간에는 한 번도 나오지 않았다.\n- 비가 온 시간마다 VI-1102H의 통계 알람(최대↑, 표준편차↑)이 울렸다.\n- 같은 시간 커플링 쪽 진동 VI-1101H는 2.0 mm/s 부근 그대로였다. 베어링 온도 TI-1102·TI-1101은 65 °C 안팎에서 하루 주기만 보였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 짝 태그 비교 | VI-1101H와 같은 쪽 온도 TI-1102가 그대로 → 센서 쪽을 먼저 의심(MAN-VIB-01 4.1절) |\n| 2 | 값의 모양 | 하우징 진동이 1초 만에 2에서 8 mm/s로 바뀔 수는 없다. 튐이 비 오는 시간에만 나온다 → 기계가 아니라 계기·배선 쪽 |\n| 3 | 휴대용 측정기로 입구 쪽 베어링 진동 측정(07-06 16:00, 비 오는 중) | 수평 2.0 mm/s, 주파수 성분도 평소와 같음 → 기계는 정상 |\n| 4 | 커넥터·센서 본체 | 커넥터 체결 정상. 센서 본체 출력 정상 |\n| 5 | 케이블 경로 육안 | 입구 덕트 옆 케이블 트레이 구간에서 피복이 열로 굳어 갈라져 있었다. 빗물이 고이는 자리에서 차폐선이 드러나 트레이에 닿아 있었다 |\n| 6 | 케이블 절연 저항(07-07, 계기 정비) | 마른 상태에서는 정상. 갈라진 자리에 물을 뿌리면 심선·차폐선과 접지 사이 절연 저항이 크게 떨어졌다 → 젖을 때만 접지되는 간헐 접지 |\n\n- 종합 판정: 가속도계 케이블 피복 손상으로 비가 올 때만 신호선이 접지되는 계기 고장으로 판정했다. 기계 이상은 없었다.\n\n## 3. 원인\n\n- **직접 원인:** 가속도계 신호 케이블이 뜨거운 입구 덕트 옆을 지나면서 피복이 열로 굳고 갈라졌다. 비가 오면 갈라진 자리로 물이 들어가 차폐선·심선이 접지된 케이블 트레이와 간헐적으로 이어졌다. 그때 접지 쪽 잡음이 신호에 섞여 값이 튀고 들쭉날쭉했다. 신호가 계기의 정상 범위를 벗어난 순간에는 Not OK가 났다. 케이블 결함은 진동 계측에서 알려진 계기 쪽 원인이다 [T4].\n- **원인 분류:** 계기 결함 / 고온 구간 케이블 열화(설치 때 덕트와의 거리와 내열 등급을 확인하지 않았다).\n- **확정 여부:** 확정. 절연 저항 시험과, 케이블 교체 뒤 비 오는 날에도 재발이 없는 것으로 확인했다.\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 07-06 15:00 | VI-1102H 알람을 센서 이상으로 분류하고 기계 이상으로 보고하지 않음. 계기 정비 요청. VI-1101H, TI-1102와 휴대용 측정으로 감시를 이어 감(MAN-VIB-01 4.2절) | 송풍기 운전 그대로 |\n| 07-07 10:00 | 갈라진 구간 임시 방수 처리 | 07-08 오후 비에는 튐이 줄었지만 남음 |\n| 07-09 09:00 ~ 15:00 | 케이블 교체. 덕트 옆 구간은 내열 케이블과 보호관으로 경로를 바꿈. 운전 중 작업 | — |\n| 07-09 17:00 | 물 뿌림 시험 뒤 종료 | 튐 없음. VI-1102H 2.0 mm/s |\n\n- 07-16까지 비가 온 날에도 다시 나오지 않았다.\n\n## 5. 재발 방지\n\n- 고온 덕트 가까이 지나는 계기 케이블을 목록으로 만들고, 장마 전에 피복 상태와 절연 저항을 점검한다.\n- 한 태그만 튀면 그 시간의 날씨(비)와 겹치는지 먼저 본다. 교대 점검 항목에 넣었다.\n- 센서 이상으로 분류한 알람은 계기 정비가 끝날 때까지 짝 태그와 휴대용 측정으로 감시한다(MAN-VIB-01 4.2절).\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 커넥터 접촉 불량 | 한 태그만 몇 초씩 튀고 짝 태그는 그대로다 | 날씨와 상관없이 하루 중 몇 시간씩 몰려 튄다 [P50]. 커넥터를 다시 체결하거나 바꾸면 사라진다. 절연 저항은 정상이다 |\n| 센서 값 고정 | 센서 고장이다 | 값이 한 값에 멈추고 평소의 작은 흔들림이 사라진다. 범위 검사로는 못 잡는다 [P48] |\n| 임펠러 퇴적 불균형(퇴적물 탈락) | 진동이 갑자기 오른다 | 두 베어링 진동이 함께 오르고, 계단 뒤 높은 값이 계속 이어진다. 비와 상관이 없다 |\n| 구름 베어링 결함 | 한쪽 베어링 진동이 오른다 | 같은 쪽 온도가 함께 서서히 오르고, 휴대용 측정에서도 진동이 높다 |\n\n## 7. 관련 문서\n\n- MAN-VIB-01 4절(센서 고장 판별), 6절(결측·품질)\n- MAN-F-1100 6.4절(센서 고장), 5.1절(베어링 진동)\n"},"CASE-M-2103-20230410":{"fm":{"title":"M-2103 구동측 베어링 진동 서서히 상승 뒤 온도 상승(그리스 보충 누락에 따른 외륜 박리)","equipment_ids":"[M-2103]","tag_ids":"[VI-2131H, TI-2131, VI-2132H]","occurred_at":"2023-04-10 08:00","resolved_at":"2023-05-18 17:00","failure_mode":"MO-BRG","root_cause":"그리스 보충 누락","grade":"C급","cause_class_1":"윤활 관리","cause_class_2":"그리스 보충 작업 누락","detected_by":"월 진동 측정(구동측 엔벨로프 상승)","downtime_h":"9","written_at":"2023-05-26"},"md":"# M-2103 구동측 베어링 진동 서서히 상승 뒤 온도 상승(그리스 보충 누락에 따른 외륜 박리)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-M-2103-20230410 |\n| 설비 | M-2103 보충 수소 압축기 구동 모터 (구동측 구름 베어링) |\n| 발생 | 2023-04-10 08:00 (월 진동 측정에서 구동측 엔벨로프 상승을 처음 본 시각) |\n| 종료 | 2023-05-18 17:00 (베어링 교체 뒤 재기동, 진동·온도 정상 확인) |\n| 발견 경위 | 월 진동 측정에서 구동측 고주파 엔벨로프 값이 지난달의 약 3배 |\n| 사고 등급 | C급 (계획 정지 9시간, 유닛 감발 운전) |\n| 정지 시간 | 9시간 |\n\n## 1. 현상\n\n- 04-10 월 진동 측정에서 구동측 베어링의 고주파 엔벨로프 값이 지난달의 약 3배로 올랐다. 이때 구동측 하우징 진동 VI-2131H는 1.6 mm/s로 평소(1.5 mm/s)와 거의 같았다.\n- VI-2131H가 그 뒤 5주에 걸쳐 서서히 올랐다.\n  - 04-24에 1.9 mm/s가 되어 통계 알람(평균↑)이 처음 울렸다.\n  - 05-08에 경고(2.6 mm/s)를 넘었고, 05-17에는 2.9 mm/s였다.\n- 구동측 베어링 온도 TI-2131은 05-08까지 65 °C 안팎으로 그대로였다. 마지막 열흘 동안 72 °C까지 올랐다. 경고(82 °C)에는 닿지 않았다.\n- 반구동측 진동 VI-2132H는 1.5에서 1.7 mm/s로 조금만 올랐다. 구동측 진동이 프레임을 타고 전해진 것으로 봤다.\n- 권선 온도 TI-2133과 모터 전류 II-2133은 평소 값 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 구동측·반구동측 진동 비교 | 구동측만 서서히 오름 → 한쪽 베어링 문제(MAN-M-2103 6.1절) |\n| 2 | 구동측 엔벨로프 스펙트럼(04-10, 04-24, 05-08) | 외륜 결함 주파수와 그 배수가 뚜렷하고 갈수록 커짐 → 외륜 손상. 05-08에는 넓은 대역 잡음이 생김 → 마지막 단계에 가까움 [M18] |\n| 3 | 그리스 보충 기록 | 마지막 보충이 9개월 전. 작업 관리 시스템에서 보충 작업이 다른 작업과 묶였다가 빠졌다 |\n| 4 | 커플링 정렬 기록, C-2102 프레임 진동 VI-2121H | 정렬은 지난 정기 보수 때 기준 안. 압축기 프레임 진동은 평소대로 → 정렬·피동기 쪽이 아니다 |\n| 5 | 교체한 베어링 분해(05-18) | 외륜 궤도면 하중 구역에 길이 약 8 mm 박리. 그리스가 검게 굳어 양이 적었다 |\n\n- 종합 판정: 그리스가 모자라 윤활막이 얇아졌고, 외륜 궤도면이 피로로 박리했다. 분해 결과로 확인했다.\n\n## 3. 원인\n\n- **직접 원인:** 그리스 보충이 9개월 동안 빠져 구동측 베어링 윤활이 모자랐다. 외륜 궤도면 하중 구역이 피로로 박리했고, 진행하며 진동이 오르고 마지막에 온도가 올랐다 [M18].\n- **원인 분류:** 윤활 관리 / 그리스 보충 작업 누락(작업 관리 시스템에서 정기 작업이 빠짐).\n- **확정 여부:** 확정. 엔벨로프 스펙트럼과 분해 점검으로 확인했다.\n\n## 4. 조치\n\n| 날짜 | 조치 | 결과 |\n|---|---|---|\n| 04-11 | 구동측 그리스 보충, 진동 측정을 월 1회에서 주 1회로 바꿈 | 엔벨로프 값이 잠깐 내려갔다가 다시 오름(이미 손상이 시작됨) |\n| 05-08 | 경고를 넘어 정지 계획 수립. 공정과 유닛 감발 일정 협의 | — |\n| 05-18 08:00 ~ 17:00 | C-2102·M-2103 계획 정지. 구동측·반구동측 베어링 모두 교체, 커플링 정렬 확인 | 재기동 뒤 VI-2131H 1.4 mm/s, VI-2132H 1.4 mm/s, TI-2131 64 °C |\n\n- 반구동측 베어링은 진동이 작았지만 같은 보충 누락을 겪었으므로 함께 바꿨다. 분해해 보니 궤도면 변색만 있고 박리는 없었다.\n\n## 5. 재발 방지\n\n- 그리스 보충을 작업 관리 시스템에 단독 정기 작업으로 다시 등록하고, 월말에 빠진 작업을 확인한다.\n- 월 진동 측정에 엔벨로프 값을 계속 넣는다. 지난달보다 2배 넘게 오르면 주 측정으로 바꾼다(MAN-M-2103 4.2절).\n- VI-2131H·VI-2132H의 통계 알람(평균↑)을 베어링 손상의 첫 운전 신호로 본다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 커플링 정렬 불량 | 구동측 진동이 오른다 | 정비 직후부터 높거나 계단처럼 뛴다. 커플링 건너편 압축기 쪽 진동도 함께 오르고 2X·축방향 성분이 크다 |\n| 외부 냉각 팬 손상 | 한쪽(반구동측) 진동이 오른다 | 진동이 한 번에 계단처럼 뛰고, 권선 온도가 몇 시간에 걸쳐 함께 오른다 |\n| 냉각 불량 | 베어링 온도가 조금 오를 수 있다 | 권선 온도가 먼저 오르고 진동은 그대로다 |\n| 전기 쪽 진동(에어갭 편심·소프트 풋) | 하우징 진동이 높다 | 전원 주파수의 2배 성분이고, 전원을 끊는 순간 바로 사라진다 [M32] |\n| 센서 고장 | 한 태그만 이상하다 | 몇 초짜리 튐이거나 값이 고정되고, 엔벨로프·온도가 함께 움직이지 않는다 |\n\n## 7. 관련 문서\n\n- MAN-M-2103 6.1절(구름 베어링 손상), 5.3절(베어링 진동), 4.2절(월 진동 측정·그리스 보충)\n- MAN-VIB-01 3.2절(통계 알람)\n"},"CASE-M-2103-20231120":{"fm":{"title":"M-2103 모터 전류 맥동(잦은 직입 기동에 따른 회전자 바 균열)","equipment_ids":"[M-2103]","tag_ids":"[II-2133, TI-2133, VI-2131H, VI-2132H]","occurred_at":"2023-11-20 10:00","resolved_at":"2024-03-11 15:00","failure_mode":"MO-ROTOR","root_cause":"잦은 직입 기동","grade":"이상","cause_class_1":"운전 관리","cause_class_2":"기동 횟수 관리 미흡","detected_by":"모터 전류 통계 알람(표준편차)과 현장 맥동음","downtime_h":"0","written_at":"2024-03-20"},"md":"# M-2103 모터 전류 맥동(잦은 직입 기동에 따른 회전자 바 균열)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-M-2103-20231120 |\n| 설비 | M-2103 보충 수소 압축기 구동 모터 (회전자) |\n| 발생 | 2023-11-20 10:00 (전류 통계 알람이 처음 울린 시각) |\n| 종료 | 2024-03-11 15:00 (정기 보수에서 회전자 수리 뒤 재기동, 맥동 사라짐 확인) |\n| 발견 경위 | 모터 전류 통계 알람(표준편차), 순회 중 「그르렁」 하는 맥동음 |\n| 사고 등급 | 이상 (정기 보수 때 조치, 비계획 정지 없음) |\n| 정지 시간 | 0시간 (정기 보수 기간에 포함) |\n\n## 1. 현상\n\n- 11-20부터 모터 전류 II-2133의 1초 값이 평소보다 크게 흩어지듯 출렁였다.\n  - 평소에는 46 A를 중심으로 좁게 움직였는데, 이때부터 ±1.5 A 안팎으로 출렁였다.\n  - 전류 평균은 46 A 그대로였다. 한계값(경고 54 A)과는 거리가 멀었다.\n  - 1시간 요약의 표준편차가 커져 통계 알람(표준편차)이 하루 몇 번씩 울렸고, 12월부터는 거의 매 시간 울렸다.\n- 순회 운전원이 모터 쪽에서 몇 초 주기로 커졌다 작아지는 「그르렁」 소리를 들었다. 현장 전류계 바늘도 같은 주기로 흔들렸다.\n- 권선 온도 TI-2133은 하루 ±4 K 안팎의 평소 오르내림 그대로였다. 평균은 1 °C 남짓 높았을 뿐이다.\n- 하우징 진동 VI-2131H, VI-2132H의 전체 값은 1.5~1.6 mm/s로 거의 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 전류 평균과 권선 온도 | 그대로 → 과부하·냉각 불량이 아니다. 전류만 맥동한다(MAN-M-2103 6.4절) |\n| 2 | 전류 스펙트럼 분석(MCSA, 11-22) | 전원 주파수 양옆 (1±2s)f 측파대가 기본파보다 41 dB 낮음. 45 dB 이내라 회전자 바 파단 표시다 [M31] |\n| 3 | 측파대 간격 확인 | 간격이 슬립 주파수의 2배로, 회전수의 배수가 아니다 → 왕복동 압축기의 부하 토크 출렁임이 아니다 |\n| 4 | 진동 스펙트럼 | 1X 양옆에 극 통과 주파수 간격의 측파대가 생김 [M32] |\n| 5 | 기동 기록 | 2023년 한 해 직입 기동이 34회였다. 그 전 해들은 10회 안팎이었다. 상반기 공정 조정과 정비로 정지·재기동이 잦았다 |\n| 6 | 측파대 추이(월 1회, 기본파 대비) | 12월 −39 dB, 1월 −38 dB, 2월 −37 dB로 서서히 커짐 |\n| 7 | 정기 보수 때 회전자 점검(2024-03) | 구리 바 3개가 단락환 접합부에서 갈라져 있었다. 접합부 주변에 열 변색 |\n\n- 종합 판정: 잦은 직입 기동 때마다 큰 기동 전류와 열 응력이 바·단락환 접합부에 쌓여 바가 갈라졌다. 분해 점검으로 확인했다.\n\n## 3. 원인\n\n- **직접 원인:** 2023년에 직입 기동이 크게 늘어 기동 때의 열 응력과 원심력이 구리 바와 단락환 접합부에 되풀이해 걸렸다. 접합부가 피로로 갈라져 바 3개가 끊겼다. 끊긴 바 때문에 회전자 자계가 고르지 않아 전류가 맥동했다 [M31][M32].\n- **원인 분류:** 운전 관리 / 기동 횟수 관리 미흡(제조사 허용 기동 횟수를 기록·관리하지 않았다).\n- **확정 여부:** 확정. 전류 스펙트럼과 회전자 분해 점검으로 확인했다.\n\n## 4. 조치\n\n| 날짜 | 조치 | 결과 |\n|---|---|---|\n| 11-22 | 전류 스펙트럼 측정을 분기 1회에서 월 1회로 바꿈. 불필요한 정지·재기동을 하지 않도록 운전 지시 | 측파대가 천천히 커졌지만 운전 가능 범위로 판단 |\n| 12월 ~ 2월 | 정기 보수 때 회전자 수리 준비(예비 회전자 확보, 모터 정비업체 일정) | — |\n| 2024-02 ~ 03 정기 보수 | 회전자를 빼서 예비 회전자로 바꾸고, 빼낸 회전자는 바를 새로 끼워 예비품으로 둠 | — |\n| 2024-03-11 | 재기동 | II-2133 1초 값 출렁임이 평소 수준, 통계 알람 해제. 측파대는 기본파 대비 −58 dB |\n\n## 5. 재발 방지\n\n- 모터 기동 횟수와 간격을 기동 때마다 기록하고, 제조사 허용 횟수(냉간·열간 기동)를 넘지 않게 운전 절차에 넣었다(MAN-M-2103 4.2절).\n- 전류 스펙트럼 분석은 분기 1회를 유지하고, 측파대가 기본파보다 50 dB 이내로 올라오면 월 1회로 바꾼다(팀 기준).\n- 전류의 통계 알람(표준편차)을 회전자 이상의 첫 운전 신호로 본다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 왕복동 부하의 토크 출렁임 | 전류가 주기적으로 출렁인다 | 정상 구간부터 원래 있고 커지지 않는다. 측파대 간격이 회전수의 배수다 |\n| 공급 전압 출렁임 | 전류가 출렁인다 | 같은 모선의 다른 모터 전류도 함께 출렁이고, 모선 전압 기록에 변화가 있다 |\n| 과부하 | 전류가 바뀐다 | 전류 평균이 올라가고 권선 온도가 뒤따라 오른다 |\n| 전류 변환기·배선 이상 | 전류 값이 흔들린다 | 현장 소리와 진동 측파대가 없다. 계전기의 3상 값과 어긋난다(MAN-VIB-01 4절) |\n\n## 7. 관련 문서\n\n- MAN-M-2103 6.4절(회전자 바 균열), 5.2절(모터 전류), 4.2절(전류 스펙트럼 분석·기동 기록)\n- MAN-VIB-01 3.2절(통계 알람 표준편차)\n"},"CASE-M-2103-20240709":{"fm":{"title":"변압기 한 대 운전 중 M-2103 전류 계단 상승과 권선 온도 상승(공급 전압 저하)","equipment_ids":"[M-2103]","tag_ids":"[II-2133, TI-2133]","occurred_at":"2024-07-09 09:32","resolved_at":"2024-07-09 19:10","failure_mode":"MO-OVLD","root_cause":"공급 전압 저하","grade":"이상","cause_class_1":"전기 설비","cause_class_2":"변압기 탭 절환 제어기 고장","detected_by":"모터 전류 통계 알람(평균), 변전실 모선 저전압 경고","downtime_h":"0","written_at":"2024-07-16"},"md":"# 변압기 한 대 운전 중 M-2103 전류 계단 상승과 권선 온도 상승(공급 전압 저하)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-M-2103-20240709 |\n| 설비 | M-2103 보충 수소 압축기 구동 모터 (고정자 권선, 6.6 kV 공급 모선) |\n| 발생 | 2024-07-09 09:32 (모선을 변압기 한 대로 돌린 시각) |\n| 종료 | 2024-07-09 19:10 (탭 절환 제어기 수리 뒤 자동 전압 조정 복귀) |\n| 발견 경위 | 모터 전류 통계 알람(평균↑), 변전실 모선 저전압 경고 |\n| 사고 등급 | 이상 (정지 없음) |\n| 정지 시간 | 0시간 |\n\n## 1. 현상\n\n- 09:32에 모터 전류 II-2133이 46 A에서 49 A로 몇 초 만에 계단처럼 올랐다. 그 뒤 49 A 안팎에서 머물렀다. 경고(54 A)에는 닿지 않았다.\n- 권선 온도 TI-2133이 전류를 늦게 따라 올랐다. 107 °C에서 2시간 남짓에 걸쳐 116 °C 안팎까지 오르고 멈췄다. 경고(130 °C)에는 닿지 않았다.\n- 10시 요약에서 전류 통계 알람(평균↑), 11시 요약에서 권선 온도 통계 알람(평균↑)이 울렸다.\n- 같은 시각 변전실에서 6.6 kV 모선 저전압 경고가 울렸다.\n- 하우징 진동 VI-2131H, VI-2132H와 구동측 베어링 온도 TI-2131은 그대로였다.\n- C-2102의 단 토출 압력·온도와 프레임 진동도 평소대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 전류와 권선 온도의 순서 | 전류가 먼저 계단처럼 오르고 권선 온도가 뒤따름 → 과부하 쪽(MAN-M-2103 6.3절) |\n| 2 | C-2102 운전 기록(보충 수소 유량, 스필백 밸브 개도, 흡입·토출 압력) | 09:00 전후로 바뀐 것이 없다 → 피동기 부하가 늘지 않았다 |\n| 3 | 같은 모선의 다른 모터 전류 | 같은 시각에 함께 5~7% 올랐다 → 전원 쪽 원인 |\n| 4 | 모선 전압, 3상 전압 불평형 | 6.6 kV에서 6.2 kV로 약 6% 낮음. 불평형은 0.4%로 권장(1% 이하) 안 [M30] → 불평형이 아니라 전압 저하 |\n| 5 | 변전실 작업 기록, 2번 변압기 탭 위치 | 09:30에 정비를 위해 1번 변압기를 빼고 모선을 2번 변압기 한 대로 돌렸다. 2번 변압기의 탭이 낮은 쪽에 멈춰 있었고, 자동 탭 절환 제어기의 출력 카드가 고장 나 있었다 |\n\n- 종합 판정: 변압기 한 대로 모선을 돌리며 전압이 내려갔는데, 탭 절환 제어기가 고장 나 전압을 다시 올리지 못했다. 모터는 같은 부하를 내려고 전류를 더 끌었고, 권선 온도가 따라 올랐다.\n\n## 3. 원인\n\n- **직접 원인:** 공급 모선 전압이 약 6% 낮게 유지됐다. 압축기 부하가 그대로라 모터가 같은 출력을 내려고 전류를 더 끌었다(출력이 전압과 전류의 곱에 비례한다는 원리에서 나온 판단). 권선 온도 상승분은 전류의 제곱에 비례해 커졌다 [P28].\n- **원인 분류:** 전기 설비 / 변압기 탭 절환 제어기 고장(출력 카드 불량). 변압기 한 대 운전으로 바꾸는 절차에 모선 전압 확인이 없었다.\n- **확정 여부:** 확정. 탭을 수동으로 올리자 전류가 바로 평소 값으로 돌아왔다.\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 11:30 | 원인 확인. 전기 담당에 알림 | — |\n| 12:10 | 2번 변압기 탭을 수동으로 올림 | 모선 6.55 kV. II-2133 46 A로 바로 돌아옴 |\n| 12:10 ~ 14:30 | 권선 온도 추이 확인 | TI-2133 2시간 남짓에 걸쳐 109 °C로 내려옴(오후 주위 온도가 높아 평소보다 조금 높음) |\n| 16:00 ~ 19:10 | 탭 절환 제어기 출력 카드 교체, 자동 조정 시험 | 19:10 자동 전압 조정 복귀 |\n\n- 권선 온도는 전류가 돌아온 뒤에도 열 시상수만큼 늦게 내려왔다. 시상수의 3배쯤 지나 거의 다 내려왔다 [P30].\n\n## 5. 재발 방지\n\n- 변압기 한 대 운전으로 바꿀 때 모선 전압과 탭 위치를 확인하는 단계를 전기 작업 절차에 넣었다.\n- 변전실 모선 저전압 경고를 운전실에도 함께 띄우도록 바꿨다. 모터 전류 통계 알람이 울리면 운전원이 모선 전압을 먼저 본다(MAN-M-2103 5.2절).\n- 탭 절환 제어기를 연 1회 기능 시험 항목에 넣었다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 피동기 부하 증가(공정 조건 변화로 압축기 부하가 늘어남) | 전류가 먼저 오르고 권선 온도가 뒤따른다 | 모선 전압이 정상이고 이 모터만 오른다. 보충 수소 요구량·스필백 밸브 개도 같은 압축기 운전 기록이 함께 바뀐다. 공정 조작을 따라 몇 분~몇 십 분에 걸쳐 오른다 |\n| 전압 불평형 | 전류와 권선 온도가 오른다 | 3상 전류가 고르지 않다. 전류 불평형이 전압 불평형의 6~10배다 [M30] |\n| 냉각 불량 | 권선 온도가 오른다 | 전류가 그대로다 |\n| 회전자 바 균열 | 전류가 바뀐다 | 전류 평균은 그대로이고 출렁임만 커진다 |\n| 피동기 기계 문제(압축기 메인 베어링 손상 등) | 전류가 오른다 | 압축기 메인 베어링 온도 TI-2121이나 프레임 진동 VI-2121H가 먼저 움직인다 |\n\n## 7. 관련 문서\n\n- MAN-M-2103 6.3절(과부하), 5.2절(모터 전류), 5.1절(권선 온도)\n"},"CASE-M-2103-20250812":{"fm":{"title":"M-2103 반구동측 진동 계단 변화와 권선 온도 몇 시간 상승(외부 냉각 팬 날개 파손)","equipment_ids":"[M-2103]","tag_ids":"[TI-2133, II-2133, VI-2132H, VI-2131H, TI-2131]","occurred_at":"2025-08-12 14:20","resolved_at":"2025-08-13 16:00","failure_mode":"MO-COOL","root_cause":"외부 냉각 팬 날개 파손","grade":"C급","cause_class_1":"설비 결함","cause_class_2":"부품 노후(팬 날개 피로 균열)","detected_by":"반구동측 진동 통계 알람, 순회 중 팬 커버 쪽 이상음","downtime_h":"4","written_at":"2025-08-21"},"md":"# M-2103 반구동측 진동 계단 변화와 권선 온도 몇 시간 상승(외부 냉각 팬 날개 파손)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-M-2103-20250812 |\n| 설비 | M-2103 보충 수소 압축기 구동 모터 (외부 냉각 팬, 고정자 권선) |\n| 발생 | 2025-08-12 14:20 (반구동측 진동이 계단처럼 뛴 시각) |\n| 종료 | 2025-08-13 16:00 (팬 교체 뒤 재기동, 권선 온도·진동 정상 확인) |\n| 발견 경위 | 반구동측 진동 통계 알람(평균↑·최대↑), 순회 중 팬 커버 안에서 덜컹거리는 소리 |\n| 사고 등급 | C급 (계획 정지 4시간, 유닛 감발 운전) |\n| 정지 시간 | 4시간 |\n\n## 1. 현상\n\n- 14:20에 반구동측 하우징 진동 VI-2132H가 1.5 mm/s에서 2.1 mm/s로 한 번에 계단처럼 뛰고, 그 뒤 그 값에 머물렀다. 경고(2.6 mm/s)에는 닿지 않았다. 구동측 VI-2131H는 1.5에서 1.6 mm/s로 조금만 변했다.\n- 같은 시각부터 권선 온도 TI-2133이 올랐다.\n  - 110 °C(여름 오후라 평소보다 조금 높음)에서 약 3시간에 걸쳐 126 °C까지 오르고 멈췄다. 처음에 빠르고 갈수록 느려지는 모양이었다.\n  - 경고(130 °C)에는 닿지 않았다. 밤에는 주위 온도를 따라 122 °C 안팎으로 내려갔다.\n- 모터 전류 II-2133은 46 A 그대로였다.\n- 구동측 베어링 온도 TI-2131이 65 °C에서 68 °C로 조금 따라 올랐다. 프레임 전체가 뜨거워진 탓으로 봤다.\n- 15시 요약에서 VI-2132H 통계 알람(평균↑·최대↑), 16시 요약에서 TI-2133 통계 알람(평균↑)이 울렸다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 전류와 권선 온도 | 전류는 그대로인데 권선 온도만 오름 → 냉각 불량 쪽(MAN-M-2103 6.2절) |\n| 2 | 권선 온도와 주위 온도의 차이 | 주위 온도는 33 °C 안팎으로 그대로였는데 권선 온도가 16 K 올라 차이가 그만큼 커짐 → 주위 온도 탓이 아니다 [P27] |\n| 3 | 모터 보호 계전기의 권선 RTD 6개 | 6개가 함께 비슷하게 오름 → 모터 전체 냉각 문제. 한 RTD 고장이 아니다 |\n| 4 | 반구동측 진동 스펙트럼 | 1X가 커짐. 14:20 한 번 바뀐 뒤 그대로 → 회전체 질량이 한 번에 바뀜(팬 쪽 불균형) |\n| 5 | 현장 | 팬 커버 출구 바람이 둘레 일부에서 약하고, 커버 안에서 덜컹 소리. 흡입 필터는 깨끗했다 |\n| 6 | 정지 뒤 팬 커버 개방(08-13) | 외부 팬 날개 10장 중 2장이 뿌리에서 부러져 커버 안에 걸려 있었다. 부러진 면에 피로 균열이 자란 줄무늬가 있었다 |\n\n- 종합 판정: 외부 냉각 팬 날개가 피로로 부러져 냉각 공기가 한 번에 줄었다. 권선 온도는 열 시상수만큼 늦게 새 값까지 올랐다.\n\n## 3. 원인\n\n- **직접 원인:** 외부 냉각 팬 날개 뿌리에 피로 균열이 자라 날개 2장이 떨어졌다.\n  - 냉각 공기가 한 번에 줄어 권선 온도가 16 K 올랐다. 냉각을 고쳐 권선 온도를 11~22 K 낮춰야 했던 사례와 같은 크기다 [P26].\n  - 냉각이 한 번에 바뀌어도 권선 온도는 열 시상수만큼 늦게 따라가, 시상수의 3배쯤 지나 거의 새 값에 닿는다 [P28][P30]. 그래서 몇 시간에 걸쳐 오르고 멈췄다.\n  - 팬 질량이 고르지 않게 돼 팬이 달린 반구동측 진동이 계단처럼 올랐다.\n- **원인 분류:** 설비 결함 / 부품 노후(팬 날개 피로 균열). 팬 날개는 정기 점검 항목에 없었다.\n- **확정 여부:** 확정. 부러진 날개와 파면으로 확인했다.\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 08-12 15:20 | 현장 확인 뒤 30분마다 권선 온도·진동 감시. 경고 아래라 다음 날 아침 계획 정지로 결정, 공정과 유닛 감발 협의 | 밤새 TI-2133 122~126 °C, VI-2132H 2.1 mm/s 유지 |\n| 08-13 08:00 ~ 12:00 | C-2102·M-2103 계획 정지. 예비 외부 팬으로 교체, 팬 커버 안쪽과 핀 손상 확인 | 핀과 커버 손상 없음 |\n| 08-13 12:00 ~ 16:00 | 재기동 뒤 추이 확인 | 16:00 TI-2133 110 °C(오후), VI-2132H 1.5 mm/s, II-2133 46 A |\n\n## 5. 재발 방지\n\n- 정기 보수 때 팬 커버를 열어 외부 팬 날개 뿌리의 균열을 침투 탐상으로 점검하는 항목을 넣었다(MAN-M-2103 4.2절).\n- 예비 외부 팬을 늘 한 개 둔다.\n- 반구동측 진동이 계단처럼 뛰면 팬 쪽을 먼저 본다(MAN-M-2103 5.3절).\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 냉각 공기 흡입 필터 막힘·핀 먼지 | 전류는 그대로인데 권선 온도가 오른다. RTD가 함께 오른다 | 며칠~몇 주에 걸쳐 서서히 오른다. 몇 시간 만에 오르고 멈추지 않는다. 진동은 그대로이고, 필터 표면이 덮여 있다 |\n| 주위 온도 상승 | 권선 온도가 오른다 | 권선 온도와 주위 온도의 차이가 그대로다 [P27] |\n| 과부하 | 권선 온도가 몇 시간에 걸쳐 오른다 | 전류가 먼저 오른다 |\n| 구름 베어링 손상 | 한쪽 베어링 진동이 오른다 | 진동이 몇 주에 걸쳐 서서히 오르고, 권선 온도는 그대로다 |\n| 커플링·정렬 문제 | 진동이 계단처럼 뛸 수 있다 | 구동측과 압축기 쪽 진동이 오르고, 권선 온도는 그대로다 |\n\n## 7. 관련 문서\n\n- MAN-M-2103 6.2절(냉각 불량), 5.1절(권선 온도), 5.3절(베어링 진동)\n"},"CASE-P-2104-20230508":{"fm":{"title":"P-2104 같은 유량에서 토출 압력 서서히 하강(웨어링 마모)","equipment_ids":"[P-2104]","tag_ids":"[PI-2144, FI-2144, PI-2143]","occurred_at":"2023-05-08 09:00","resolved_at":"2023-10-06 14:00","failure_mode":"PU-IMPW","root_cause":"웨어링 마모로 내부 재순환 증가","grade":"이상","cause_class_1":"설비 결함","cause_class_2":"경년 마모","detected_by":"토출 압력 통계 알람(평균↓)과 성능 추이 확인","downtime_h":"0","written_at":"2023-10-18"},"md":"# P-2104 같은 유량에서 토출 압력 서서히 하강(웨어링 마모)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-P-2104-20230508 |\n| 설비 | P-2104 수첨분해 반응기 공급 펌프 (임펠러·웨어링) |\n| 발생 | 2023-05-08 09:00 (성능 추이에서 토출 압력 하강을 확인한 시각) |\n| 종료 | 2023-10-06 14:00 (정기 보수 뒤 원료 투입, 성능 회복 확인) |\n| 발견 경위 | 토출 압력 통계 알람(평균↓)이 간간이 울려 성능 추이를 확인 |\n| 사고 등급 | 이상 (계획 정지 때 조치, 비계획 정지 없음) |\n| 정지 시간 | 0시간 (정기 보수 기간에 포함) |\n\n## 1. 현상\n\n- 04월 말부터 토출 압력 PI-2144의 통계 알람(평균↓)이 간간이 울렸다.\n- 05-08에 같은 유량끼리 비교했다. 토출 유량 FI-2144가 300 m³/h로 같은데, PI-2144가 01월 180 kg/cm²에서 05월 175 kg/cm²로 내려가 있었다.\n- 그 뒤에도 같은 기울기로 내려가 08월 말 172 kg/cm²가 됐다. 경고(171 kg/cm²)에는 닿지 않았다.\n- 같은 기간 유량 조절 밸브 개도가 58%에서 71%로 커졌다. 유량은 300 m³/h 그대로였다.\n- 같은 유량에서 모터 전류(현장 MCC)가 01월보다 약 4% 높았다.\n- 흡입 압력 PI-2143(5.0 kg/cm² 안팎), 축 진동 VI-2141X/Y(25 µm 안팎), 베어링 온도 TI-2141(80 °C 안팎)은 그대로였다. 압력·유량의 출렁임도 없었다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 흡입 압력과 현장 스트레이너 차압 | 그대로 → 흡입 쪽(캐비테이션) 문제가 아니다 |\n| 2 | 현장 토출 압력계와 PI-2144 비교 | 차이 0.5 kg/cm² 안 → 압력 전송기 고장이 아니다 |\n| 3 | 같은 유량의 양정·효율 계산(06월) | 양정이 시운전 성능 곡선보다 약 4% 낮고, 효율이 약 5%포인트 낮다 → 내부 재순환 증가와 맞다 [M16] |\n| 4 | 진동·베어링 온도 추이 | 그대로 → 베어링·회전체 문제가 아니다 |\n| 5 | 정기 보수 개방 점검(09월) | 케이스·임펠러 웨어링의 지름 간극이 설계 0.55 mm에서 1.0~1.2 mm로 벌어져 있었다. 1단 웨어링 면이 고르게 닳았고, 임펠러 날개 끝도 조금 닳았다 |\n\n- 종합 판정: 웨어링 마모로 내부 재순환이 늘어 같은 유량에서 양정이 줄었다. 교체 뒤 성능이 돌아와 판정을 확인했다(4절).\n\n## 3. 원인\n\n- **직접 원인:** 웨어링이 닳아 틈새가 커졌다. 토출 쪽의 고압 액체 일부가 틈새로 흡입 쪽으로 되돌아가(내부 재순환) 같은 유량에서 양정이 줄었다 [M16]. 반응기로 가는 유량은 유량 조절 밸브가 더 열려 지켰다.\n- **원인 분류:** 설비 결함 / 경년 마모(지난 웨어링 교체 뒤 약 4년 운전). 원료 속 미세 고형분이 마모를 거든 것으로 본다(추정).\n- **확정 여부:** 확정(간극 측정과 교체 뒤 회복).\n\n## 4. 조치\n\n| 시기 | 조치 | 결과 |\n|---|---|---|\n| 05~08월 | 월 1회 성능 추이 확인. 경고 전에는 운전을 이어 가기로 함 | 경고 값에 닿지 않음 |\n| 2023-09 정기 보수 | 케이스·임펠러 웨어링 교체, 1단 임펠러 교체 | 간극을 설계값으로 복구 |\n| 10-06 14:00 | 원료 투입 뒤 성능 확인 | 300 m³/h에서 PI-2144 180 kg/cm², 유량 조절 밸브 개도 57%, 축 진동 24 µm |\n\n## 5. 재발 방지\n\n- 성능 추이(같은 유량의 토출 압력, 유량 조절 밸브 개도, 모터 전류) 확인을 분기 1회에서 월 1회로 바꿨다(MAN-P-2104 4.2절).\n- 토출 압력의 통계 알람(평균↓)을 마모의 첫 신호로 본다.\n- 정기 보수마다 웨어링 간극을 재서 기록한다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 캐비테이션 | 토출 압력이 바뀐다 | 흡입 압력 PI-2143이 먼저 내려가고, 토출 압력·유량이 출렁인다. 몇 달에 걸친 꾸준한 하강이 아니다 |\n| 저유량 운전 | 유량 조절 쪽 값이 바뀐다 | 유량 FI-2144가 먼저 줄고 축 진동이 오르며 출렁인다 |\n| 토출 압력 전송기 고장 | PI-2144만 바뀐다 | 현장 압력계와 어긋나고, 유량 조절 밸브 개도와 모터 전류는 그대로다 |\n| 베어링 이상 | 몇 주 이상 서서히 진행한다 | 베어링 온도와 축 진동이 함께 오르고, 토출 압력은 그대로다 |\n\n## 7. 관련 문서\n\n- MAN-P-2104 6.3절(임펠러 마모), 4.2절(성능 추이), 5.4절(토출 압력)\n"},"CASE-P-2104-20250409":{"fm":{"title":"P-2104 유량 조절 밸브 바이패스 전환 중 차단 밸브 오조작으로 토출 유량 급감(저유량 운전)","equipment_ids":"[P-2104]","tag_ids":"[FI-2144, PI-2144, VI-2141X, VI-2141Y, PI-2143]","occurred_at":"2025-04-09 14:22","resolved_at":"2025-04-09 15:30","failure_mode":"PU-LOWF","root_cause":"하류 차단 밸브 오조작","grade":"이상","cause_class_1":"운전 절차","cause_class_2":"작업 순서 착오","detected_by":"토출 유량 경고","downtime_h":"0","written_at":"2025-04-16"},"md":"# P-2104 유량 조절 밸브 바이패스 전환 중 차단 밸브 오조작으로 토출 유량 급감(저유량 운전)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-P-2104-20250409 |\n| 설비 | P-2104 수첨분해 반응기 공급 펌프 (토출부, 반응기 공급 유량 조절 밸브 차단 밸브) |\n| 발생 | 2025-04-09 14:22 (토출 유량이 떨어진 시각) |\n| 종료 | 2025-04-09 15:30 (바이패스 전환을 바른 순서로 마치고 유량 정상 확인) |\n| 발견 경위 | 토출 유량 경고 |\n| 사고 등급 | 이상 (정지 없음, 반응기 공급 유량 약 36분 감소) |\n| 정지 시간 | 0시간 |\n\n## 1. 현상\n\n- 04-09 14:00부터 계장 정비를 위해 반응기 공급 유량 조절 밸브를 바이패스 밸브로 돌리는 작업을 했다. 처리량 설정값은 300 m³/h 그대로였다.\n- 14:22에 토출 유량 FI-2144가 1분 안에 300에서 160 m³/h 안팎으로 떨어졌다. 경고(210 m³/h 아래)가 울렸다. 알람(150 m³/h)에는 닿지 않았다.\n- 같은 시각 토출 압력 PI-2144가 180에서 189 kg/cm²로 올랐다(알람 198 kg/cm² 아래). 1초 값이 ±1% 안팎으로 출렁였다.\n- 축 진동 VI-2141X/Y가 함께 25에서 31~33 µm로 오르고, 1초 값이 ±3 µm 안팎으로 출렁였다. 경고(38 µm)에는 닿지 않았다.\n- 15:00 1시간 요약에서 FI-2144 평균↓, VI-2141X/Y 평균↑·표준편차↑ 통계 알람이 울렸다.\n- 흡입 압력 PI-2143(5.0 kg/cm²)과 베어링 온도 TI-2141(80~81 °C)은 그대로였다.\n- 최소 유량 재순환 밸브는 닫힌 채였다. 유량이 재순환 밸브가 열리는 설정 유량보다 높아, 설계대로 동작한 것이다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 흡입 압력 | 그대로 → 캐비테이션이 아니다 |\n| 2 | 처리량 설정값 | 300 m³/h 그대로 → 처리량 감축이 아니다 |\n| 3 | 진동·토출 압력이 유량과 함께 움직였는지 | 함께 움직임 → 유량계 고장이 아니다 |\n| 4 | 현장 밸브 작업 확인(14:30) | 조절 밸브 앞 차단 밸브가 거의 닫혀 있었고, 바이패스 밸브는 몇 바퀴만 열려 있었다 |\n| 5 | 최소 유량 재순환 밸브 | 닫힘. 유량이 설정 유량보다 높아 정상 동작 |\n\n## 3. 원인\n\n- **직접 원인:** 바이패스 밸브를 충분히 열기 전에 조절 밸브 앞 차단 밸브를 닫았다. 하류가 막혀 펌프 운전점이 성능 곡선을 따라 저유량·고압 쪽으로 밀렸다 [M17]. 유량이 평소(설계 운전점)의 약 53%로 내려갔다. 설계 운전점을 BEP 부근으로 보면 임펠러 안 재순환이 시작되는 영역이다 [P37]. 그래서 진동이 오르고 출렁였다 [M4].\n- **원인 분류:** 운전 절차 / 작업 순서 착오(절차서에 「바이패스를 먼저 열고 유량을 확인한 뒤 차단 밸브를 닫는다」는 순서가 없었다).\n- **확정 여부:** 확정(현장 밸브 위치와 바로잡은 뒤의 회복).\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 14:30 | 차단 밸브를 다시 열고 바이패스 밸브를 닫아 원래 상태로 돌림 | 14:58 FI-2144 300 m³/h, PI-2144 180 kg/cm² |\n| 14:58 | 진동 확인 | VI-2141X/Y 25~26 µm, 출렁임 사라짐 |\n| 15:10 | 바이패스를 조금씩 열며 FI-2144를 확인하고, 그다음 차단 밸브를 닫는 순서로 전환을 다시 함 | 15:30 유량 300 m³/h 유지 확인 |\n\n- 저유량 운전은 약 36분이었다. 베어링 온도와 흡입 압력이 그대로였고, 다음 정비 때 따로 볼 항목은 없다고 판단했다.\n\n## 5. 재발 방지\n\n- 유량 조절 밸브 바이패스 전환 절차서에 순서를 넣었다: 바이패스를 조금씩 열며 FI-2144를 확인한다 → 그다음 차단 밸브를 닫는다.\n- 전환 작업 동안 DCS 운전원이 FI-2144와 PI-2144를 지켜보며 현장과 무전으로 확인한다.\n- 유량이 줄며 토출 압력이 오르면 하류 밸브 조작·하류 막힘을 먼저 확인하도록 교대 교육을 했다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 처리량을 줄였는데 최소 유량 재순환 밸브가 열리지 않음 | 유량이 먼저 줄고 축 진동이 오르며 출렁인다 | 직전에 처리량 설정값을 내렸고, 유량이 설정값을 따라 몇 분에 걸쳐 내려간다. 유량이 재순환 밸브가 열려야 할 설정 유량 아래로 내려갔는데도 밸브 개도가 0이다. 하류 밸브 작업은 없다 |\n| 캐비테이션 | 진동·토출 압력·유량이 출렁인다 | 흡입 압력 PI-2143이 먼저 내려간다 |\n| 유량계 고장 | 유량 값이 떨어진다 | 진동과 토출 압력이 함께 움직이지 않는다 |\n\n- 토출 압력 상승은 하류에서 유량을 줄이면 어느 원인이든 나타날 수 있다(성능 곡선 [M17]). 원인을 가르는 단서는 직전 조작, 유량 설정값, 유량이 떨어진 속도, 재순환 밸브 개도다.\n\n## 7. 관련 문서\n\n- MAN-P-2104 6.2절(저유량 운전), 5.4절(토출 유량·토출 압력)\n"},"CASE-P-2104-20250610":{"fm":{"title":"P-2104 구동측 베어링 온도·진동 함께 상승(윤활유 필터 우회로 이물 혼입)","equipment_ids":"[P-2104]","tag_ids":"[TI-2141, VI-2141X, VI-2141Y]","occurred_at":"2025-06-10 08:00","resolved_at":"2025-06-21 16:00","failure_mode":"PU-BRG","root_cause":"윤활유 필터 우회로 이물 혼입","grade":"C급","cause_class_1":"정비 작업","cause_class_2":"작업 기준 미흡","detected_by":"교대 순회(베어링 온도·진동 추이)","downtime_h":"22","written_at":"2025-06-30"},"md":"# P-2104 구동측 베어링 온도·진동 함께 상승(윤활유 필터 우회로 이물 혼입)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-P-2104-20250610 |\n| 설비 | P-2104 수첨분해 반응기 공급 펌프 (구동측 저널 베어링, 펌프 윤활 장치 필터) |\n| 발생 | 2025-06-10 08:00 (교대 순회에서 온도·진동이 함께 오르는 추이를 본 시각) |\n| 종료 | 2025-06-21 16:00 (베어링 교체 뒤 원료 투입, 온도·진동 정상 확인) |\n| 발견 경위 | 교대 순회(베어링 온도·진동 추이) |\n| 사고 등급 | C급 (베어링 교체를 위해 계획 외 정지) |\n| 정지 시간 | 22시간 |\n\n## 1. 현상\n\n- 06-06 무렵부터 구동측 베어링 메탈 온도 TI-2141이 하루 약 1 °C씩 올랐다. 06-10 교대 순회에서 84 °C인 것을 보고 추이를 확인했다.\n- 같은 기간 구동측 축 진동 VI-2141X/Y가 25 µm에서 30 µm로 함께 올랐다. X·Y의 크기와 모양이 같았다.\n- 06-11부터 TI-2141과 VI-2141X/Y의 통계 알람(평균↑)이 매시간 울렸다.\n- 06-14에 TI-2141이 90 °C를 넘어 경고가 울렸다. 그때 VI-2141X/Y는 33~34 µm였다.\n- 토출 유량 FI-2144(300 m³/h), 흡입 압력 PI-2143(5.0 kg/cm²), 토출 압력 PI-2144(180 kg/cm²)는 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 온도와 진동이 함께 오르는지 | X·Y·온도가 함께 서서히 오름 → 센서 고장이 아니다(MAN-VIB-01 4절) |\n| 2 | 공정값 | 유량·흡입 압력 그대로 → 저유량 운전·캐비테이션이 아니다 |\n| 3 | 현장 윤활 장치(06-10) | 공급 압력·쿨러 출구 온도 정상. 필터 차압이 평소보다 낮았다 |\n| 4 | 윤활유 시료(06-10 채취) | 입자 수(ISO 4406) 21/19/16(관리 목표 16/14/11), 주석 18 ppm(평소 2 ppm 아래), 수분·점도 정상 → 이물이 돌고 배빗이 닳고 있다 |\n| 5 | 필터 분해(06-11) | 05-27 요소 교체 때 끼운 요소의 O-링이 빠져 있었다. 기름 일부가 요소를 거치지 않고 지나갔다 |\n| 6 | 진동 주파수 분석 | 1X가 조금 커짐. 0.4~0.5X 성분 없음 → 기름막 불안정(오일 휠)이 아니다 [원심 27] |\n| 7 | 베어링 분해(06-20) | 아래쪽 배빗 면에 원주 방향 긁힘과 박힌 입자가 있었다. 저널 면은 이상 없음 |\n\n- 종합 판정: 걸러지지 않은 이물이 배빗 면을 긁어 베어링이 손상됐다. 필터를 바로잡은 뒤 상승은 멈췄지만 온도가 내려오지 않아 베어링을 교체했다.\n\n## 3. 원인\n\n- **직접 원인:** 필터 요소를 바꿀 때 O-링을 빠뜨려 기름 일부가 걸러지지 않고 베어링으로 갔다. 기름 속 입자가 배빗 면을 긁어 간극이 커지고 마찰열이 생겨, 베어링 온도와 축 진동이 함께 올랐다.\n- **원인 분류:** 정비 작업 / 작업 기준 미흡(요소 교체 뒤 O-링과 차압을 확인하는 항목이 없었다).\n- **확정 여부:** 확정(필터·베어링 분해 확인).\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 06-11 | 필터 요소를 O-링과 함께 다시 끼움. 이동식 정화 장치로 기름을 돌려 거름 | 06-13 입자 수 17/15/12. 온도 상승은 멈췄으나 내려오지 않음 |\n| 06-14 | 경고 뒤 공정 부서와 정지 계획 협의 | TI-2141이 90~92 °C(알람 95 °C 아래)에 머물러 06-20 정지로 정함 |\n| 06-20 06:00 | 원료 투입을 멈추고 펌프 정지. 구동측 베어링 교체, 기름 전량 교체 | |\n| 06-21 04:00 | 기동, 원료 투입 | 16:00 TI-2141 79 °C, VI-2141X/Y 24 µm |\n\n## 5. 재발 방지\n\n- 필터 요소 교체 작업 기준에 O-링 확인과 교체 뒤 차압 확인을 넣었다. 교체 뒤 차압이 평소보다 낮으면 조립을 다시 본다.\n- 윤활유 입자 수와 배빗 성분을 월 1회 시료 분석에 넣었다(MAN-P-2104 4.2절).\n- 베어링 온도와 축 진동이 함께 오르는 추이를 교대 순회 점검 항목에 넣었다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 저유량 운전 | 축 진동이 오른다 | 유량 FI-2144가 먼저 줄고 진동이 출렁인다. 베어링 온도는 그대로다 |\n| 캐비테이션 | 진동이 흔들린다 | 흡입 압력 PI-2143이 먼저 내려가고 토출 압력·유량이 출렁인다. 베어링 온도는 그대로다 |\n| 윤활 장치 문제(공급 압력 저하, 쿨러 성능 저하) | 베어링 온도가 오른다 | 현장 공급 압력이나 쿨러 출구 온도가 벗어나 있다. 시료의 입자 수·배빗 성분은 그대로다 |\n| 센서 고장 | 한 태그가 이상하다 | 몇 초짜리 튐이거나 값이 고정되고, X·Y·온도가 함께 움직이지 않는다 |\n\n## 7. 관련 문서\n\n- MAN-P-2104 6.4절(베어링 이상), 5.1절(베어링 메탈 온도), 4.2절(윤활유 시료 분석)\n"},"CASE-P-2104-20250821":{"fm":{"title":"P-2104 흡입 드럼 압력 저하로 생긴 캐비테이션(드럼 압력 조절 밸브 열림 고착)","equipment_ids":"[P-2104]","tag_ids":"[PI-2143, PI-2144, FI-2144]","occurred_at":"2025-08-21 01:50","resolved_at":"2025-08-21 09:00","failure_mode":"PU-CAV","root_cause":"흡입 드럼 압력 저하","grade":"이상","cause_class_1":"설비 결함","cause_class_2":"계장 부품 결함","detected_by":"흡입 압력 경고","downtime_h":"0","written_at":"2025-08-28"},"md":"# P-2104 흡입 드럼 압력 저하로 생긴 캐비테이션(드럼 압력 조절 밸브 열림 고착)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-P-2104-20250821 |\n| 설비 | P-2104 수첨분해 반응기 공급 펌프 (흡입부, 흡입 드럼 압력 조절 밸브) |\n| 발생 | 2025-08-21 01:50 (흡입 압력이 내려가기 시작한 시각) |\n| 종료 | 2025-08-21 09:00 (조절 밸브 수리 뒤 자동 제어 복귀) |\n| 발견 경위 | 흡입 압력 경고 |\n| 사고 등급 | 이상 (정지 없음) |\n| 정지 시간 | 0시간 |\n\n## 1. 현상\n\n- 01:50부터 흡입 압력 PI-2143이 5.0 kg/cm²에서 내려가기 시작했다. 약 40분 동안 거의 일정한 속도로 3.95 kg/cm²까지 내려갔다.\n  - 02:08에 경고(4.5 kg/cm² 아래), 02:24에 알람(4.0 kg/cm² 아래)이 울렸다.\n- 02:12 무렵 PI-2143이 4.3 kg/cm² 아래로 내려가자, 토출 압력 PI-2144와 토출 유량 FI-2144의 1초 값이 ±2% 안팎으로 출렁이기 시작했다. 현장에서 펌프 케이싱 쪽 소음이 들렸다.\n- 유량 평균은 유량 조절 밸브가 300 m³/h로 지켰다. 밸브 개도가 출렁였다.\n- 03:00 1시간 요약에서 PI-2143 평균↓, PI-2144·FI-2144 표준편차↑ 통계 알람이 울렸다.\n- 축 진동 VI-2141X/Y는 25에서 27 µm로 조금 올랐다. 베어링 온도 TI-2141은 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 흡입 압력이 내려간 속도 | 40분 만에 약 1 kg/cm² → 며칠에 걸쳐 진행하는 스트레이너 막힘의 모양이 아니다 |\n| 2 | 공정 DCS의 흡입 드럼 압력·레벨 | 드럼 압력이 같은 시간에 같은 크기로 내려갔다. 레벨은 그대로 |\n| 3 | 현장 흡입 스트레이너 차압(02:20) | 약 2.5 psi(0.18 kg/cm²), 깨끗할 때 값 [P32] → 막힘이 아니다 |\n| 4 | 드럼 압력 조절 밸브(02:25) | 플레어로 빼는 쪽 밸브가 제어 출력과 상관없이 열린 채였다. 포지셔너 피드백 링크가 풀려 있었다 |\n\n- 종합 판정: 흡입 드럼 압력이 떨어져 흡입 압력이 같이 내려갔고, 흡입 쪽 여유가 모자라 캐비테이션이 났다.\n\n## 3. 원인\n\n- **직접 원인:** 흡입 드럼의 압력 조절 밸브(플레어로 빼는 쪽)가 포지셔너 링크가 풀리며 열린 채 고착됐다. 드럼 압력이 약 1 kg/cm² 내려갔고, 흡입 압력이 같은 만큼 내려가 흡입 쪽 여유(NPSHa)가 모자랐다. 그래서 캐비테이션이 났다 [M10][M12].\n- **원인 분류:** 설비 결함 / 계장 부품 결함(포지셔너 링크 풀림).\n- **확정 여부:** 확정(밸브 점검과 수리 뒤 회복).\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 02:30 | 조절 밸브를 수동으로 돌리고 플레어 쪽 차단 밸브를 닫음. 블랭킷 가스 공급을 늘림 | 02:50 무렵 출렁임 멈춤. 03:05 PI-2143 5.0 kg/cm² 회복 |\n| 08:30 | 포지셔너 링크 수리, 밸브 작동 확인 | 09:00 자동 제어 복귀 |\n\n- 캐비테이션은 약 40분 이어졌다(02:12~02:50). 다음 정비 때 임펠러 입구 침식을 확인하기로 했다 [M10].\n\n## 5. 재발 방지\n\n- 공정 DCS에 흡입 드럼 압력 낮음 알람을 추가하고, 알람 문구에 「P-2104 흡입 압력 확인」을 넣었다.\n- 드럼 압력 조절 밸브 포지셔너 링크 점검을 계장 예방 정비 항목에 넣었다.\n- 흡입 압력 경고가 나면 드럼 압력·레벨과 스트레이너 차압을 함께 보도록 교대 교육을 했다(MAN-P-2104 5.3절).\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 흡입 스트레이너 막힘 | 흡입 압력이 먼저 내려가고, 낮아지면 토출 압력·유량이 출렁인다 | 며칠에 걸쳐 서서히 내려간다. 흡입 드럼 압력·레벨은 그대로이고 현장 스트레이너 차압이 오른다(깨끗할 때 2~3 psi, 경보 5 psi [P32]). 유량 조절 밸브가 메우는 동안 유량 평균은 그대로다 [P35] |\n| 흡입 드럼 레벨 저하 | 흡입 압력이 몇 분~몇 시간 만에 내려간다 | 드럼 레벨이 내려가고 드럼 압력은 그대로다 |\n| 저유량 운전 | 토출 압력이 출렁이고 진동이 오른다 | 유량 FI-2144가 먼저 줄고 흡입 압력은 그대로다 |\n| 흡입 압력 전송기 고장 | PI-2143만 내려간다 | 토출 압력·유량이 출렁이지 않고, 드럼 압력과 현장 압력계는 그대로다 |\n\n## 7. 관련 문서\n\n- MAN-P-2104 6.1절(캐비테이션), 5.3절(흡입 압력)\n"},"CASE-T-2101-20230417":{"fm":{"title":"T-2101 배기 쪽 축 진동 계단 상승(커플링 체결 너트 풀림)","equipment_ids":"[T-2101]","tag_ids":"[VI-2111X, VI-2111Y, TI-2111, VI-2101X, VI-2101Y]","occurred_at":"2023-04-17 14:20","resolved_at":"2023-04-20 20:00","failure_mode":"TU-COUP","root_cause":"커플링 체결 너트 풀림","grade":"C급","cause_class_1":"정비 작업","cause_class_2":"체결 토크 관리 미흡","detected_by":"축 진동 경고","downtime_h":"34","written_at":"2023-04-28"},"md":"# T-2101 배기 쪽 축 진동 계단 상승(커플링 체결 너트 풀림)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-T-2101-20230417 |\n| 설비 | T-2101 재순환 가스 압축기 구동 증기 터빈 (배기 쪽 커플링) |\n| 발생 | 2023-04-17 14:20 (진동이 처음 계단처럼 뛴 시각) |\n| 종료 | 2023-04-20 20:00 (재체결 뒤 기동해 진동 정상 확인) |\n| 발견 경위 | 축 진동 경고 |\n| 사고 등급 | C급 (점검을 위해 계획 외 정지) |\n| 정지 시간 | 34시간 |\n\n## 1. 현상\n\n- 04-17 14:20에 배기 쪽 축 진동 VI-2111X가 25 µm에서 41 µm로, VI-2111Y가 25 µm에서 39 µm로 한 번에 뛰었다. 몇 초 안에 바뀐 뒤 그 값에 머물렀다. 두 태그 모두 경고(38 µm)가 울렸다.\n- 진동 감시 계기에서 1X 성분이 대부분이었고, 1X 위상이 계단과 같은 때 약 140° 바뀌었다.\n- 04-19 03:10에 두 번째 계단이 생겼다. VI-2111X 52 µm, VI-2111Y 49 µm가 됐고 VI-2111X 알람(50 µm)이 울렸다.\n- 그동안 다른 값은 그대로였다.\n  - 압축기 구동측 축 진동 VI-2101X/Y: 25~27 µm\n  - 터빈 베어링 메탈 온도 TI-2111: 80 °C 안팎\n  - 회전수 SI-2116 9,500 rpm, 입구 증기 압력 PI-2113 42 kg/cm², 1단 후 압력 PI-2114 30 kg/cm²\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | X·Y 비교 | 두 프로브가 같은 때 같은 모양으로 뜀 → 센서 고장이 아니다(MAN-VIB-01 4절) |\n| 2 | 커플링 반대쪽(압축기 구동측) 진동 | 그대로 → 정렬 불량이 아니다(MAN-C-2100 6.6절) |\n| 3 | 베어링 온도, 증기 압력, 회전수 | 그대로 → 베어링·공정 쪽 문제가 아니다 |\n| 4 | 진동 분석 | 1X가 대부분이고 2X는 작음. 1X 크기와 위상이 계단처럼 바뀜 → 로터의 질량 불균형이 갑자기 바뀌었다 [T16] |\n| 5 | 정비 기록 | 02월 정기 점검 때 커플링을 분해·조립했다. 잠금 와셔를 새것으로 바꾸지 않았고 체결 토크 기록이 없었다 |\n| 6 | 정지 뒤 점검(04-19) | 터빈 쪽 커플링 허브의 체결 너트가 풀려 있었고, 허브 접촉면에 미끄러진 자국(프레팅)이 있었다. 보어스코프로 본 날개는 이상이 없었다 |\n\n- 종합 판정: 커플링 체결 너트가 풀려 커플링이 축 위에서 조금씩 움직이며 질량 중심이 두 번 바뀐 것으로 판정했다.\n\n## 3. 원인\n\n- **직접 원인:** 터빈 쪽 커플링 허브 체결 너트가 풀렸다. 커플링이 축 위에서 조금 움직이며 로터의 질량 중심이 갑자기 바뀌었고, 1X 진동이 계단처럼 뛰고 위상이 바뀌었다 [T16].\n- **원인 분류:** 정비 작업 / 체결 토크 관리 미흡(잠금 와셔 재사용, 토크 기록 없음).\n- **확정 여부:** 확정. 분해 점검과 재체결 뒤의 회복으로 확인했다.\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 04-19 03:30 | 진동을 1시간마다 기록하며 운전 유지, 유닛 부하 조정 준비 | 더 오르지 않음 |\n| 04-19 08:00 | 계획 정지 | — |\n| 04-19 ~ 04-20 | 너트와 잠금 와셔를 새것으로 교체, 허브 접촉면 손질, 규정 토크로 체결, 커플링 흔들림(런아웃) 확인 | 허용 범위 안 |\n| 04-20 18:00 | 재기동 | 20:00 VI-2111X 26 µm, VI-2111Y 25 µm, 1X 위상이 풀리기 전 값으로 돌아옴 |\n\n## 5. 재발 방지\n\n- 커플링 체결 작업에 체결 토크 기록과 잠금 부품 새것 교체를 필수 항목으로 넣었다.\n- 정비 뒤 기동하면 1X 크기와 위상을 기록해 두고 정비 전 값과 비교한다(MAN-T-2101 4.2절).\n- 매 교대에 VI-2111X/Y가 계단처럼 뛰었는지 본다(MAN-T-2101 4.1절).\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 고장 | 같은 점 | 다른 점 |\n|---|---|---|\n| 날개 파손 | 1X가 계단처럼 뛰고 위상이 바뀐다 | 데이터만으로는 가르기 어렵다. 정지해 커플링 체결 상태와 날개(보어스코프)를 함께 본다 |\n| 정렬 불량 | 터빈 진동이 오른다 | 압축기 구동측 진동 VI-2101X/Y도 함께 오르고, 2X·축 방향 성분이 크다 |\n| 러빙·축 열 휨 | 1X가 커진다 | 기동 직후 몇 분~수십 분에 걸쳐 서서히 오른다 [T15] |\n| 베어링 이상 | 진동이 오른다 | 베어링 온도 TI-2111이 함께 오른다 |\n| 센서 고장 | 진동 값이 뛴다 | X·Y 중 하나만 움직이고, 몇 초 뒤 돌아오거나 한 값에 고정된다 |\n\n## 7. 관련 문서\n\n- MAN-T-2101 6.3절(커플링 풀림·날개 파손), 5.2절(축 진동)\n- MAN-C-2100 6.6절(정렬 불량)\n"},"CASE-T-2101-20240902":{"fm":{"title":"T-2101 1단 후 압력 서서히 상승(증기 나트륨염에 따른 증기 통로 퇴적)","equipment_ids":"[T-2101]","tag_ids":"[PI-2114, PI-2113, SI-2116, FI-2104]","occurred_at":"2024-09-02 09:00","resolved_at":"2024-10-31 17:00","failure_mode":"TU-DEPO","root_cause":"보일러 캐리오버에 따른 나트륨염 퇴적","grade":"이상","cause_class_1":"공정 조건","cause_class_2":"증기 품질 이상(보일러 캐리오버)","detected_by":"1단 후 압력 통계 알람(평균)","downtime_h":"0","written_at":"2024-11-12"},"md":"# T-2101 1단 후 압력 서서히 상승(증기 나트륨염에 따른 증기 통로 퇴적)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-T-2101-20240902 |\n| 설비 | T-2101 재순환 가스 압축기 구동 증기 터빈 (노즐·날개, 1단 후 휠 챔버) |\n| 발생 | 2024-09-02 09:00 (1단 후 압력 통계 알람이 처음 울린 시각) |\n| 종료 | 2024-10-31 17:00 (운전 중 세척을 마치고 1단 후 압력 회복 확인) |\n| 발견 경위 | 1단 후 압력 통계 알람(평균↑) |\n| 사고 등급 | 이상 (정지 없음) |\n| 정지 시간 | 0시간 |\n\n## 1. 현상\n\n- 09-02 09:00에 1단 후 압력 PI-2114의 통계 알람(평균↑)이 처음 울렸다. 그 시간 평균은 30.5 kg/cm²였다.\n- 지난 기록을 거슬러 보니 04월부터 같은 회전수(9,500 rpm)·같은 압축기 유량(120,000 Nm³/h 안팎)에서 평소 30 kg/cm²였던 값이 다섯 달에 걸쳐 서서히 올라 있었다.\n- 그 뒤에도 계속 올라 09-25에 31.5 kg/cm²를 넘어 경고가 울렸다. 세척을 시작한 10-07에는 31.6 kg/cm²였다.\n- 같은 부하에서 조속 밸브 개도가 봄보다 더 열려 있었다(제어 화면).\n- 다른 값은 그대로였다.\n  - 입구 증기 압력 PI-2113: 42 kg/cm² 안팎\n  - 회전수 SI-2116: 9,500 rpm, 출렁임 없음\n  - 압축기 흡입 유량 FI-2104와 토출 압력 PI-2103: 평소 값 부근\n  - 축 진동 VI-2111X/Y 25~26 µm, 베어링 메탈 온도 TI-2111 80 °C 안팎\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 1단 후 압력 전송기 | 현장 압력계와 같은 값, 영점 정상 → 전송기 드리프트가 아니다 |\n| 2 | 같은 회전수·유량끼리 비교 | 1단 후 압력과 조속 밸브 개도가 함께 커짐 → 증기 통로가 좁아졌다 [T14] |\n| 3 | 입구 증기 압력 | 그대로 → 헤더 압력 변화가 아니다 |\n| 4 | 증기 품질 기록(유틸리티 부서) | 03월 말부터 보일러 드럼 수위 제어가 불안정해 물방울이 증기에 섞여 나갔고(캐리오버), 증기 나트륨이 늘어 있었다 |\n| 5 | 축 진동, 베어링 온도 | 그대로 → 날개 파손·베어링 문제가 아니다 |\n\n- 종합 판정: 증기에 섞여 들어온 나트륨염이 노즐과 날개에 쌓여 통로가 좁아진 것으로 판정했다.\n\n## 3. 원인\n\n- **직접 원인:** 보일러 드럼 수위 제어 이상으로 캐리오버가 생겨 나트륨염이 섞인 증기가 터빈에 들어왔다. 염이 노즐과 날개에 쌓여 통로가 좁아졌고, 같은 증기 유량에서 1단 후 압력이 올랐다 [T14].\n- **원인 분류:** 공정 조건 / 증기 품질 이상(보일러 캐리오버).\n- **확정 여부:** 확정. 세척 중 배수에서 나트륨이 많이 나왔고, 세척 뒤 1단 후 압력과 밸브 개도가 돌아왔다.\n\n## 4. 조치\n\n| 날짜 | 조치 | 결과 |\n|---|---|---|\n| 09-12 | 보일러 드럼 수위 제어 밸브 정비(유틸리티 부서) | 증기 나트륨이 평소 수준으로 돌아옴 |\n| 10-07 ~ 10-30 | 제조사 지침에 따라 운전 중 세척. 물을 뿌려 증기 습도를 높이고 정격 회전수로 운전을 이어 감 | 1단 후 압력이 서서히 내려감. 2~4주에 회복한 제조사 사례와 비슷한 흐름이었다 [T14] |\n| 10-31 | 경과 확인 후 종료 | PI-2114 30.2 kg/cm², 조속 밸브 개도가 봄 수준, 통계 알람 해제 |\n\n## 5. 재발 방지\n\n- 1단 후 압력과 조속 밸브 개도를 같은 회전수·유량끼리 비교하는 점검을 월 1회로 정했다(MAN-T-2101 4.2절).\n- 증기 나트륨·실리카가 늘면 유틸리티 부서가 회전기계팀에 바로 알리도록 연락 체계를 만들었다.\n- 다음 정기 보수 때 노즐과 날개를 보어스코프로 본다.\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 1단 후 압력 전송기 드리프트 | PI-2114만 서서히 오른다 | 현장 압력계와 값이 다르고, 조속 밸브 개도는 그대로다 |\n| 부하(유량) 증가 | PI-2114가 오른다 | 회전수와 압축기 유량이 함께 올라 있다. 같은 부하끼리 비교하면 그대로다 |\n| 입구 증기 압력 변화 | 터빈 쪽 압력이 바뀐다 | 입구 압력 PI-2113이 먼저 또는 함께 움직인다 |\n| 조속 밸브 고착·헌팅 | 조속 밸브 쪽 이상이다 | 회전수 SI-2116이 출렁이고, 1단 후 압력의 1시간 평균은 그대로다 |\n| 날개 파손 | 터빈 내부 문제다 | 축 진동 VI-2111X/Y가 계단처럼 뛴다 |\n\n## 7. 관련 문서\n\n- MAN-T-2101 6.1절(증기 통로 퇴적), 5.4절(1단 후 압력), 4.2절(정기 점검)\n"},"CASE-T-2101-20250317":{"fm":{"title":"T-2101 회전수 완만한 출렁임(조속 밸브 링크 마모로 생긴 유격)","equipment_ids":"[T-2101]","tag_ids":"[SI-2116, FI-2104]","occurred_at":"2025-03-17 06:40","resolved_at":"2025-03-19 20:00","failure_mode":"TU-GOV","root_cause":"조속 밸브 링크 마모","grade":"C급","cause_class_1":"설비 결함","cause_class_2":"부품 마모(링크 윤활 누락)","detected_by":"회전수 통계 알람(표준편차)","downtime_h":"8","written_at":"2025-03-27"},"md":"# T-2101 회전수 완만한 출렁임(조속 밸브 링크 마모로 생긴 유격)\n\n| 항목 | 내용 |\n|---|---|\n| 문서 ID | CASE-T-2101-20250317 |\n| 설비 | T-2101 재순환 가스 압축기 구동 증기 터빈 (조속 밸브 링크) |\n| 발생 | 2025-03-17 06:40 (회전수가 출렁이기 시작한 시각) |\n| 종료 | 2025-03-19 20:00 (링크 부품 교체 뒤 자동 제어로 안정) |\n| 발견 경위 | 회전수 통계 알람(표준편차↑) |\n| 사고 등급 | C급 (부품 교체를 위해 계획 외 정지) |\n| 정지 시간 | 8시간 |\n\n## 1. 현상\n\n- 03-17 06:40부터 회전수 SI-2116이 9,500 rpm을 가운데 두고 위아래 약 25 rpm으로 출렁였다.\n  - 계단 없이 완만한 물결 모양이었고, 한 주기가 약 30~45초였다.\n  - 처음부터 거의 같은 폭으로 이어졌다. 끊겼다가 다시 나타나거나 점점 커지지 않았다.\n- 07:00~08:00 1시간 요약에서 회전수 통계 알람(표준편차↑)이 울렸다. 1시간 평균은 9,500 rpm 그대로라 한계값 알람은 없었다.\n- 압축기 흡입 유량 FI-2104가 같은 주기로 위아래 약 300 Nm³/h 출렁였다. 경고(96,000 Nm³/h)에는 닿지 않았다. 토출 압력 PI-2103은 170 kg/cm² 안팎 그대로였다.\n- 입구 증기 압력 PI-2113(42 kg/cm²), 1단 후 압력 PI-2114의 1시간 평균(30 kg/cm²), 축 진동 VI-2111X/Y(25 µm), 베어링 메탈 온도 TI-2111(80 °C)은 그대로였다.\n\n## 2. 점검\n\n| 순서 | 점검 | 결과 |\n|---|---|---|\n| 1 | 입구 증기 압력 | 출렁이지 않음 → 증기 쪽 원인이 아니다 |\n| 2 | 과속 감지용 회전수 채널 셋, 압축기 유량 | 셋이 함께 출렁이고 유량도 따라감 → 센서 고장이 아니다 |\n| 3 | 압축기 유량이 먼저 떨어지는지, 축 위치 ZI-2105A | 그렇지 않음, 축 위치 그대로 → 서지가 아니다(MAN-C-2100 6.4절) |\n| 4 | 조속기 게인 변경 이력 | 없음 → 게인 과다가 아니다 [P15] |\n| 5 | 제어 출력, 구동기 위치, 밸브 스템 위치(제어 화면·현장) | 제어 출력과 구동기는 매끄럽게 함께 움직임 → 구동기(서보 밸브)가 붙지 않았다. 움직이는 방향이 바뀔 때마다 구동기가 먼저 움직이고 밸브 스템이 늦게 따라옴 → 링크에 유격이 있다 |\n| 6 | 조속기 유압 오일 시료 | 수분·산가·오염도 모두 정상 → 유압 오일 문제가 아니다 |\n| 7 | 현장 링크 점검 | 구동기 로드와 밸브 랙을 잇는 링크의 핀과 부싱이 닳아 손으로 밀어도 유격이 느껴짐. 링크 윤활 기록이 1년 넘게 없었다 |\n\n- 종합 판정: 링크 핀·부싱 마모로 생긴 유격 때문에 밸브가 구동기를 늦게 따라가 회전수가 출렁인 것으로 판정했다.\n\n## 3. 원인\n\n- **직접 원인:** 조속 밸브 구동기와 밸브 랙을 잇는 링크의 핀·부싱이 닳아 유격이 생겼다. 움직이는 방향이 바뀔 때 구동기가 유격만큼 움직인 뒤에야 밸브가 따라가므로, 그동안 쌓인 오차 때문에 밸브가 지나치게 움직였다가 되돌아오기를 되풀이했다(추론으로 본 원리).\n- **원인 분류:** 설비 결함 / 부품 마모(링크 윤활 누락).\n- **확정 여부:** 확정. 링크 부품을 바꾼 뒤 출렁임이 사라졌다.\n\n## 4. 조치\n\n| 시각 | 조치 | 결과 |\n|---|---|---|\n| 03-17 10:30 | 밸브 리미터로 조속 밸브 개도를 묶고 운전원이 회전수를 직접 맞춤 | 출렁임이 멈춤, FI-2104도 안정 |\n| 03-19 06:00 ~ 14:00 | 계획 정지(8시간): 링크 핀·부싱·로드 엔드 교체, 윤활, 밸브 행정 다시 맞춤 | 손으로 밀어 유격 없음 확인 |\n| 03-19 14:00 | 재기동, 자동 제어 | 20:00까지 출렁임 없음, 회전수 1시간 표준편차가 평소 수준 |\n\n## 5. 재발 방지\n\n- 조속 밸브 링크 핀·부싱의 유격 측정과 윤활을 분기 점검에 넣었다(MAN-T-2101 4.2절).\n- 매 교대에 제어 출력, 구동기 위치, 밸브 개도가 함께 매끄럽게 움직이는지 본다(MAN-T-2101 4.1절).\n\n## 6. 비슷한 증상과 가르는 법\n\n| 비슷한 원인 | 같은 점 | 다른 점 |\n|---|---|---|\n| 서보 밸브 고착(유압 오일 열화) | 회전수가 출렁이고 압축기 유량이 따라간다 | 회전수가 계단처럼 뛰는 사각파 모양이고 제어 출력은 톱니 모양이다 [P16]. 구동기 자체가 멈춰 있다가 한 번에 뛴다. 유압 오일에 수분·산이 늘고 서보 밸브 필터에 찌꺼기가 있다 [P19]. 링크 유격은 없다 |\n| 제어 게인 과다 | 회전수가 출렁인다 | 게인을 바꾼 뒤부터 나타난다. 비례 게인 과다는 1초 미만, 적분 게인 과다는 1초 넘는 주기다 [P15]. 밸브가 제어 출력을 그대로 따라간다 |\n| 증기 헤더 압력 출렁임 | 회전수가 출렁인다 | 입구 증기 압력 PI-2113이 같은 주기로 출렁인다 |\n| C-2100 서지 | 회전수가 움직이고 유량이 출렁인다 | 압축기 유량 FI-2104가 먼저 크게 떨어지고 축 위치 ZI-2105A가 튄다. 회전수는 순간 오른다 [P12] |\n| 회전수 센서 고장 | SI-2116이 이상하다 | 한 채널만 움직이고 압축기 유량은 따라가지 않는다 |\n\n## 7. 관련 문서\n\n- MAN-T-2101 6.2절(조속 밸브 고착·헌팅), 5.5절(회전수), 4.2절(정기 점검)\n- MAN-C-2100 6.4절(서지)\n"}}};
