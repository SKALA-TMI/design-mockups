function alarmGroups(records=ALARM_RECORDS){
 const active=setpointAlarms(records);
 return EQUIP.map(e=>{
   const alarms=active.filter(a=>a.equipId===e.id),counts={High:0,Medium:0,Low:0};
   alarms.forEach(a=>counts[a.severity]++);
   const severity=['High','Medium','Low'].find(k=>counts[k])||null;
   const exceed=Math.max(0,...alarms.map(a=>a.limit?Math.abs(a.value-a.limit)/Math.abs(a.limit)*100:0));
   const primary=[...alarms].sort((a,b)=>SEVERITY_RANK[b.severity]-SEVERITY_RANK[a.severity]||a.id.localeCompare(b.id))[0];
   return {equipment:e,alarms,counts,severity,total:alarms.length,grade:equipmentGrade(e),exceed,primary};
 });
}
function compareAlarmGroups(a,b){return (SEVERITY_RANK[b.severity]||0)-(SEVERITY_RANK[a.severity]||0)||(a.total&&b.total?(a.grade-b.grade||b.exceed-a.exceed):0)||a.equipment.id.localeCompare(b.equipment.id,undefined,{numeric:true});}

const LIVE={windowMs:120000,intervalMs:1000,maxSamples:310,paused:false,heldAt:0,held:new Map(),series:new Map(),seed:48271,tick:0,timer:null,raf:null,lastPaint:0};
const liveOrigins=new Map(EQUIP.map(e=>[e.id,e.rms]));
function liveRandom(){LIVE.seed=(LIVE.seed*16807)%2147483647;return (LIVE.seed-1)/2147483646;}
function initializeLiveData(now=Date.now()){
  EQUIP.forEach((e,index)=>{
    const samples=[];
    for(let i=0;i<=120;i++){
      let value=e.demo?(i<90?2.4+5*Math.pow(i/90,1.7):7.4):e.rms+.1*(Math.sin(i*.26+index)-Math.sin(120*.26+index));
      if(i===120)value=e.rms;
      samples.push({t:now-(120-i)*1000,v:Number(value.toFixed(2))});
    }
    LIVE.series.set(e.id,samples);
  });
}
function collectLiveSample(now=Date.now()){
  LIVE.tick++;
  EQUIP.forEach((e,index)=>{
    const samples=LIVE.series.get(e.id),previous=samples[samples.length-1];
    if(now<=previous.t)return;
    const origin=liveOrigins.get(e.id);
    const target=origin+(e.demo?.38:.16)*Math.sin(LIVE.tick*.18+index*.7)+(e.demo?.18:.08)*Math.sin(LIVE.tick*.63+index);
    const noise=(liveRandom()-.5)*(e.demo?.2:.08);
    const value=Math.max(e.demo?7.2:.1,Math.min(8.8,previous.v+(target-previous.v)*.38+noise));
    const next={t:now,v:Number(value.toFixed(2))};
    samples.push(next);
    if(samples.length>LIVE.maxSamples)samples.splice(0,samples.length-LIVE.maxSamples);
    e.rms=next.v;
  });
  updateLiveCardValues();
  reorderSensorBoard();
}

function gFinal(w){const t=String(w).trim().replace(/\s*\([^)]*\)$/,''),c=t.slice(-1).charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3)return (c-0xAC00)%28;return /[0-9]$/.test(t)?({0:1,1:8,3:1,6:1,7:8,8:8}[t.slice(-1)]||0):-1;}

function ro(w){const f=gFinal(w);return f<0?'(으)로':f&&f!==8?'으로':'로';}
function gQuoted(t){const m=t.match(/["“”'‘’「『]([^"“”'‘’」』]+)["“”'‘’」』]/);return m?m[1].trim():null;}
function gTail(x){return x.replace(/\s*(?:도\s*)?(?:추가|넣어|넣|삽입|삭제|빼|지워|없애)(?:\s*해)?(?:\s*주세요|\s*줘|\s*줄래|\s*주라)?\s*[.!?~]*$/,'').replace(/\s*(?:으로|로)\s*(?:바꿔|변경|수정|고쳐)(?:\s*해)?(?:\s*주세요|\s*줘)?\s*[.!?~]*$/,'').replace(/\s*(?:을|를)$/,'').trim();}
function gContent(t){
 const q=gQuoted(t);if(q)return q;
 let m=t.match(new RegExp(G_SEC_RE+'\\s*(?:에다가?|에서|에)\\s+(.+)$'));if(m)return gTail(m[1]);

}
function gNewValue(t){const q=gQuoted(t);if(q)return q;const m=t.match(/(?:을|를|은|는)\s*(.+?)\s*(?:으로|로)\s*(?:바꿔|변경|수정|고쳐)/);return m?m[1].trim():null;}
function gSection(t){
 const x=t.replace(/["“”'‘’「『][^"“”'‘’」』]*["“”'‘’」』]/g,' ');
 const rules=[[/안전\s*대책|안전\s*주의|안전/,'safety'],[/예상\s*원인|원인/,'causes'],[/권장\s*조치/,'actions'],[/남은\s*리스크|리스크/,'risks'],[/대안/,'alternatives'],[/주의\s*포인트|주의점/,'watch'],[/출처|참고\s*문서/,'sources'],[/점검|절차|\d+\s*단계/,'checks'],[/조치/,'actions'],[/이상\s*현상|현상/,'phenomena'],[/제조사|연락처|전화|이메일|담당자|모델/,'maker'],[/트렌드|차트/,'trend']];

}

function priorityMessage(text,links=[]){return {id:nextId++,role:'agent',time:liveClock(Date.now()).slice(0,5),fb:null,bm:false,text,links};}

function resolveTrendRequest(text){

 const explicitSensor=/온도/.test(text)?'temperature':/진동/.test(text)?'vibration':null;
 let equipment=idValue?EQUIP.find(e=>e.id===idValue):state.hasContext?EQUIP.find(e=>e.id===state.selected):null;
 if(idValue&&!equipment)return{error:'등록되지 않은 설비 '+idValue+'입니다. 설비 ID를 확인해주세요.'};
 if(!idValue&&!/그 설비|해당|선택|이 설비/.test(text)){
  const compact=text.replace(/\s/g,''),type=compact.match(/원심압축기|왕복동압축기|압축기|펌프|모터|팬|터빈|기어박스/);
  if(type){let candidates=EQUIP.filter(e=>e.type.replace(/\s/g,'').includes(type[0]));const n=compact.match(/(?:#|제)?([1-6])(?:호기|번)/);if(n)candidates=candidates.filter(e=>e.name.includes('#'+n[1]));if(candidates.length===1)equipment=candidates[0];else if(candidates.length>1)return{candidates,sensor:explicitSensor||state.sensor};}
 }
 if(!equipment)return{error:'조회할 설비를 먼저 선택해주세요. 설비 ID와 센서를 알려주시면 해당 조건으로 조회합니다.'};
 const sensor=explicitSensor||state.sensor||'vibration';
 const period=/실시간|2분/.test(text)?'live':/24시간|1일|하루/.test(text)?'1d':/7일|일주일|1주/.test(text)?'7d':state.trendPeriod||'7d';
 const previousTag=equipmentTags(equipment).find(t=>t.id===state.tag&&t.sensor===sensor),tag=previousTag||tagFor(equipment,null,sensor);
 return{equipment,sensor,tag,period};
}

function renderMessages(){const scroll=$('messages').scrollTop;const shown=state.bmOnly?state.msgs.filter(m=>m.bm):state.msgs;$('bookmark-filter').setAttribute('aria-pressed',String(state.bmOnly));$('bookmark-filter').innerHTML=icon('bookmark',14)+'북마크 '+state.msgs.filter(m=>m.bm).length;$('messages').innerHTML=shown.length?shown.map(m=>m.role==='user'?`<div class="user-message"><div class="user-bubble">${esc(m.text)}</div></div>`:`<div class="agent-message"><div class="message-avatar">${icon('avatar',15)}</div><div class="message-body"><div class="agent-bubble">${esc(m.text)}</div>${m.insightData?chatInsightHTML(m):''}${m.links.length?`<div class="message-links">${m.links.map(l=>`<a class="link-pill" href="${screenHref(l.type,l.eq||l.sel||state.selected,l.sensor||state.sensor,l.period,l.tag)}" data-open="${l.type}" data-eq="${l.eq||l.sel||state.selected}" data-sensor="${l.sensor||state.sensor}" ${l.period?`data-period="${l.period}"`: ''} ${l.tag?`data-tag="${l.tag}"`: ''}>${esc(l.label)}${icon('arrow',13)}</a>`).join('')}</div>`:''}<div class="feedback"><span class="num message-time">${esc(m.time)}</span><button class="icon-button up" data-feedback="up" data-message="${m.id}" aria-label="좋아요" aria-pressed="${m.fb==='up'}">${icon('up')}</button><button class="icon-button down" data-feedback="down" data-message="${m.id}" aria-label="싫어요" aria-pressed="${m.fb==='down'}">${icon('down')}</button><button class="icon-button bookmark" data-feedback="bookmark" data-message="${m.id}" aria-label="북마크" aria-pressed="${m.bm}">${icon('bookmark')}</button></div></div></div>`).join(''):'<p class="no-bookmarks">북마크한 메시지가 없습니다.</p>';$('messages').scrollTop=scroll;applyCriticalLocks();}
function applyTheme(){document.documentElement.dataset.theme=state.dark?'dark':'light';document.documentElement.style.setProperty('--fs',state.fs+'px');if($('font-label'))$('font-label').textContent=state.fs+'px';$('theme').setAttribute('aria-label',state.dark?'라이트 테마로 전환':'다크 테마로 전환');$('theme').innerHTML=icon(state.dark?'sun':'moon',18);}
function resizePanel(width){state.panelW=Math.max(300,Math.min(620,Math.round(width)));document.documentElement.style.setProperty('--panel',state.panelW+'px');$('panel-label').textContent=state.panelW+'px';}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
document.addEventListener('click',e=>{const b=e.target.closest('button,a[data-open]');if(!b)return;if(b.tagName==='A')e.preventDefault();if(b.disabled)return;if(b.dataset.equipmentFilter){state.equipmentFilter=b.dataset.equipmentFilter==='all'?'all':'abnormal';renderMain();return;}if(b.dataset.highlightRange!==undefined){const active=state.tabs.find(t=>t.id===state.active);if(active){active.highlightRange=Number(b.dataset.highlightRange);renderMain();}return;}if(b.dataset.open){openTab(b.dataset.open,b.dataset.eq,b.dataset.selected,b.dataset.sensor,b.dataset.period,b.dataset.tag);return;}if(b.dataset.close){closeTab(b.dataset.close);return;}if(b.dataset.select){activateTab(b.dataset.select);return;}if(b.dataset.feedback){const m=state.msgs.find(x=>x.id===Number(b.dataset.message));if(b.dataset.feedback==='bookmark')m.bm=!m.bm;else m.fb=m.fb===b.dataset.feedback?null:b.dataset.feedback;renderMessages();return;}if(/^report-/.test(b.dataset.cmd||'')){reportCommand(b.dataset.cmd,b);return;}
 if(/^guide-/.test(b.dataset.cmd||'')){guideCommand(b.dataset.cmd,b);return;}
 switch(b.dataset.cmd){case'write-guide':writeGuide();break;case'select-guide':if(state.guideMode==='edit'&&state.guideDraft&&!confirm('저장하지 않은 수정 내용이 있습니다. 다른 가이드로 이동할까요?'))break;state.guideSel=Number(b.dataset.index)||0;state.guideMode='view';state.guideDraft=null;renderMain();break;case'analyze-top-chart':analyzeTopChart(b.dataset.section||'trend');break;case'chat-insight-card':{const m=state.msgs.find(x=>x.id===Number(b.dataset.message));if(m){m.insightOpen=m.insightOpen===b.dataset.key?null:b.dataset.key;renderMessages();}break;}case'sensor-insight':toggleSensorInsight(b.dataset.tag);break;case'insight-card':toggleInsightCard(b.dataset.tag,b.dataset.key);break;case'insight-refresh':refreshSensorInsight(b.dataset.tag);break;case'write-report':writeReport();break;case'select-report':if(state.reportMode==='edit'&&state.reportDraft&&!confirm('저장하지 않은 수정 내용이 있습니다. 다른 보고서로 이동할까요?'))break;state.reportSel=Number(b.dataset.index)||0;state.reportMode='view';state.reportDraft=null;renderMain();break;case'ask-sensor':askAboutSensor(b.dataset.tag);break;case'toggle-alarm-sidebar':toggleAlarmSidebar();break;case'focus-sensor':focusSensor(b.dataset.tag);break;case'pin-top':pinTopSensor();break;case'pin-sensor':toggleSensorPin(b.dataset.tag);break;case'focus-first':openCriticalFocus();break;case'dismiss-critical':dismissCriticalFocus();break;case'explain-trend':const model=currentTrendModel();if(model){state.msgs.push(priorityMessage(model.analysis.summary,[{label:'동일 조건 트렌드',type:'equipment',eq:model.equipment.id,sensor:model.tag.sensor}]));state.bmOnly=false;renderMessages();$('messages').scrollTop=$('messages').scrollHeight;state.showAgent=true;document.querySelector('.app').classList.add('show-agent');if(matchMedia('(max-width:900px)').matches)document.querySelector('.agent').scrollIntoView({behavior:'smooth',block:'start'});}break;case'ask-priority':state.showAgent=true;document.querySelector('.app').classList.add('show-agent');document.querySelectorAll('[data-cmd=toggle-agent]').forEach(x=>x.setAttribute('aria-expanded','true'));sendDashboardQuestion('지금 알람 뭐부터 봐야 해?');break;case'toggle-live':toggleLiveView();break;case'toggle-agent':state.showAgent=!state.showAgent;document.querySelector('.app').classList.toggle('show-agent',state.showAgent);document.querySelectorAll('[data-cmd=toggle-agent]').forEach(x=>x.setAttribute('aria-expanded',String(state.showAgent)));break;case'font-down':state.fs=Math.max(12,state.fs-1);applyTheme();break;case'font-up':state.fs=Math.min(18,state.fs+1);applyTheme();break;case'theme':state.dark=!state.dark;applyTheme();break;case'filter-bookmarks':state.bmOnly=!state.bmOnly;renderMessages();break;case'print':window.print();break;case'save-report':try{localStorage.setItem('rotating-equipment-prototype-report-c01',JSON.stringify({title:REPORTS[state.reportSel||0].title,fields:reportFields(REPORTS[state.reportSel||0]),savedAt:new Date().toISOString()}));toast('보고서를 이 브라우저에 저장했습니다.');}catch{toast('브라우저 저장소를 사용할 수 없습니다.');}break;}});
document.addEventListener('change',e=>{if(e.target.id==='trend-equipment'){applyTrendConditions(e.target.value,state.sensor,null,state.trendPeriod);return;}if(e.target.id==='trend-tag'){const equipment=EQUIP.find(x=>x.id===state.selected),tag=equipmentTags(equipment).find(t=>t.id===e.target.value);applyTrendConditions(equipment.id,tag.sensor,tag.id,state.trendPeriod);return;}if(e.target.id==='trend-period'){applyTrendConditions(state.selected,state.sensor,state.tag,e.target.value);return;}if(e.target.id==='equipment-select'){openTab('equipment',e.target.value,e.target.value,state.sensor);return;}if(e.target.id==='sensor-select'){openTab('equipment',state.selected,state.selected,e.target.value);return;}if(e.target.matches('[data-action]'))state.actions[Number(e.target.dataset.action)].done=e.target.checked;});
$('composer').addEventListener('submit',e=>{e.preventDefault();sendDashboardQuestion($('agent-input').value);});
$('agent-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.isComposing)e.preventDefault();});
$('resize').addEventListener('pointerdown',e=>{drag={x:e.clientX,w:state.panelW};e.currentTarget.setPointerCapture(e.pointerId);});
$('resize').addEventListener('pointermove',e=>{if(drag)resizePanel(drag.w+drag.x-e.clientX);});
for(const event of['pointerup','pointercancel'])$('resize').addEventListener(event,()=>{drag=null;});
$('resize').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();resizePanel(state.panelW+(e.key==='ArrowLeft'?20:-20));}});
try{const saved=JSON.parse(localStorage.getItem('rotating-equipment-prototype-report-c01'));if(saved&&Array.isArray(saved.actions))state.actions.forEach((a,i)=>{if(typeof saved.actions[i]?.done==='boolean')a.done=saved.actions[i].done;});}catch{}
state.msgs=[priorityMessage(alarmPriorityText(),priorityLinks())];
if(criticalFocusActive()){const g=criticalPriority();state.selected=g.equipment.id;state.sensor=g.primary.sensor;state.tag=g.primary.tag;state.hasContext=true;}
$('agent-logo').innerHTML=icon('robot',18);$('send').innerHTML=icon('send',17);applyTheme();renderMain();renderMessages();startLiveStream();openScreenFromHash();

// Left alarm panel follows every main render.
{const base=renderMain;renderMain=function(...args){const r=base.apply(this,args);syncAlarmPanel();return r;};syncAlarmPanel();}

// Dashboard alert table: sort, page, items per page.
document.addEventListener('click',e=>{const b=e.target.closest('[data-cmd^="alert-"]');if(!b||b.disabled)return;
 if(b.dataset.cmd==='alert-sort'){const k=b.dataset.key,s=state.alertSort||{key:'rank',dir:'asc'};state.alertSort=s.key===k?{key:k,dir:s.dir==='asc'?'desc':'asc'}:{key:k,dir:k==='time'?'desc':'asc'};state.alertPage=1;renderMain();document.querySelector(`[data-cmd="alert-sort"][data-key="${k}"]`)?.focus({preventScroll:true});}
 else if(b.dataset.cmd==='alert-page'){state.alertPage=Number(b.dataset.page)||1;renderMain();(document.querySelector('.pager [aria-current="page"]')||document.querySelector('.pager button:not(:disabled)'))?.focus({preventScroll:true});}});
document.addEventListener('change',e=>{if(e.target.id==='alert-per-page'){state.alertPerPage=Number(e.target.value)||10;state.alertPage=1;renderMain();$('alert-per-page')?.focus({preventScroll:true});}});

// ===== 공지사항 (📢) — 시안용 예시 데이터 =====
const NOTICES=[
 {id:'N-04',tag:'중요',important:true,date:'2026-11-13',title:'11/15(일) 02:00~06:00 모니터링 서버 정기 점검',body:'점검 시간 동안 실시간 센서 수신과 AI Agent가 일시 중단됩니다.\nSetpoint 알람은 SMS로 대체 발송됩니다.\n문의: [운영 담당자]'},
 {id:'N-03',tag:'작업',date:'2026-11-12',title:'C-01 원심 압축기 #1 진동 센서 교체 (11/14 10:00)',body:'구동측·비구동측 진동 센서를 교체합니다.\n작업 중 약 30분간 C-01 진동 값이 결측으로 표시될 수 있습니다.'},
 {id:'N-02',tag:'안내',date:'2026-11-10',title:'설비 중요도 등급 기준 v2 적용',body:'대응 우선순위 계산에 개정된 설비 중요도 등급(1~3등급)을 적용했습니다.\n등급 기준표는 가이드 메뉴에서 확인할 수 있습니다.'},
 {id:'N-01',tag:'안내',date:'2026-11-03',title:'동절기 윤활유 점검 주기 단축 안내',body:'12월부터 2월까지 펌프·모터 윤활유 점검 주기를 4주에서 2주로 단축합니다.'}
];
function noticeReadSet(){if(!state.noticeRead){let saved=[];try{saved=JSON.parse(localStorage.getItem('equipment-notice-read')||'[]');}catch{}state.noticeRead=new Set(saved);}return state.noticeRead;}
function saveNoticeRead(){try{localStorage.setItem('equipment-notice-read',JSON.stringify([...noticeReadSet()]));}catch{}}
function renderNotice(){
 const read=noticeReadSet(),unread=NOTICES.filter(n=>!read.has(n.id)).length,top=NOTICES.find(n=>n.important&&!read.has(n.id))||NOTICES[0];
 const ticker=$('notice-ticker'),count=$('notice-count'),btn=document.querySelector('.notice-button');if(!ticker)return;
 ticker.innerHTML=top?`${top.important?'<b>[중요]</b>':''}${esc(top.title)}`:'공지사항 없음';
 count.hidden=!unread;count.textContent=unread;
 btn.setAttribute('aria-label','공지사항'+(unread?' · 읽지 않은 공지 '+unread+'건':''));
 const panel=$('notice-panel');if(panel.hidden)return;
 panel.innerHTML=`<div class="notice-panel-head"><strong>📢 공지사항</strong><button type="button" class="notice-read-all" data-cmd="notice-read-all" ${unread?'':'disabled'}>모두 읽음</button></div><ul class="notice-list">${NOTICES.map(n=>{const open=state.noticeOpen===n.id,isRead=read.has(n.id);return `<li><button type="button" class="notice-item ${isRead?'read':''}" data-cmd="notice-item" data-id="${n.id}" aria-expanded="${open}"><span class="notice-item-top"><span class="notice-tag ${n.important?'important':''}">${esc(n.tag)}</span><span class="num">${n.date}</span>${isRead?'':'<span class="notice-unread" aria-label="읽지 않음"></span>'}</span><span class="notice-title">${esc(n.title)}</span>${open?`<p class="notice-body">${esc(n.body)}</p>`:''}</button></li>`;}).join('')}</ul><div class="notice-foot">공지 내용은 시안용 예시입니다.</div>`;
}
function setNoticeOpen(open){const panel=$('notice-panel'),btn=document.querySelector('.notice-button');if(!panel)return;panel.hidden=!open;btn.setAttribute('aria-expanded',String(open));if(open){const top=NOTICES.find(n=>n.important&&!noticeReadSet().has(n.id));if(top&&!state.noticeOpen)state.noticeOpen=top.id;}renderNotice();}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-cmd^="notice-"]');
 if(!b){if(!e.target.closest('#notice')&&!$('notice-panel').hidden)setNoticeOpen(false);return;}
 const cmd=b.dataset.cmd;
 if(cmd==='notice-toggle')setNoticeOpen($('notice-panel').hidden);
 else if(cmd==='notice-item'){const id=b.dataset.id;state.noticeOpen=state.noticeOpen===id?null:id;noticeReadSet().add(id);saveNoticeRead();renderNotice();document.querySelector(`.notice-item[data-id="${id}"]`)?.focus({preventScroll:true});}
 else if(cmd==='notice-read-all'){NOTICES.forEach(n=>noticeReadSet().add(n.id));saveNoticeRead();renderNotice();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('notice-panel')&&!$('notice-panel').hidden){setNoticeOpen(false);document.querySelector('.notice-button').focus();}});
renderNotice();

// ===== AI Agent 패널 접기 / 펴기 =====
function setAgentCollapsed(collapsed,focus){
 state.agentCollapsed=collapsed;document.querySelector('.app').classList.toggle('agent-collapsed',collapsed);
 const c=document.querySelector('.agent-collapse'),r=document.querySelector('.agent-rail');
 c.setAttribute('aria-expanded',String(!collapsed));r.setAttribute('aria-expanded',String(!collapsed));
 if(!collapsed)$('agent-rail-new').hidden=true;
 try{localStorage.setItem('equipment-agent-collapsed',collapsed?'1':'0');}catch{}
 if(focus)(collapsed?r:c).focus({preventScroll:true});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cmd="collapse-agent"]');if(b)setAgentCollapsed(!state.agentCollapsed,true);});
$('agent-rail-icon').innerHTML=icon('robot',18);
// 접힌 상태에서 화면의 'AI에 묻기' 류 버튼으로 새 답변이 오면 패널을 자동으로 펼친다.
{let seen=state.msgs.length;const base=renderMessages;renderMessages=function(...args){const grew=state.msgs.length>seen;seen=state.msgs.length;if(grew&&state.agentCollapsed&&getComputedStyle(document.querySelector('.agent-rail')).display!=='none')setAgentCollapsed(false);return base.apply(this,args);};}
try{if(localStorage.getItem('equipment-agent-collapsed')==='1')setAgentCollapsed(true);}catch{}

// ===== 1순위 알람 애니메이션: 확인(Ack) 전까지 경광등처럼 깜빡임 =====
// 같은 1순위 설비·알람 조합을 확인하면 멈추고, 1순위가 바뀌거나 새 알람이 붙으면 다시 켜진다.
function firstAckKey(){const g=responseOrder()[0];return g?g.equipment.id+':'+g.alarms.map(a=>a.id).sort().join(','):'';}
function firstAlarming(){const k=firstAckKey();return !!k&&state.firstAck?.key!==k;}
function firstAckButton(){
 if(firstAlarming())return `<button type="button" class="button first-hero-ack" data-cmd="ack-first" aria-label="1순위 알람 확인, 깜빡임 멈춤"><span aria-hidden="true">🔕</span> 알람 확인</button>`;
 return `<button type="button" class="first-hero-acked" data-cmd="unack-first" aria-label="알람 확인 취소, 깜빡임 다시 켜기"><span class="num">${state.firstAck.at}</span> 확인됨 · 다시 켜기</button>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cmd="ack-first"],[data-cmd="unack-first"]');if(!b)return;
 const ack=b.dataset.cmd==='ack-first';state.firstAck=ack?{key:firstAckKey(),at:liveClock(Date.now()).slice(0,5)}:null;
 renderMain();document.querySelector(ack?'[data-cmd="unack-first"]':'[data-cmd="ack-first"]')?.focus({preventScroll:true});
 toast(ack?'1순위 알람을 확인했습니다 · 깜빡임을 멈춥니다':'1순위 알람 깜빡임을 다시 켰습니다');});
</script>
